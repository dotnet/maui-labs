# Azure DevOps official build pipeline for DevFlow, Cli, and Linux GTK4.
# Uses Arcade build system with 1ES Pipeline Templates for security compliance.
# All products build in parallel; each can be published to NuGet.org independently.

trigger:
  batch: true
  branches:
    include:
    - main
    - release/*

pr: none

parameters:
- name: publishDevFlowNuget
  displayName: 'Publish DevFlow packages to NuGet.org'
  type: boolean
  default: false
- name: publishCliNuget
  displayName: 'Publish Cli packages to NuGet.org'
  type: boolean
  default: false
- name: publishLinuxGtk4Nuget
  displayName: 'Publish Linux GTK4 packages to NuGet.org'
  type: boolean
  default: false

variables:
- template: /eng/pipelines/common-variables.yml@self
- name: _BuildConfig
  value: Release
- name: _SignType
  value: real
- name: PostBuildSign
  value: false

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: NetCore1ESPool-Internal
      image: windows.vs2026preview.scout.amd64
      os: windows
    # Required for publishing to external feeds like nuget.org
    settings:
      networkIsolationPolicy: Permissive

    # TODO: Linux GTK4 build disabled until a dotnet-buildtools-prereqs image
    # with GTK4/WebKitGTK dev packages is available. CFS network isolation
    # blocks apt-get in containers on the internal pool.
    # See: https://github.com/dotnet/dotnet-buildtools-prereqs-docker
    # containers:
    #   ubuntu2404:
    #     image: mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-24.04

    stages:
    - stage: build
      displayName: Build
      jobs:
      - template: /eng/common/templates-official/jobs/jobs.yml@self
        parameters:
          enableMicrobuild: true
          enablePublishBuildAssets: true
          enablePublishBuildArtifacts: true
          enablePublishTestResults: true
          testResultsFormat: xunit
          enableTelemetry: true
          jobs:
          # DevFlow Agent/Blazor need macOS-built Apple assets and Windows-built
          # Windows assets. Keep raw packages isolated, then publish only the
          # merged packages from the final Windows job.
          - job: DevFlow_MacRawPackages
            displayName: DevFlow - macOS raw packages
            pool:
              name: Azure Pipelines
              vmImage: macOS-15
              os: macOS
            strategy:
              matrix:
                Release:
                  _BuildConfig: Release
                  _OfficialBuildArgs: /p:DotNetSignType=$(_SignType)
                    /p:TeamName=$(_TeamName)
                    /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
            templateContext:
              outputs:
              - output: pipelineArtifact
                displayName: Publish DevFlow macOS raw packages
                targetPath: '$(Build.ArtifactStagingDirectory)/raw-packages-devflow-macos'
                artifactName: DevFlowRawPackages_macOS
                condition: succeeded()
                sbomEnabled: false
            steps:
            - script: ./eng/common/dotnet.sh --info
              displayName: Provision .NET SDK via Arcade
            - script: ./.dotnet/dotnet workload install maui macos maui-tizen
              displayName: Install MAUI workloads
            - script: ./.dotnet/dotnet build -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true src/DevFlow/Microsoft.Maui.DevFlow.Agent/Microsoft.Maui.DevFlow.Agent.csproj
              displayName: Install Android SDK dependencies
            - script: ./eng/common/build.sh
                --configuration $(_BuildConfig)
                --prepareMachine
                --restore
                --build
                --test
                --pack
                --ci
                --projects $(Build.SourcesDirectory)/src/DevFlow/DevFlow.slnf
                $(_OfficialBuildArgs)
              displayName: Build, Test and Pack DevFlow raw packages
            - pwsh: |
                $rawPackagesDir = '$(Build.ArtifactStagingDirectory)/raw-packages-devflow-macos'
                New-Item -ItemType Directory -Force -Path $rawPackagesDir | Out-Null

                $packages = @(Get-ChildItem -Path '$(Build.SourcesDirectory)/artifacts/packages' -Recurse -Filter '*.nupkg' -File)
                if ($packages.Count -eq 0) {
                  throw "No DevFlow macOS raw packages were produced."
                }

                $packages | Copy-Item -Destination $rawPackagesDir -Force
                $packages | ForEach-Object { Write-Host "Staged $($_.FullName)" }
              displayName: Stage DevFlow macOS raw packages

          - job: DevFlow_WindowsRawPackages
            displayName: DevFlow - Windows raw packages
            pool:
              name: NetCore1ESPool-Internal
              demands: ImageOverride -equals windows.vs2026preview.scout.amd64
            strategy:
              matrix:
                Release:
                  _BuildConfig: Release
                  _OfficialBuildArgs: /p:DotNetSignType=$(_SignType)
                    /p:TeamName=$(_TeamName)
                    /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
            templateContext:
              outputs:
              - output: pipelineArtifact
                displayName: Publish DevFlow Windows raw packages
                targetPath: '$(Build.ArtifactStagingDirectory)/raw-packages-devflow-windows'
                artifactName: DevFlowRawPackages_Windows
                condition: succeeded()
                sbomEnabled: false
            steps:
            - script: eng\common\dotnet.cmd --info
              displayName: Provision .NET SDK via Arcade
            - script: .dotnet\dotnet workload install maui maui-android macos maui-tizen
              displayName: Install MAUI workloads
            - script: .dotnet\dotnet build -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="%ANDROID_HOME%" -p:AcceptAndroidSDKLicenses=true src\DevFlow\Microsoft.Maui.DevFlow.Agent\Microsoft.Maui.DevFlow.Agent.csproj
              displayName: Install Android SDK dependencies
            - script: eng\common\build.cmd
                -configuration $(_BuildConfig)
                -prepareMachine
                -restore
                -build
                -test
                -pack
                -ci
                -projects $(Build.SourcesDirectory)\src\DevFlow\DevFlow.slnf
                $(_OfficialBuildArgs)
                /p:PackDriverNuGet=true
              displayName: Build, Test and Pack DevFlow raw packages
            - powershell: |
                $rawPackagesDir = '$(Build.ArtifactStagingDirectory)\raw-packages-devflow-windows'
                New-Item -ItemType Directory -Force -Path $rawPackagesDir | Out-Null

                $packages = @(Get-ChildItem -Path '$(Build.SourcesDirectory)\artifacts\packages' -Recurse -Filter '*.nupkg' -File)
                if ($packages.Count -eq 0) {
                  throw "No DevFlow Windows raw packages were produced."
                }

                $packages | Copy-Item -Destination $rawPackagesDir -Force
                $packages | ForEach-Object { Write-Host "Staged $($_.FullName)" }
              displayName: Stage DevFlow Windows raw packages

          - job: DevFlow_MergedPackages
            displayName: DevFlow - merged packages
            dependsOn:
            - DevFlow_MacRawPackages
            - DevFlow_WindowsRawPackages
            pool:
              name: NetCore1ESPool-Internal
              demands: ImageOverride -equals windows.vs2026preview.scout.amd64
            strategy:
              matrix:
                Release:
                  _BuildConfig: Release
                  _OfficialBuildArgs: /p:DotNetSignType=$(_SignType)
                    /p:TeamName=$(_TeamName)
                    /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
            steps:
            - script: eng\common\dotnet.cmd --info
              displayName: Provision .NET SDK via Arcade
            - script: .dotnet\dotnet workload install maui maui-android macos maui-tizen
              displayName: Install MAUI workloads
            - script: .dotnet\dotnet build -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="%ANDROID_HOME%" -p:AcceptAndroidSDKLicenses=true src\DevFlow\Microsoft.Maui.DevFlow.Agent\Microsoft.Maui.DevFlow.Agent.csproj
              displayName: Install Android SDK dependencies
            - download: current
              artifact: DevFlowRawPackages_macOS
              path: '$(Build.SourcesDirectory)\artifacts\raw-packages\raw-packages-devflow-macos-$(Build.BuildId)'
              displayName: Download DevFlow macOS raw packages
            - download: current
              artifact: DevFlowRawPackages_Windows
              path: '$(Build.SourcesDirectory)\artifacts\raw-packages\raw-packages-devflow-windows-$(Build.BuildId)'
              displayName: Download DevFlow Windows raw packages
            - powershell: |
                $rawRoot = '$(Build.SourcesDirectory)\artifacts\raw-packages'
                $requiredPackageIds = @(
                  'Microsoft.Maui.DevFlow.Agent',
                  'Microsoft.Maui.DevFlow.Blazor'
                )

                foreach ($platform in @('macos', 'windows')) {
                  $matches = @(Get-ChildItem -Path $rawRoot -Directory -Filter "raw-packages-devflow-$platform-*")
                  if ($matches.Count -ne 1) {
                    throw "Expected exactly one raw package directory for $platform under '$rawRoot', but found $($matches.Count)."
                  }

                  foreach ($packageId in $requiredPackageIds) {
                    $packages = @(Get-ChildItem -Path $matches[0].FullName -Recurse -Filter "$packageId.[0-9]*.nupkg" -File)
                    if ($packages.Count -eq 0) {
                      throw "Missing '$packageId' raw package in '$($matches[0].FullName)'."
                    }
                  }
                }
              displayName: Validate DevFlow raw package inputs
            - script: eng\common\build.cmd
                -configuration $(_BuildConfig)
                -prepareMachine
                -restore
                -build
                -test
                -pack
                -ci
                -projects $(Build.SourcesDirectory)\src\DevFlow\DevFlow.slnf
                $(_OfficialBuildArgs)
                /p:PackDriverNuGet=true
                /p:PackDevFlowPlatformNuGets=false
              displayName: Build, Test and Pack DevFlow pass-through packages
            - powershell: |
                $rawPackageRoot = '$(Build.SourcesDirectory)\artifacts\raw-packages\'
                $packagesOutput = '$(Build.SourcesDirectory)\artifacts\packages\$(_BuildConfig)\Shipping'
                New-Item -ItemType Directory -Force -Path $packagesOutput | Out-Null

                $projects = @(
                  'eng\Packaging\Microsoft.Maui.DevFlow.Agent.Package\Microsoft.Maui.DevFlow.Agent.Package.csproj',
                  'eng\Packaging\Microsoft.Maui.DevFlow.Blazor.Package\Microsoft.Maui.DevFlow.Blazor.Package.csproj'
                )

                $commonArgs = @(
                  "/p:RawPackageRoot=$rawPackageRoot",
                  "/p:PackageOutputPath=$packagesOutput",
                  "/p:EnableWindowsTargeting=true",
                  "/p:DotNetSignType=$(_SignType)",
                  "/p:TeamName=$(_TeamName)",
                  "/p:OfficialBuildId=$(BUILD.BUILDNUMBER)"
                )

                foreach ($project in $projects) {
                  & .\.dotnet\dotnet restore $project @commonArgs
                  if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                  }

                  & .\.dotnet\dotnet pack $project --no-restore --no-build -c "$(_BuildConfig)" @commonArgs
                  if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                  }
                }
              displayName: Pack merged DevFlow platform packages
            - script: eng\common\build.cmd
                -configuration $(_BuildConfig)
                -restore
                -sign
                -publish
                -ci
                $(_OfficialBuildArgs)
              displayName: Sign and publish DevFlow merged packages
            - powershell: |
                Add-Type -AssemblyName System.IO.Compression.FileSystem

                $packageDir = '$(Build.SourcesDirectory)\artifacts\packages\$(_BuildConfig)\Shipping'
                $requiredPackageIds = @(
                  'Microsoft.Maui.DevFlow.Agent',
                  'Microsoft.Maui.DevFlow.Blazor'
                )
                $requiredTfms = @(
                  'net10.0-android',
                  'net10.0-ios',
                  'net10.0-maccatalyst',
                  'net10.0-macos',
                  'net10.0-windows10.0.19041.0'
                )

                foreach ($packageId in $requiredPackageIds) {
                  $package = Get-ChildItem -Path $packageDir -Filter "$packageId.[0-9]*.nupkg" -File |
                    Sort-Object LastWriteTimeUtc |
                    Select-Object -Last 1

                  if ($null -eq $package) {
                    throw "Expected merged package '$packageId' was not produced in '$packageDir'."
                  }

                  $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
                  try {
                    $entries = @($zip.Entries | ForEach-Object { $_.FullName })
                    foreach ($tfm in $requiredTfms) {
                      if (-not ($entries | Where-Object { $_ -like "lib/$tfm/*" })) {
                        throw "Merged package '$($package.Name)' does not contain lib assets for '$tfm'."
                      }
                    }
                  }
                  finally {
                    $zip.Dispose()
                  }

                  Write-Host "Verified merged package $($package.Name)"
                }
              displayName: Verify merged DevFlow platform packages

          - job: Cli
            displayName: Cli - Windows
            pool:
              name: NetCore1ESPool-Internal
              demands: ImageOverride -equals windows.vs2026preview.scout.amd64
            strategy:
              matrix:
                Release:
                  _BuildConfig: Release
                  _OfficialBuildArgs: /p:DotNetSignType=$(_SignType)
                    /p:TeamName=$(_TeamName)
                    /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
            steps:
            - task: UseDotNet@2
              displayName: Install .NET SDK
              inputs:
                useGlobalJson: true
            - script: eng\common\cibuild.cmd
                -configuration $(_BuildConfig)
                -prepareMachine
                -projects $(Build.SourcesDirectory)\src\Cli\Cli.slnf
                $(_OfficialBuildArgs)
              displayName: Build and Test Cli

          # The Linux GTK4 NuGet packages are pure managed (net10.0) assemblies
          # using GirCore for GTK/WebKit bindings, so they build and pack on Windows.
          # Running on Windows is required so MicroBuild/ESRP can sign the DLLs —
          # signing does not execute on Linux agents.
          - job: LinuxGtk4
            displayName: Linux GTK4 - Windows
            pool:
              name: NetCore1ESPool-Internal
              demands: ImageOverride -equals windows.vs2026preview.scout.amd64
            strategy:
              matrix:
                Release:
                  _BuildConfig: Release
                  _OfficialBuildArgs: /p:DotNetSignType=$(_SignType)
                    /p:TeamName=$(_TeamName)
                    /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
            steps:
            - task: UseDotNet@2
              displayName: Install .NET SDK
              inputs:
                useGlobalJson: true
            - script: eng\common\cibuild.cmd
                -configuration $(_BuildConfig)
                -prepareMachine
                -projects $(Build.SourcesDirectory)\platforms\Linux.Gtk4\Linux.Gtk4.slnx
                $(_OfficialBuildArgs)
              displayName: Build and Pack Linux GTK4

          # Verification-only build on real Linux to catch any platform-specific
          # build breaks. This job does NOT pack or publish artifacts — the
          # shipping NuGet packages come from the Windows LinuxGtk4 job above
          # so that MicroBuild/ESRP can sign the DLLs.
          - job: LinuxGtk4_LinuxVerify
            displayName: Linux GTK4 - Ubuntu (verify)
            pool:
              name: NetCore1ESPool-Internal
              demands: ImageOverride -equals build.ubuntu.2204.amd64
              os: linux
            templateContext:
              outputs: []
            strategy:
              matrix:
                Release:
                  _BuildConfig: Release
            steps:
            - task: UseDotNet@2
              displayName: Install .NET SDK
              inputs:
                useGlobalJson: true
            - script: |
                sudo apt-get update
                sudo apt-get install -y \
                  libgtk-4-dev \
                  libwebkitgtk-6.0-dev \
                  gobject-introspection \
                  libgirepository1.0-dev \
                  gir1.2-gtk-4.0 \
                  gir1.2-webkit-6.0 \
                  pkg-config
              displayName: Install GTK4 dependencies
            - script: |
                ./eng/common/build.sh \
                  --configuration $(_BuildConfig) \
                  --restore \
                  --build \
                  --prepareMachine \
                  --ci \
                  --projects $(Build.SourcesDirectory)/platforms/Linux.Gtk4/Linux.Gtk4.slnx \
                  /p:OfficialBuild=false
              displayName: Build Linux GTK4 (no pack)
       
    - template: /eng/common/templates-official/post-build/post-build.yml@self
      parameters:
        enableSourceLinkValidation: false
        enableSigningValidation: true
        enableNugetValidation: true

    # Publish DevFlow packages to NuGet.org
    - ${{ if eq(parameters.publishDevFlowNuget, true) }}:
      - stage: publish_devflow_nuget
        displayName: 'Publish DevFlow to NuGet.org'
        dependsOn:
        - Validate
        - publish_using_darc
        jobs:
        - job: PrepareArtifacts
          displayName: 'Prepare DevFlow Artifacts'
          timeoutInMinutes: 15
          pool:
            name: NetCore1ESPool-Internal
            image: windows.vs2026preview.scout.amd64
            os: windows
          templateContext:
            outputs:
            - output: pipelineArtifact
              displayName: Publish DevFlow Packages
              targetPath: '$(Pipeline.Workspace)/DevFlowPackages'
              artifactName: DevFlowPackagesForNuGet
          steps:
          - download: current
            artifact: PackageArtifacts
            displayName: Download PackageArtifacts
          - powershell: |
              New-Item -ItemType Directory -Force -Path '$(Pipeline.Workspace)/DevFlowPackages'
              Copy-Item '$(Pipeline.Workspace)/PackageArtifacts/Microsoft.Maui.DevFlow.*.nupkg' '$(Pipeline.Workspace)/DevFlowPackages/' -Verbose
            displayName: Filter DevFlow packages

        - job: PublishNuGet
          displayName: 'Push DevFlow to NuGet.org'
          dependsOn: PrepareArtifacts
          timeoutInMinutes: 30
          pool:
            name: NetCore1ESPool-Internal
            image: windows.vs2026preview.scout.amd64
            os: windows
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: DevFlowPackagesForNuGet
              targetPath: '$(Pipeline.Workspace)/DevFlowPackages'
          steps:
          - task: 1ES.PublishNuget@1
            displayName: 'Push DevFlow to NuGet.org'
            inputs:
              useDotNetTask: false
              packagesToPush: '$(Pipeline.Workspace)/DevFlowPackages/*.nupkg'
              packageParentPath: '$(Pipeline.Workspace)/DevFlowPackages'
              nuGetFeedType: external
              publishFeedCredentials: 'nuget.org (dotnetframework)'

    # Publish Cli packages to NuGet.org
    - ${{ if eq(parameters.publishCliNuget, true) }}:
      - stage: publish_cli_nuget
        displayName: 'Publish Cli to NuGet.org'
        dependsOn:
        - Validate
        - publish_using_darc
        jobs:
        - job: PrepareArtifacts
          displayName: 'Prepare Cli Artifacts'
          timeoutInMinutes: 15
          pool:
            name: NetCore1ESPool-Internal
            image: windows.vs2026preview.scout.amd64
            os: windows
          templateContext:
            outputs:
            - output: pipelineArtifact
              displayName: Publish Cli Packages
              targetPath: '$(Pipeline.Workspace)/CliPackages'
              artifactName: CliPackagesForNuGet
          steps:
          - download: current
            artifact: PackageArtifacts
            displayName: Download PackageArtifacts
          - powershell: |
              New-Item -ItemType Directory -Force -Path '$(Pipeline.Workspace)/CliPackages'
              Copy-Item '$(Pipeline.Workspace)/PackageArtifacts/Microsoft.Maui.Cli.*.nupkg' '$(Pipeline.Workspace)/CliPackages/' -Verbose
              Copy-Item '$(Pipeline.Workspace)/PackageArtifacts/Microsoft.Maui.StartupProfiling.*.nupkg' '$(Pipeline.Workspace)/CliPackages/' -Verbose -ErrorAction Stop
            displayName: Filter Cli packages

        - job: PublishNuGet
          displayName: 'Push Cli to NuGet.org'
          dependsOn: PrepareArtifacts
          timeoutInMinutes: 30
          pool:
            name: NetCore1ESPool-Internal
            image: windows.vs2026preview.scout.amd64
            os: windows
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: CliPackagesForNuGet
              targetPath: '$(Pipeline.Workspace)/CliPackages'
          steps:
          - task: 1ES.PublishNuget@1
            displayName: 'Push Cli to NuGet.org'
            inputs:
              useDotNetTask: false
              packagesToPush: '$(Pipeline.Workspace)/CliPackages/*.nupkg'
              packageParentPath: '$(Pipeline.Workspace)/CliPackages'
              nuGetFeedType: external
              publishFeedCredentials: 'nuget.org (dotnetframework)'

    # Publish Linux GTK4 packages to NuGet.org
    - ${{ if eq(parameters.publishLinuxGtk4Nuget, true) }}:
      - stage: publish_linux_gtk4_nuget
        displayName: 'Publish Linux GTK4 to NuGet.org'
        dependsOn:
        - Validate
        - publish_using_darc
        jobs:
        - job: PrepareArtifacts
          displayName: 'Prepare Linux GTK4 Artifacts'
          timeoutInMinutes: 15
          pool:
            name: NetCore1ESPool-Internal
            image: windows.vs2026preview.scout.amd64
            os: windows
          templateContext:
            outputs:
            - output: pipelineArtifact
              displayName: Publish Linux GTK4 Packages
              targetPath: '$(Pipeline.Workspace)/LinuxGtk4Packages'
              artifactName: LinuxGtk4PackagesForNuGet
          steps:
          - download: current
            artifact: PackageArtifacts
            displayName: Download PackageArtifacts
          - powershell: |
              New-Item -ItemType Directory -Force -Path '$(Pipeline.Workspace)/LinuxGtk4Packages'
              Copy-Item '$(Pipeline.Workspace)/PackageArtifacts/Microsoft.Maui.Platforms.Linux.Gtk4.*.nupkg' '$(Pipeline.Workspace)/LinuxGtk4Packages/' -Verbose
            displayName: Filter Linux GTK4 packages

        - job: PublishNuGet
          displayName: 'Push Linux GTK4 to NuGet.org'
          dependsOn: PrepareArtifacts
          timeoutInMinutes: 30
          pool:
            name: NetCore1ESPool-Internal
            image: windows.vs2026preview.scout.amd64
            os: windows
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: LinuxGtk4PackagesForNuGet
              targetPath: '$(Pipeline.Workspace)/LinuxGtk4Packages'
          steps:
          - task: 1ES.PublishNuget@1
            displayName: 'Push Linux GTK4 to NuGet.org'
            inputs:
              useDotNetTask: false
              packagesToPush: '$(Pipeline.Workspace)/LinuxGtk4Packages/*.nupkg'
              packageParentPath: '$(Pipeline.Workspace)/LinuxGtk4Packages'
              nuGetFeedType: external
              publishFeedCredentials: 'nuget.org (dotnetframework)'
