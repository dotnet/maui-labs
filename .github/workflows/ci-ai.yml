name: CI - AI Extensions

on:
  push:
    branches: [main]
    paths:
      - 'src/AIExtensions/**'
      - 'tests/AIExtensions/**'
      - 'samples/AIExtensions.Sample.ChatPlayground/**'
      - 'samples/AIExtensions.Sample.Garden/**'
      - 'src/AI/**'
      - 'samples/ChatControls.Sample/**'
      - 'samples/ChatControls.BlazorHybrid.Sample/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'src/AIExtensions/**'
      - 'tests/AIExtensions/**'
      - 'samples/AIExtensions.Sample.ChatPlayground/**'
      - 'samples/AIExtensions.Sample.Garden/**'
      - 'src/AI/**'
      - 'samples/ChatControls.Sample/**'
      - 'samples/ChatControls.BlazorHybrid.Sample/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: src/AIExtensions/AIExtensions.Packages.slnf
      project-name: ai-extensions
      run-tests: true
      pack: true
      install-workloads: true
      # Garden (the MAUI showcase) builds/links maccatalyst + ios app bundles on macOS.
      # The pinned MAUI workload (Apple SDK 26.2) requires Xcode 26.3+; the runner default
      # (16.4) fails ILLink with MT0079/MT4162. Matches the EssentialsAI sample precedent.
      xcode-version: '26.3'

  sample:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: samples/AIExtensions.Sample.ChatPlayground/AIExtensions.Sample.ChatPlayground.csproj
      project-name: ai-chat-playground
      os: '["xcode-27"]'
      run-tests: false
      pack: false
      install-workloads: true
      workload-version: '10.0.401'
      skip-xcode-version-validation: true
      android-project: src/AI/Microsoft.Maui.Essentials.AI/Microsoft.Maui.Essentials.AI.csproj
