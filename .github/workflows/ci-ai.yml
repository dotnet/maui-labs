name: CI - AI Extensions

on:
  push:
    branches: [main]
    paths:
      - 'src/AIExtensions/**'
      - 'tests/AIExtensions/**'
      - 'samples/AIExtensions.Sample.Garden/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - 'src/AIExtensions/**'
      - 'tests/AIExtensions/**'
      - 'samples/AIExtensions.Sample.Garden/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: src/AIExtensions/AIExtensions.slnf
      project-name: ai-extensions
      run-tests: true
      pack: true
      install-workloads: true
      # Garden (the MAUI showcase) builds/links maccatalyst + ios app bundles on macOS.
      # The pinned MAUI workload (Apple SDK 26.2) requires Xcode 26.3+; the runner default
      # (16.4) fails ILLink with MT0079/MT4162. Matches the EssentialsAI sample precedent.
      xcode-version: '26.3'
