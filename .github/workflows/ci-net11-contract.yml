name: CI - .NET 11 community platform contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-net11-contract.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'eng/Versions.props'
      - 'eng/workloads/dotnet11-rc2.json'
      - 'global.json'
      - 'NuGet.config'
      - 'platforms/Shared/Net11ContractProbe/**'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - '.github/workflows/ci-net11-contract.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'eng/Versions.props'
      - 'eng/workloads/dotnet11-rc2.json'
      - 'global.json'
      - 'NuGet.config'
      - 'platforms/Shared/Net11ContractProbe/**'

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify public .NET 11 community platform contracts
        run: dotnet run --project platforms/Shared/Net11ContractProbe/Net11ContractProbe.csproj --configuration Release
