name: CI - GenerativeUI

on:
  push:
    branches: [main]
    paths:
      - 'src/GenerativeUI/**'
      - 'tests/GenerativeUI/**'
      - 'samples/GenerativeUI.Sample.Garden.Shared/**'
      - 'samples/GenerativeUI.Sample.Garden.Server/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - 'src/GenerativeUI/**'
      - 'tests/GenerativeUI/**'
      - 'samples/GenerativeUI.Sample.Garden.Shared/**'
      - 'samples/GenerativeUI.Sample.Garden.Server/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: src/GenerativeUI/GenerativeUI.slnf
      project-name: generativeui
      run-tests: true
      pack: true
      install-workloads: false
