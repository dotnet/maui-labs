name: DevFlow Failure Publisher

on:
  workflow_run:
    workflows:
      - DevFlow Integration Tests
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: devflow-failure-publisher-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.name == 'DevFlow Integration Tests' &&
      github.event.workflow_run.path == '.github/workflows/devflow-integration.yml' &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.pull_requests[0] == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted publisher from the default branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the handoff ZIP and publish a qualified recurrence
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVFLOW_REPOSITORY: ${{ github.repository }}
          DEVFLOW_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          DEVFLOW_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          DEVFLOW_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          DEVFLOW_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          DEVFLOW_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          DEVFLOW_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEVFLOW_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEVFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DEVFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DEVFLOW_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          DEVFLOW_PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '0' }}
        run: |
          & ./eng/devflow/Publish-DevFlowFailureIssue.ps1 `
            -Lane production `
            -Repository $env:DEVFLOW_REPOSITORY `
            -WorkflowName $env:DEVFLOW_WORKFLOW_NAME `
            -WorkflowPath $env:DEVFLOW_WORKFLOW_PATH `
            -SourceEvent $env:DEVFLOW_SOURCE_EVENT `
            -HeadRepository $env:DEVFLOW_HEAD_REPOSITORY `
            -HeadRef $env:DEVFLOW_HEAD_REF `
            -DefaultBranch $env:DEVFLOW_DEFAULT_BRANCH `
            -WorkflowConclusion $env:DEVFLOW_WORKFLOW_CONCLUSION `
            -RunId ([Int64] $env:DEVFLOW_RUN_ID) `
            -RunAttempt ([Int32] $env:DEVFLOW_RUN_ATTEMPT) `
            -CommitSha $env:DEVFLOW_COMMIT_SHA `
            -PullRequestNumber ([Int32] $env:DEVFLOW_PULL_REQUEST_NUMBER)

  # The demo lane is disjoint from the production lane in every observable way: a different
  # artifact name, a different archive schema, a different label, a different title prefix,
  # different markers, and a different fingerprint domain. It carries exactly the same
  # workflow_run provenance conditions, so it can never publish from a fork, a pull request, or a
  # non-default branch. Both jobs run on every completed integration run; the one whose artifact is
  # absent reports the ordinary `ignored-no-artifact` result and does nothing else.
  publish-demo:
    if: >-
      github.event.workflow_run.name == 'DevFlow Integration Tests' &&
      github.event.workflow_run.path == '.github/workflows/devflow-integration.yml' &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.pull_requests[0] == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted publisher from the default branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the demo handoff ZIP and publish a nonqualified demo issue
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVFLOW_REPOSITORY: ${{ github.repository }}
          DEVFLOW_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          DEVFLOW_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          DEVFLOW_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          DEVFLOW_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          DEVFLOW_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          DEVFLOW_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEVFLOW_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEVFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DEVFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DEVFLOW_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          DEVFLOW_PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '0' }}
        run: |
          & ./eng/devflow/Publish-DevFlowFailureIssue.ps1 `
            -Lane demo `
            -Repository $env:DEVFLOW_REPOSITORY `
            -WorkflowName $env:DEVFLOW_WORKFLOW_NAME `
            -WorkflowPath $env:DEVFLOW_WORKFLOW_PATH `
            -SourceEvent $env:DEVFLOW_SOURCE_EVENT `
            -HeadRepository $env:DEVFLOW_HEAD_REPOSITORY `
            -HeadRef $env:DEVFLOW_HEAD_REF `
            -DefaultBranch $env:DEVFLOW_DEFAULT_BRANCH `
            -WorkflowConclusion $env:DEVFLOW_WORKFLOW_CONCLUSION `
            -RunId ([Int64] $env:DEVFLOW_RUN_ID) `
            -RunAttempt ([Int32] $env:DEVFLOW_RUN_ATTEMPT) `
            -CommitSha $env:DEVFLOW_COMMIT_SHA `
            -PullRequestNumber ([Int32] $env:DEVFLOW_PULL_REQUEST_NUMBER)
