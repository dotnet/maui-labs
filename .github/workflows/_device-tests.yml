name: Device Tests

on:
  workflow_call:
    inputs:
      project-path:
        required: true
        type: string
        description: 'Path to the device test project (.csproj) for running tests'
      project-name:
        required: true
        type: string
        description: 'Human-readable name for artifact naming (e.g. essentialsai)'
      target-framework:
        required: true
        type: string
        description: 'Target framework to run tests against (e.g. net10.0-maccatalyst, net10.0-android)'
      filter:
        required: false
        type: string
        default: ''
        description: 'Test filter expression (e.g. "RequiresModel!=true")'
      os:
        required: false
        type: string
        default: 'macos-26'
        description: 'Runner label for the job'
      install-workloads:
        required: false
        type: boolean
        default: true
        description: 'Install MAUI workloads (not needed if already present on runner)'
      workloads:
        required: false
        type: string
        default: 'maui macos maccatalyst'
        description: 'Space-separated list of workloads to install (only used when install-workloads is true)'
      workload-version:
        required: false
        type: string
        default: '10.0.203'
        description: 'Workload version to install (pinned for reproducibility)'
      xcode-version:
        required: false
        type: string
        default: ''
        description: 'Xcode version to select on macOS (e.g. "26.3"). Empty uses runner default.'
      native-deps:
        required: false
        type: string
        default: ''
        description: 'Shell command to install native dependencies (e.g. apt-get for GTK4)'
      dotnet-args:
        required: false
        type: string
        default: ''
        description: 'Additional arguments to pass to dotnet test'

jobs:
  device-tests:
    runs-on: ${{ inputs.os }}
    env:
      UseXcode27Preview: ${{ endsWith(inputs.target-framework, '27.0') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        if: inputs.xcode-version != '' && runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_${{ inputs.xcode-version }}.app/Contents/Developer

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install native dependencies
        if: inputs.native-deps != ''
        run: ${{ inputs.native-deps }}

      - name: Install workloads
        if: inputs.install-workloads
        run: dotnet workload install ${{ inputs.workloads }} --version ${{ inputs.workload-version }}

      - name: Build and run device tests
        shell: pwsh
        env:
          DEVICE_TEST_PROJECT: ${{ inputs.project-path }}
          DEVICE_TEST_TFM: ${{ inputs.target-framework }}
          DEVICE_TEST_FILTER: ${{ inputs.filter }}
          DEVICE_TEST_DOTNET_ARGS: ${{ inputs.dotnet-args }}
        run: |
          $ErrorActionPreference = 'Stop'
          & dotnet restore $env:DEVICE_TEST_PROJECT -p:TargetFrameworks=$env:DEVICE_TEST_TFM
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & dotnet build $env:DEVICE_TEST_PROJECT -f $env:DEVICE_TEST_TFM -c Release --no-restore -p:TargetFrameworks=$env:DEVICE_TEST_TFM
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $arguments = @(
            'test', $env:DEVICE_TEST_PROJECT,
            '-f', $env:DEVICE_TEST_TFM,
            '-c', 'Release',
            '--no-build',
            '--no-restore',
            "-p:TargetFrameworks=$env:DEVICE_TEST_TFM",
            '--logger', 'trx',
            '--results-directory', (Join-Path $env:GITHUB_WORKSPACE 'artifacts/TestResults')
          )
          if ($env:DEVICE_TEST_FILTER) {
            $arguments += @('--filter', $env:DEVICE_TEST_FILTER)
          }
          if ($env:DEVICE_TEST_DOTNET_ARGS) {
            $arguments += $env:DEVICE_TEST_DOTNET_ARGS -split '\s+'
          }
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify device tests executed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = @(Get-ChildItem -Path artifacts/TestResults -Recurse -Filter *.trx)
          if ($results.Count -eq 0) {
            throw 'Device tests produced no TRX results.'
          }
          foreach ($result in $results) {
            [xml]$document = Get-Content -LiteralPath $result.FullName -Raw
            $counts = $document.TestRun.ResultSummary.Counters
            if ([int]$counts.total -le 0 -or [int]$counts.executed -ne [int]$counts.total -or
                [int]$counts.passed -ne [int]$counts.total -or [int]$counts.failed -ne 0 -or
                [int]$counts.notExecuted -ne 0) {
              throw "Device tests must all execute and pass without skips: $($result.Name)"
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.project-name }}-device-${{ inputs.target-framework }}
          path: artifacts/TestResults/**/*.trx
          if-no-files-found: error
