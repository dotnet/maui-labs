name: Device Tests

on:
  workflow_call:
    inputs:
      project-path:
        required: true
        type: string
        description: 'Path to the device test project (.csproj) for running tests'
      project-name:
        required: true
        type: string
        description: 'Human-readable name for artifact naming (e.g. essentialsai)'
      target-framework:
        required: true
        type: string
        description: 'Target framework to run tests against (e.g. net10.0-maccatalyst, net10.0-android)'
      filter:
        required: false
        type: string
        default: ''
        description: 'Test filter expression (e.g. "RequiresModel!=true")'
      os:
        required: false
        type: string
        default: 'macos-26'
        description: 'Runner label for the job'
      install-workloads:
        required: false
        type: boolean
        default: true
        description: 'Install MAUI workloads (not needed if already present on runner)'
      workloads:
        required: false
        type: string
        default: 'maui macos maccatalyst'
        description: 'Space-separated list of workloads to install (only used when install-workloads is true)'
      workload-version:
        required: false
        type: string
        default: '10.0.203'
        description: 'Workload version to install (pinned for reproducibility)'
      xcode-version:
        required: false
        type: string
        default: ''
        description: 'Xcode version to select on macOS (e.g. "26.3"). Empty uses runner default.'
      native-deps:
        required: false
        type: string
        default: ''
        description: 'Shell command to install native dependencies (e.g. apt-get for GTK4)'
      dotnet-args:
        required: false
        type: string
        default: ''
        description: 'Additional arguments to pass to dotnet test'

jobs:
  device-tests:
    runs-on: ${{ inputs.os }}
    env:
      UseXcode27Preview: ${{ endsWith(inputs.target-framework, '27.0') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        if: inputs.xcode-version != '' && runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_${{ inputs.xcode-version }}.app/Contents/Developer

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install native dependencies
        if: inputs.native-deps != ''
        run: ${{ inputs.native-deps }}

      - name: Install workloads
        if: inputs.install-workloads
        run: dotnet workload install ${{ inputs.workloads }} --version ${{ inputs.workload-version }}

      - name: Install Android SDK dependencies
        if: contains(inputs.target-framework, '-android')
        run: |
          dotnet build "${{ inputs.project-path }}" \
            -t:InstallAndroidDependencies \
            -f ${{ inputs.target-framework }} \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AcceptAndroidSDKLicenses=true

      - name: Build MAUI CLI
        if: contains(inputs.target-framework, '-android')
        run: dotnet build src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj -c Release

      - name: Create Android emulator
        if: contains(inputs.target-framework, '-android')
        shell: bash
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          maui_cli="$GITHUB_WORKSPACE/artifacts/bin/Microsoft.Maui.Cli/Release/net10.0/maui"
          if [[ "$(uname -m)" == "arm64" ]]; then
            abi="arm64-v8a"
          else
            abi="x86_64"
          fi
          image="system-images;android-35;google_apis;$abi"
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          "$maui_cli" android --sdk "$ANDROID_HOME" --ci sdk install \
            platform-tools emulator "$image"
          "$maui_cli" android --sdk "$ANDROID_HOME" --ci emulator create \
            device-tests --force --package "$image" --device pixel_6

      - name: Start Android emulator
        id: android-emulator
        if: contains(inputs.target-framework, '-android')
        timeout-minutes: 8
        shell: bash
        run: |
          "$GITHUB_WORKSPACE/artifacts/bin/Microsoft.Maui.Cli/Release/net10.0/maui" \
            android --sdk "$ANDROID_HOME" --ci \
            emulator start device-tests --cold-boot --wait --no-window

      - name: Build device tests
        run: |
          cd "$(dirname "${{ inputs.project-path }}")"
          dotnet restore "$(basename "${{ inputs.project-path }}")"
          dotnet build "$(basename "${{ inputs.project-path }}")" -f ${{ inputs.target-framework }} -c Release --no-restore

      - name: Run device tests
        run: |
          cd "$(dirname "${{ inputs.project-path }}")"
          dotnet test "$(basename "${{ inputs.project-path }}")" \
            -f ${{ inputs.target-framework }} \
            -c Release \
            --no-build \
            --no-restore \
            --logger trx \
            --results-directory ${{ github.workspace }}/artifacts/TestResults \
            ${{ inputs.filter != '' && format('--filter "{0}"', inputs.filter) || '' }} \
            ${{ inputs.dotnet-args }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.project-name }}-device-${{ inputs.target-framework }}
          path: artifacts/TestResults/**/*.trx

      - name: Stop Android emulator
        if: always() && steps.android-emulator.outcome == 'success'
        timeout-minutes: 1
        shell: bash
        run: |
          "$ANDROID_HOME/platform-tools/adb" -e emu kill
