name: CI - EssentialsAI

on:
  push:
    branches: [main]
    paths:
      - 'src/AI/**'
      - 'tests/AI/**'
      - 'samples/EssentialsAISample/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - 'src/AI/**'
      - 'tests/AI/**'
      - 'samples/EssentialsAISample/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  # Step 1: Build on macOS — compiles Swift xcframeworks, produces .resources.zip,
  # and uploads them as native-apple-essentialsai artifact via _build.yml.
  build-macos:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: src/AI/EssentialsAI.slnf
      project-name: essentialsai
      os: '["macos-latest"]'
      run-tests: true
      pack: true
      xcode-version: '26.3'
      android-project: src/AI/Microsoft.Maui.Essentials.AI/Microsoft.Maui.Essentials.AI.csproj

  # Step 2: Build on Windows — downloads native .resources.zip from macOS build
  # via pre-build-artifact so AppleBindings.targets includes them during pack.
  build-windows:
    needs: build-macos
    uses: ./.github/workflows/_build.yml
    with:
      project-path: src/AI/EssentialsAI.slnf
      project-name: essentialsai
      os: '["windows-latest"]'
      run-tests: true
      pack: true
      pre-build-artifact: native-apple-essentialsai
      android-project: src/AI/Microsoft.Maui.Essentials.AI/Microsoft.Maui.Essentials.AI.csproj

  # Step 3: Run device tests on Mac Catalyst via DeviceRunners + dotnet test.
  device-tests-maccatalyst:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install workloads
        run: dotnet workload install maui macos maccatalyst --version 10.0.203

      - name: Run device tests (Mac Catalyst)
        run: >
          dotnet test
          tests/AI/Microsoft.Maui.Essentials.AI.DeviceTests/Microsoft.Maui.Essentials.AI.DeviceTests.csproj
          -f net10.0-maccatalyst
          -c Release
          --logger trx
          --results-directory artifacts/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-essentialsai-device-maccatalyst
          path: artifacts/TestResults/**/*.trx
