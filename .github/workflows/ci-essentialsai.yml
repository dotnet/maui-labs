name: CI - EssentialsAI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-essentialsai.yml'
      - 'src/AI/**'
      - 'tests/AI/**'
      - 'tests/AIExtensions/Microsoft.Maui.AI.Chat.Tests/**'
      - 'samples/EssentialsAISample/**'
      - 'samples/AIExtensions.Sample.ChatPlayground/**'
      - 'src/DevFlow/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - '.github/workflows/ci-essentialsai.yml'
      - 'src/AI/**'
      - 'tests/AI/**'
      - 'tests/AIExtensions/Microsoft.Maui.AI.Chat.Tests/**'
      - 'samples/EssentialsAISample/**'
      - 'samples/AIExtensions.Sample.ChatPlayground/**'
      - 'src/DevFlow/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  # Keep this Android integration out of the cross-platform shipping solution:
  # the generic playground's Windows WinRT/AOT migration is independent of Gemini.
  build-android-playground:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: samples/AIExtensions.Sample.ChatPlayground/AIExtensions.Sample.ChatPlayground.csproj
      project-name: essentialsai-android-playground
      os: '["macos-latest"]'
      run-tests: false
      pack: false
      workload-version: '10.0.401'
      build-arguments: '/p:TargetFramework=net10.0-android'
      android-project: samples/AIExtensions.Sample.ChatPlayground/AIExtensions.Sample.ChatPlayground.csproj

  # Step 1: Build on Xcode 27 — compiles Swift xcframeworks, produces .resources.zip,
  # and uploads them as native-apple-essentialsai artifact via _build.yml.
  build-macos:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: src/AI/EssentialsAI.slnf
      project-name: essentialsai
      os: '["xcode-27"]'
      run-tests: true
      pack: true
      workload-version: '10.0.401'
      skip-xcode-version-validation: true
      android-project: src/AI/Microsoft.Maui.Essentials.AI/Microsoft.Maui.Essentials.AI.csproj

  # Step 2: Build on Windows — downloads native .resources.zip from macOS build
  # via pre-build-artifact so AppleBindings.targets includes them during pack.
  build-windows:
    needs: build-macos
    uses: ./.github/workflows/_build.yml
    with:
      project-path: src/AI/EssentialsAI.slnf
      project-name: essentialsai
      os: '["windows-latest"]'
      run-tests: true
      pack: true
      workload-version: '10.0.401'
      pre-build-artifact: native-apple-essentialsai
      android-project: src/AI/Microsoft.Maui.Essentials.AI/Microsoft.Maui.Essentials.AI.csproj

  # Step 3: Run device tests on Mac Catalyst via DeviceRunners + dotnet test.
  device-tests-maccatalyst:
    uses: ./.github/workflows/_device-tests.yml
    with:
      project-path: tests/AI/Microsoft.Maui.Essentials.AI.DeviceTests/Microsoft.Maui.Essentials.AI.DeviceTests.csproj
      project-name: essentialsai
      target-framework: net10.0-maccatalyst27.0
      filter: 'RequiresModel!=true'
      os: xcode-27
      workload-version: '10.0.401'
