name: CI - macOS AppKit

on:
  push:
    branches: [main]
    paths:
      - 'platforms/MacOS/**'
      - '.github/workflows/ci-macos-appkit.yml'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - 'platforms/MacOS/**'
      - '.github/workflows/ci-macos-appkit.yml'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: platforms/MacOS/MacOS.slnx
      project-name: macos-appkit
      os: '["macos-latest"]'
      install-workloads: true
      run-tests: true
      pack: true
      xcode-version: '26.3'

  bundle-resources:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install workloads
        run: ./eng/common/dotnet.sh workload install macos maui maui-tizen --version 10.0.203
      - uses: actions/download-artifact@v8
        with:
          name: packages-macos-appkit-macos-latest
          path: artifacts/resource-test-packages
      - name: Assert resource item mapping
        run: |
          ./eng/common/dotnet.sh msbuild platforms/MacOS/tests/BundleResources/ResourceItems.proj
          ./eng/common/dotnet.sh msbuild platforms/MacOS/tests/BundleResources/ResourceItems.proj -p:TargetPlatformIdentifier=windows
          ./eng/common/dotnet.sh msbuild platforms/MacOS/tests/BundleResources/ResourceItems.proj -p:EnableMacOSMauiResourceMapping=false
      - name: Reproduce original omission and verify packaged fix in AppKit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/BundleResourceEvidence | Out-Null
          git show 9206e7c5c6486a7f422efd36a7635c6fe9609000:platforms/MacOS/src/MacOS/buildTransitive/Microsoft.Maui.Platforms.MacOS.targets |
            Set-Content artifacts/BundleResourceEvidence/before.targets
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the issue reproduction baseline.' }
          ./platforms/MacOS/tests/BundleResources/Test-BundleResources.ps1 `
            -BaselineTargets artifacts/BundleResourceEvidence/before.targets `
            -PackageDirectory artifacts/resource-test-packages
      - name: Upload bundle and native runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appkit-bundle-resource-evidence
          path: artifacts/BundleResourceEvidence

  layout-regression:
    name: Native dynamic layout regression
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.packages
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install pinned macOS workload
        run: ./eng/common/dotnet.sh workload install macos --version 10.0.203
      - name: Run native baseline and fixed regression
        shell: bash
        run: |
          set -euo pipefail
          project=platforms/MacOS/tests/LayoutRegressionTests/LayoutRegressionTests.csproj
          source=platforms/MacOS/src/MacOS/Handlers/LayoutHandler.cs
          evidence="$PWD/artifacts/appkit-layout"
          mkdir -p "$evidence"
          cp "$source" "$evidence/LayoutHandler.fixed.cs"
          trap 'cp "$evidence/LayoutHandler.fixed.cs" "$source"' EXIT
          python3 - "$source" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          fixed = "public LayoutHandler() : base(Mapper, CommandMapper)"
          assert source.count(fixed) == 1, "Expected exactly one fixed constructor"
          path.write_text(source.replace(fixed, "public LayoutHandler() : base(Mapper)"))
          PY
          ./eng/common/dotnet.sh build "$project" -c Debug -p:ContinuousIntegrationBuild=true | tee "$evidence/baseline-build.log"
          executable="$(find artifacts/bin/LayoutRegressionTests/Debug -path '*.app/Contents/MacOS/LayoutRegressionTests' -type f)"
          if [[ ! -f "$executable" ]]; then
            echo "::error::Expected exactly one LayoutRegressionTests native app executable; found: $executable"
            exit 1
          fi
          set +e
          APPKIT_LAYOUT_ARTIFACTS="$evidence/baseline" "$executable" > "$evidence/baseline.log" 2>&1
          baseline_exit=$?
          set -e
          cat "$evidence/baseline.log"
          test "$baseline_exit" -eq 1
          grep -F 'Expected 2 native children, got 1' "$evidence/baseline.log"
          cp "$evidence/LayoutHandler.fixed.cs" "$source"
          ./eng/common/dotnet.sh build "$project" -c Debug -p:ContinuousIntegrationBuild=true | tee "$evidence/fixed-build.log"
          APPKIT_LAYOUT_ARTIFACTS="$evidence/fixed" "$executable" 2>&1 | tee "$evidence/fixed.log"
          test "$(grep -c '^PASS ' "$evidence/fixed.log")" -eq 6
      - name: Upload hosted AppKit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appkit-layout-runtime
          path: artifacts/appkit-layout/
          if-no-files-found: error
