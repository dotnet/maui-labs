name: CI - macOS AppKit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'platforms/MacOS/**'
      - 'platforms/Shared/Blazor/**'
      - 'platforms/Shared/ResourceAcceptance/**'
      - '.github/workflows/ci-macos-appkit.yml'
      - '.github/workflows/_build.yml'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, redth-maui-net11-gtk]
    paths:
      - 'platforms/MacOS/**'
      - 'platforms/Shared/Blazor/**'
      - 'platforms/Shared/ResourceAcceptance/**'
      - '.github/workflows/ci-macos-appkit.yml'
      - '.github/workflows/_build.yml'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  portable-contracts:
    name: Portable AppKit contracts (.NET 10 and 11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.100-rc.2.26504.105
      - name: Run portable lifecycle, resource, and Blazor reconciliation tests
        run: dotnet test platforms/MacOS/tests/MacOS.Tests/MacOS.Tests.csproj -c Release
      - name: Verify native runner contracts
        run: python3 -B -m unittest discover -s platforms/MacOS/tests/MacOS.RuntimeTests -p 'test_*.py'

  build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: platforms/MacOS/MacOS-libs.slnf
      project-name: macos-appkit
      os: '["xcode-27"]'
      install-workloads: true
      workloads: 'macos maui'
      android-project: ''
      run-tests: true
      pack: true
      xcode-version: '27.0'

  sample-build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: platforms/MacOS/samples/MacOS.Sample/MacOS.Sample.csproj
      project-name: macos-appkit-sample
      os: '["xcode-27"]'
      build-target-framework: net11.0-macos
      run-tests: false
      pack: false
      install-workloads: true
      workloads: 'macos maui'
      android-project: ''
      xcode-version: '27.0'

  resource-acceptance:
    name: Package-only AppKit resource acceptance
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 27
        run: |
          developer_dir="$(cd /Applications/Xcode_27.0.app/Contents/Developer && pwd -P)"
          sudo xcode-select -s "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          echo "MD_APPLE_SDK_ROOT=$(cd "$developer_dir/../.." && pwd -P)" >> "$GITHUB_ENV"
          xcodebuild -version
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install pinned AppKit workloads
        run: ./eng/common/dotnet.sh workload install macos maui --from-rollback-file eng/workloads/dotnet11-rc2.json
      - name: Verify referenced-library assets, mutation, publish, and collisions
        shell: pwsh
        run: ./eng/smoke-tests/community-resource-acceptance.ps1 -Backend appkit -ArtifactsDirectory "$PWD/artifacts/appkit-resources" -KeepArtifacts
      - name: Upload resource evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appkit-resource-acceptance
          path: artifacts/appkit-resources/
          if-no-files-found: warn

  native-runtime:
    name: AppKit runtime (${{ matrix.scenario }}, ${{ matrix.maui-version || 'default' }})
    needs: build
    runs-on: ${{ startsWith(matrix.maui-version, '10.') && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: layout
            maui-version: ''
          - scenario: contentview-clipping
            maui-version: ''
          - scenario: shell-sections
            maui-version: ''
          - scenario: shell-tabs
            maui-version: ''
          - scenario: dialog-registration
            maui-version: '10.0.41'
          - scenario: dialog-registration
            maui-version: '10.0.60'
          - scenario: dialog-registration
            maui-version: '10.0.70'
          - scenario: dialog-registration
            maui-version: '10.0.110'
          - scenario: dialog-registration
            maui-version: '11.0.0-rc.2.26505.5'
          - scenario: dialogs
            maui-version: '10.0.70'
          - scenario: dialogs
            maui-version: '11.0.0-rc.2.26505.5'
          - scenario: picker
            maui-version: ''
          - scenario: tap-buttons
          - scenario: menu-localization
            packages: true
          - scenario: collection-view-grid
            maui-version: ''
          - scenario: bundle-resources
            maui-version: ''
            workloads: 'macos maui maui-tizen'
            packages: true
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.packages
      APPKIT_XCODE_VERSION: ${{ startsWith(matrix.maui-version, '10.') && '26.0.1' || '27.0' }}
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: |
          developer_dir="$(cd "/Applications/Xcode_${APPKIT_XCODE_VERSION}.app/Contents/Developer" && pwd -P)"
          sudo xcode-select -s "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          echo "MD_APPLE_SDK_ROOT=$(cd "$developer_dir/../.." && pwd -P)" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install pinned scenario workloads
        run: ./eng/common/dotnet.sh workload install ${{ matrix.workloads || 'macos' }} --from-rollback-file eng/workloads/dotnet11-rc2.json
      - name: Download requested product packages
        if: matrix.packages == true
        uses: actions/download-artifact@v8
        with:
          name: packages-macos-appkit-xcode-27
          path: artifacts/runtime-packages
      - name: Verify shared runner contracts
        run: python3 -B -m unittest discover -s platforms/MacOS/tests/MacOS.RuntimeTests -p 'test_*.py'
      - name: Run registered baseline and fixed scenario
        shell: bash
        env:
          RUNTIME_SCENARIO: ${{ matrix.scenario }}
          RUNTIME_MAUI_VERSION: ${{ matrix.maui-version }}
        run: |
          set -euo pipefail
          python3 -B platforms/MacOS/tests/MacOS.RuntimeTests/run.py \
            --scenario "$RUNTIME_SCENARIO" --maui-version "$RUNTIME_MAUI_VERSION" \
            --evidence "$PWD/artifacts/appkit-runtime"
      - name: Upload hosted AppKit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appkit-runtime-${{ matrix.scenario }}-${{ matrix.maui-version || 'default' }}
          path: artifacts/appkit-runtime/
          if-no-files-found: error

  camera-runtime:
    name: AppKit native camera capture
    if: vars.MAUI_APPKIT_CAMERA_TESTS == '1'
    runs-on: [self-hosted, macOS, camera]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install pinned AppKit workload
        run: ./eng/common/dotnet.sh workload install macos --from-rollback-file eng/workloads/dotnet11-rc2.json
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Run camera-equipped AppKit regression
        run: >-
          python3 -B platforms/MacOS/tests/MacOS.RuntimeTests/run.py
          --scenario media-capture
          --evidence "$PWD/artifacts/appkit-media-capture"
      - name: Upload camera evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appkit-media-capture
          path: artifacts/appkit-media-capture/
          if-no-files-found: error
