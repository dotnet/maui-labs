name: CI - macOS AppKit

on:
  push:
    branches: [main]
    paths:
      - 'platforms/MacOS/**'
      - '.github/workflows/ci-macos-appkit.yml'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - 'platforms/MacOS/**'
      - '.github/workflows/ci-macos-appkit.yml'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: platforms/MacOS/MacOS.slnx
      project-name: macos-appkit
      os: '["macos-latest"]'
      install-workloads: true
      run-tests: true
      pack: true
      xcode-version: '26.3'

  shell-section-regression:
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          path: fixed
      - uses: actions/checkout@v6
        with:
          # Pre-#556 fix, including the unrelated AppKit quit-crash fix.
          ref: 23ea45e98b84bfbf9dd00f4859fd4cf30d44120d
          path: baseline
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: fixed/global.json
      - name: Select Xcode and install macOS workload
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          dotnet workload install macos --version 10.0.203
      - name: Verify section navigation fails before and passes after
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $relative = 'platforms/MacOS/tests/ShellSectionRegressionTests'
          Copy-Item "fixed/$relative" "baseline/$relative" -Recurse
          foreach ($variant in @('baseline', 'fixed')) {
            Push-Location $variant
            try {
              $env:SHELL_SECTION_RESULTS = Join-Path $env:GITHUB_WORKSPACE "section-runtime-evidence/$variant"
              New-Item -ItemType Directory -Force $env:SHELL_SECTION_RESULTS | Out-Null
              dotnet build "$relative/ShellSectionRegressionTests.csproj" -m:1 -nr:false -v:q *> "$env:SHELL_SECTION_RESULTS/build.log"
              if ($LASTEXITCODE -ne 0) {
                Get-Content "$env:SHELL_SECTION_RESULTS/build.log"
                throw "$variant build failed before runtime validation"
              }
              $bundle = Get-ChildItem artifacts/bin/ShellSectionRegressionTests -Filter '*.app' -Recurse -Directory | Select-Object -First 1
              if (!$bundle) { throw 'Missing regression app bundle' }
              & "$($bundle.FullName)/Contents/MacOS/ShellSectionRegressionTests" *> "$env:SHELL_SECTION_RESULTS/process.log"
              $exitCode = $LASTEXITCODE
              if ($variant -eq 'baseline') {
                if ($exitCode -ne 42 -or !(Select-String -Path "$env:SHELL_SECTION_RESULTS/failure.txt" -Pattern 'REGRESSION: route changed to two' -Quiet)) {
                  Get-Content "$env:SHELL_SECTION_RESULTS/process.log"
                  Get-Content "$env:SHELL_SECTION_RESULTS/failure.txt" -ErrorAction SilentlyContinue
                  throw "Baseline did not reproduce section navigation failure (exit $exitCode)"
                }
                Set-Content "$env:SHELL_SECTION_RESULTS/summary.txt" 'Baseline built and reproduced the expected lazy section-navigation failure.'
              } elseif ($exitCode -ne 0 -or !(Test-Path "$env:SHELL_SECTION_RESULTS/passed.txt")) {
                Get-Content "$env:SHELL_SECTION_RESULTS/process.log"
                Get-Content "$env:SHELL_SECTION_RESULTS/failure.txt" -ErrorAction SilentlyContinue
                throw "Fixed AppKit regression failed (exit $exitCode)"
              } else {
                Set-Content "$env:SHELL_SECTION_RESULTS/summary.txt" 'Fixed harness built and passed all native runtime assertions.'
              }
            } finally { Pop-Location }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shell-section-appkit-runtime
          path: section-runtime-evidence
          if-no-files-found: error

  layout-regression:
    name: Native dynamic layout regression
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.packages
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install pinned macOS workload
        run: ./eng/common/dotnet.sh workload install macos --version 10.0.203
      - name: Run native baseline and fixed regression
        shell: bash
        run: |
          set -euo pipefail
          project=platforms/MacOS/tests/LayoutRegressionTests/LayoutRegressionTests.csproj
          source=platforms/MacOS/src/MacOS/Handlers/LayoutHandler.cs
          evidence="$PWD/artifacts/appkit-layout"
          mkdir -p "$evidence"
          cp "$source" "$evidence/LayoutHandler.fixed.cs"
          trap 'cp "$evidence/LayoutHandler.fixed.cs" "$source"' EXIT
          python3 - "$source" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          fixed = "public LayoutHandler() : base(Mapper, CommandMapper)"
          assert source.count(fixed) == 1, "Expected exactly one fixed constructor"
          path.write_text(source.replace(fixed, "public LayoutHandler() : base(Mapper)"))
          PY
          ./eng/common/dotnet.sh build "$project" -c Debug -p:ContinuousIntegrationBuild=true | tee "$evidence/baseline-build.log"
          executable="$(find artifacts/bin/LayoutRegressionTests/Debug -path '*.app/Contents/MacOS/LayoutRegressionTests' -type f)"
          if [[ ! -f "$executable" ]]; then
            echo "::error::Expected exactly one LayoutRegressionTests native app executable; found: $executable"
            exit 1
          fi
          set +e
          APPKIT_LAYOUT_ARTIFACTS="$evidence/baseline" "$executable" > "$evidence/baseline.log" 2>&1
          baseline_exit=$?
          set -e
          cat "$evidence/baseline.log"
          test "$baseline_exit" -eq 1
          grep -F 'Expected 2 native children, got 1' "$evidence/baseline.log"
          cp "$evidence/LayoutHandler.fixed.cs" "$source"
          ./eng/common/dotnet.sh build "$project" -c Debug -p:ContinuousIntegrationBuild=true | tee "$evidence/fixed-build.log"
          APPKIT_LAYOUT_ARTIFACTS="$evidence/fixed" "$executable" 2>&1 | tee "$evidence/fixed.log"
          test "$(grep -c '^PASS ' "$evidence/fixed.log")" -eq 6
      - name: Upload hosted AppKit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appkit-layout-runtime
          path: artifacts/appkit-layout/
          if-no-files-found: error
