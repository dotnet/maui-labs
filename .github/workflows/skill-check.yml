name: skill-check

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'tests/**'
      - 'eng/allowed-external-deps.txt'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'tests/**'
      - 'eng/allowed-external-deps.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.3.26207.106

      - name: Checkout skill-validator
        uses: actions/checkout@v6
        with:
          repository: dotnet/skills
          ref: 4be92ceb4e2d20e6b1fe9662a59b2fff0f4c5b4f
          path: .skill-validator-source
          persist-credentials: false

      - name: Run skill-validator check
        working-directory: .skill-validator-source
        run: |
          dotnet restore eng/skill-validator/src/SkillValidator.csproj \
            -p:ImportDirectoryBuildTargets=false \
            -p:ManagePackageVersionsCentrally=false \
            --source https://api.nuget.org/v3/index.json

          plugin_args=()
          for d in ../plugins/*/; do
            plugin_args+=(--plugin "$d")
          done
          dotnet run \
            --project eng/skill-validator/src/SkillValidator.csproj \
            --configuration Release \
            --no-restore \
            -p:ImportDirectoryBuildTargets=false \
            -p:ManagePackageVersionsCentrally=false \
            -- check \
            "${plugin_args[@]}" \
            --allowed-external-deps ../eng/allowed-external-deps.txt

  migration-audit-tests:
    name: Migration acceptance tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test migration audit and qualification acceptance
        run: >-
          node --test
          tests/dotnet-maui/maui-xcode27-migration/audit-lifecycle.test.mjs
          tests/dotnet-maui/maui-xcode27-migration/fixture-manifest.test.mjs
          tests/dotnet-maui/maui-xcode27-migration/acceptance-audit.test.mjs
          tests/dotnet-maui/maui-xcode27-migration/runtime/assertions.test.mjs
          tests/dotnet-maui/maui-xcode27-migration/runtime/runner.test.mjs
