name: skill-check

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'tests/**'
      - 'eng/allowed-external-deps.txt'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'tests/**'
      - 'eng/allowed-external-deps.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download skill-validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/skill-validator
          gh api repos/dotnet/skills/releases/assets/597658130 \
            -H "Accept: application/octet-stream" \
            > /tmp/skill-validator/skill-validator-linux-x64.tar.gz

          cd /tmp/skill-validator
          echo "7f137e8de2d51a52a453f6cf621df7b49043ac1a03a8fa5924a020612205b301  skill-validator-linux-x64.tar.gz" \
            | sha256sum --check --strict

          mkdir -p bin
          tar -xzf skill-validator-linux-x64.tar.gz -C bin
          chmod +x bin/skill-validator

      - name: Run skill-validator check
        run: |
          plugin_args=()
          for d in plugins/*/; do
            plugin_args+=(--plugin "$d")
          done
          /tmp/skill-validator/bin/skill-validator check \
            "${plugin_args[@]}" \
            --allowed-external-deps eng/allowed-external-deps.txt
