name: Build
on:
  workflow_call:
    inputs:
      project-path:
        required: true
        type: string
        description: 'Path to the solution filter or project to build'
      project-name:
        required: true
        type: string
        description: 'Human-readable name for artifact naming'
      additional-dotnet-version:
        required: false
        type: string
        default: ''
        description: 'Additional SDK/runtime lane to install alongside the repository-pinned SDK for multi-targeted tests.'
      isolated-dotnet:
        required: false
        type: boolean
        default: false
        description: 'Install the SDK in a clean runner directory instead of using machine-wide Visual Studio workloads.'
      run-tests:
        required: false
        type: boolean
        default: true
      test-only:
        required: false
        type: boolean
        default: false
        description: 'Explicitly replace the Arcade build with targeted dotnet test. Requires run-tests: true and pack: false (pack enables signing/publishing).'
      test-arguments-json:
        required: false
        type: string
        default: '[]'
        description: 'JSON string array of dotnet test arguments (version properties/filter), only valid with test-only: true. Arguments are not evaluated by a shell.'
      build-target-framework:
        required: false
        type: string
        default: ''
        description: 'Build only this target framework with dotnet build. Requires run-tests: false and pack: false.'
      pack:
        required: false
        type: boolean
        default: false
      build-arguments:
        required: false
        type: string
        default: ''
        description: 'Additional arguments passed to the Arcade build commands.'
      install-workloads:
        required: false
        type: boolean
        default: true
        description: 'Install MAUI workloads and Android SDK (not needed for framework-only projects)'
      workloads:
        required: false
        type: string
        default: 'maui ios maccatalyst macos maui-tizen'
        description: 'Space-separated list of workloads to install (only used when install-workloads is true)'
      workload-rollback-file:
        required: false
        type: string
        default: 'eng/workloads/dotnet11-ga.json'
        description: 'Pinned GA manifests matching workload set 11.0.100.1.'
      os:
        required: false
        type: string
        default: '["macos-latest", "windows-latest"]'
        description: 'JSON array of runner OS labels'
      native-deps:
        required: false
        type: string
        default: ''
        description: 'Shell command to install native dependencies (e.g. apt-get for GTK4)'
      xcode-version:
        required: false
        type: string
        default: ''
        description: 'Xcode version to select on macOS (e.g. "27.2"). Empty uses runner default.'
      skip-xcode-version-validation:
        required: false
        type: boolean
        default: false
        description: 'Skip .NET Apple pack/Xcode version validation when building older Apple TFMs on a newer Xcode.'
      pre-build-artifact:
        required: false
        type: string
        default: ''
        description: 'Artifact name to download into artifacts/bin/ before building. Used to inject pre-built native artifacts (e.g. Apple .resources.zip) from a prior job.'
      android-project:
        required: false
        type: string
        default: 'src/DevFlow/Microsoft.Maui.DevFlow.Agent/Microsoft.Maui.DevFlow.Agent.csproj'
        description: 'Project path for InstallAndroidDependencies target. Must target net11.0-android.'

env:
  CI_PACKAGE_VERSION_SUFFIX: ci.${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  build:
    strategy:
      matrix:
        os: ${{ fromJson(inputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate explicit test-only mode
        if: (inputs.test-only && (!inputs.run-tests || inputs.pack)) || (!inputs.test-only && inputs.test-arguments-json != '[]')
        shell: pwsh
        run: throw 'Test arguments require test-only=true; test-only requires run-tests=true and pack=false (no signing or publishing).'

      - name: Validate targeted build mode
        if: inputs.build-target-framework != '' && (inputs.test-only || inputs.run-tests || inputs.pack)
        shell: pwsh
        run: throw 'build-target-framework requires test-only=false, run-tests=false, and pack=false.'

      - name: Download pre-build artifact
        if: inputs.pre-build-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.pre-build-artifact }}
          path: artifacts/bin

      - name: Select Xcode
        if: inputs.xcode-version != '' && runner.os == 'macOS'
        run: |
          developer_dir="$(cd /Applications/Xcode_${{ inputs.xcode-version }}.app/Contents/Developer && pwd -P)"
          sudo xcode-select -s "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -showsdks
          ls -l "$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs"
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$sdk_path"
          xcrun --sdk macosx --find install_name_tool

      - name: Setup Java
        if: inputs.install-workloads && inputs.android-project != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ inputs.isolated-dotnet && format('{0}/maui-ci-dotnet', runner.temp) || '' }}
        with:
          global-json-file: global.json
          dotnet-version: ${{ inputs.additional-dotnet-version }}

      - name: Install native dependencies
        if: inputs.native-deps != ''
        run: ${{ inputs.native-deps }}

      - name: Install NativeAOT dependencies
        if: inputs.project-name == 'cli' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Use Arcade's dotnet wrapper for workload-related setup so SDK resolution
      # matches the later cibuild invocation.
      - name: Install workloads from GA manifests (Windows)
        if: inputs.install-workloads && runner.os == 'Windows'
        run: eng\common\dotnet.cmd workload install ${{ inputs.workloads }} --from-rollback-file ${{ inputs.workload-rollback-file }}
        shell: cmd

      - name: Install workloads from GA manifests (Unix)
        if: inputs.install-workloads && runner.os != 'Windows'
        run: ./eng/common/dotnet.sh workload install ${{ inputs.workloads }} --from-rollback-file ${{ inputs.workload-rollback-file }}

      - name: Install Android SDK dependencies (Windows)
        if: inputs.install-workloads && runner.os == 'Windows' && inputs.android-project != ''
        run: eng\common\dotnet.cmd build -t:InstallAndroidDependencies -f net11.0-android -p:AndroidSdkDirectory="%ANDROID_HOME%" -p:AcceptAndroidSDKLicenses=true ${{ inputs.android-project }}
        shell: cmd

      - name: Install Android SDK dependencies (macOS)
        if: inputs.install-workloads && runner.os == 'macOS' && inputs.android-project != ''
        run: ./eng/common/dotnet.sh build -t:InstallAndroidDependencies -f net11.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true ${{ inputs.android-project }}

      # cibuild.cmd/.sh hardcode -pack -publish, and Arcade's publish step errors out with
      # "ItemsToPush is not specified" when a filter contains nothing packable (e.g. sample
      # app heads). Expanded here so those flags can follow the `pack` input. For pack: true
      # callers this is the exact command cibuild runs.
      - name: Build, Test and Pack (Windows)
        if: runner.os == 'Windows' && !inputs.test-only && inputs.build-target-framework == ''
        run: >
          eng\common\build.cmd
          -restore -build -test -ci
          ${{ inputs.pack && '-sign -pack -publish' || '' }}
          -configuration Release
          -prepareMachine
          -projects %CD%\${{ inputs.project-path }}
          /p:VersionSuffix=%CI_PACKAGE_VERSION_SUFFIX%
          ${{ inputs.project-name == 'cli' && '/p:SkipMauiCliPack=true' || '' }}
          ${{ inputs.build-arguments }}
        shell: cmd

      - name: Build and Test (macOS)
        if: runner.os == 'macOS' && !inputs.test-only && inputs.build-target-framework == ''
        run: >
          ./eng/common/build.sh
          --restore --build --test
          ${{ matrix.os == 'xcode-27' && '--binaryLog /p:ContinuousIntegrationBuild=true' || '--ci' }}
          ${{ inputs.pack && '--pack --publish' || '' }}
          --configuration Release
          --prepareMachine
          --projects $(pwd)/${{ inputs.project-path }}
          /p:VersionSuffix=$CI_PACKAGE_VERSION_SUFFIX
          ${{ inputs.project-name == 'cli' && '/p:SkipMauiCliPack=true' || '' }}
          ${{ matrix.os == 'xcode-27' && '/p:JavaSdkDirectory=$JAVA_HOME' || '' }}
          ${{ inputs.build-arguments }}
          ${{ inputs.skip-xcode-version-validation && '/p:ValidateXcodeVersion=false' || '' }}

      - name: Build and Test (Linux)
        if: startsWith(matrix.os, 'ubuntu') && !inputs.test-only && inputs.build-target-framework == ''
        run: >
          ./eng/common/build.sh
          --restore --build --test --ci
          ${{ inputs.pack && '--pack --publish' || '' }}
          --configuration Release
          --prepareMachine
          --projects $(pwd)/${{ inputs.project-path }}
          /p:VersionSuffix=$CI_PACKAGE_VERSION_SUFFIX
          ${{ inputs.project-name == 'cli' && '/p:SkipMauiCliPack=true' || '' }}
          ${{ inputs.build-arguments }}

      - name: Pack NativeAOT CLI
        if: inputs.pack && inputs.project-name == 'cli'
        shell: pwsh
        run: |
          $rid = switch ('${{ runner.os }}') {
            'Windows' { 'win-x64' }
            'Linux' { 'linux-x64' }
            'macOS' { 'osx-arm64' }
            default { throw "Unsupported NativeAOT build OS: ${{ runner.os }}" }
          }

          dotnet pack src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj `
            --configuration Release `
            --runtime $rid `
            -p:VersionSuffix=$env:CI_PACKAGE_VERSION_SUFFIX
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ('${{ runner.os }}' -eq 'Windows') {
            dotnet pack src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj `
              --configuration Release `
              --runtime any `
              -p:PublishAot=false `
              -p:PublishTrimmed=false `
              -p:SelfContained=false `
              -p:VersionSuffix=$env:CI_PACKAGE_VERSION_SUFFIX
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            dotnet pack src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj `
              --configuration Release `
              -p:VersionSuffix=$env:CI_PACKAGE_VERSION_SUFFIX
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build targeted framework
        if: inputs.build-target-framework != ''
        shell: pwsh
        env:
          BUILD_PROJECT: ${{ inputs.project-path }}
          BUILD_TARGET_FRAMEWORK: ${{ inputs.build-target-framework }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build $env:BUILD_PROJECT `
            --configuration Release `
            --framework $env:BUILD_TARGET_FRAMEWORK `
            --warnaserror `
            -p:ContinuousIntegrationBuild=false `
            -p:VersionSuffix=$env:CI_PACKAGE_VERSION_SUFFIX `
            ${{ inputs.build-arguments }}

      - name: Run targeted platform tests
        if: inputs.test-only
        shell: pwsh
        env:
          TEST_PROJECT: ${{ inputs.project-path }}
          TEST_ARGUMENTS_JSON: ${{ inputs.test-arguments-json }}
        run: |
          $ErrorActionPreference = 'Stop'
          $additional = ConvertFrom-Json -InputObject $env:TEST_ARGUMENTS_JSON -NoEnumerate
          if ($additional -isnot [array] -or @($additional | Where-Object { $_ -isnot [string] }).Count -ne 0) {
            throw 'test-arguments-json must be an array of strings.'
          }
          $resultsDirectory = Join-Path 'artifacts/TestResults' "targeted-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $resultsDirectory) { throw 'Refusing stale targeted test results.' }
          $testArguments = @(
            'test', $env:TEST_PROJECT, '--configuration', 'Release', '-m:1', '-nr:false',
            "-p:VersionSuffix=$env:CI_PACKAGE_VERSION_SUFFIX",
            '--logger', 'trx;LogFilePrefix=results',
            '--results-directory', $resultsDirectory
          ) + $additional
          & dotnet @testArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify targeted tests executed
        if: inputs.test-only
        shell: pwsh
        run: |
          $resultsDirectory = Join-Path 'artifacts/TestResults' "targeted-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $results = @(Get-ChildItem -LiteralPath $resultsDirectory -Filter *.trx)
          if ($results.Count -eq 0) { throw 'Targeted test mode produced no TRX results.' }
          foreach ($result in $results) {
            [xml]$document = Get-Content -LiteralPath $result.FullName -Raw
            $counts = $document.TestRun.ResultSummary.Counters
            if ([int]$counts.total -le 0 -or [int]$counts.executed -ne [int]$counts.total -or
                [int]$counts.passed -ne [int]$counts.total -or [int]$counts.failed -ne 0 -or
                [int]$counts.notExecuted -ne 0) {
              throw "Targeted tests must all execute and pass without skips: $($result.Name)"
            }
          }

      # The publish-output smoke test below cannot tell which build `dotnet tool install` really picks. A
      # TFM-specific net9.0 build next to the AOT one silently wins, so install the packed tool and check.
      - name: Verify installed tool is NativeAOT (Windows)
        if: runner.os == 'Windows' && inputs.pack && inputs.project-name == 'cli' && !inputs.test-only
        shell: bash
        run: |
          set -euo pipefail

          pkg_dir="artifacts/packages/Release/Shipping"
          pointer="$(ls "$pkg_dir"/Microsoft.Maui.Cli.[0-9]*.nupkg | head -1)"
          version="$(basename "$pointer" .nupkg)"
          version="${version#Microsoft.Maui.Cli.}"

          tool_path="$RUNNER_TEMP/maui-tool"
          dotnet tool install Microsoft.Maui.Cli --tool-path "$tool_path" --version "$version" \
            --add-source "$pkg_dir" --ignore-failed-sources

          exe="$(find "$tool_path/.store" -path '*/tools/any/win-x64/maui.exe' | head -1)"
          test -n "$exe" || { echo "::error::The installed tool has no NativeAOT win-x64 executable."; exit 1; }
          test "$(wc -c < "$exe")" -gt 5000000 || { echo "::error::The installed executable is too small to be NativeAOT."; exit 1; }
          if find "$tool_path/.store" -path '*/tools/net*/win-x64/*' | grep -q .; then
            echo "::error::The win-x64 package also contains a TFM-specific build, which would be installed instead of NativeAOT."
            exit 1
          fi

          "$exe" version

      # ILC cannot flag every runtime failure, so publish with warnings as errors and then run the
      # real executable. Windows and Linux are covered too: they compile different native code.
      - name: NativeAOT publish smoke test
        if: inputs.project-name == 'cli' && !inputs.test-only
        shell: bash
        run: |
          set -euo pipefail

          case "$RUNNER_OS" in
            Windows) rid="win-x64"; exe="maui.exe"; python_exe="python"; smoke_args="--windows-uia" ;;
            Linux) rid="linux-x64"; exe="maui"; python_exe="python3"; smoke_args="" ;;
            macOS) rid="osx-arm64"; exe="maui"; python_exe="python3"; smoke_args="" ;;
            *)
              echo "Unsupported NativeAOT smoke-test OS: $RUNNER_OS"
              exit 1
              ;;
          esac

          dotnet publish src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj \
            -c Release \
            -f net11.0 \
            -r "$rid" \
            -p:PublishAot=true \
            -p:PublishTrimmed=true \
            -p:TreatWarningsAsErrors=true \
            --self-contained true

          publish_dir="artifacts/bin/Microsoft.Maui.Cli/Release/net11.0/$rid/publish"
          test -f "$publish_dir/Build/Microsoft.Maui.ProfilingHelper.dll"
          test -f "$publish_dir/go-server/Microsoft.Maui.Go.Server.dll"

          "$python_exe" eng/smoke-tests/cli-nativeaot-smoke.py "$publish_dir/$exe" $smoke_args

      - name: Upload test results
        if: inputs.run-tests && !inputs.test-only && always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.project-name }}-${{ matrix.os }}
          path: artifacts/TestResults/**/*.xml

      # Arcade writes per-project test output under artifacts/log, which is otherwise lost when a test fails.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ inputs.project-name }}-${{ matrix.os }}
          path: artifacts/log/**
          if-no-files-found: ignore

      - name: Upload targeted test results
        if: inputs.test-only && always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.project-name }}-${{ matrix.os }}
          path: artifacts/TestResults/targeted-${{ github.run_id }}-${{ github.run_attempt }}/**/*.trx
          if-no-files-found: error

      - name: Validate packages
        if: inputs.pack
        shell: bash
        run: |
          set -euo pipefail

          produced_packages="$(find artifacts/packages -name '*.nupkg' -type f | sort || true)"
          if [[ -z "$produced_packages" ]]; then
            echo "::error::No .nupkg files produced in packages output."
            exit 1
          fi

          if [[ '${{ inputs.project-name }}' == 'devflow' ]]; then
            expected_package_ids=(
              Microsoft.Maui.DevFlow.Agent
              Microsoft.Maui.DevFlow.Blazor
            )

            for package_id in "${expected_package_ids[@]}"; do
              if ! find artifacts/packages -name "$package_id.[0-9]*.nupkg" -type f | grep -q .; then
                echo "::error::Expected package '$package_id' was not produced in packages output."
                exit 1
              fi
            done

            mapfile -t driver_packages < <(find artifacts/packages/Release/Shipping \
              -name 'Microsoft.Maui.DevFlow.Driver.[0-9]*.nupkg' ! -name '*.symbols.nupkg' -type f)
            if [[ ${#driver_packages[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one shipping Driver package."
              exit 1
            fi

            driver_files="$(unzip -Z1 "${driver_packages[0]}")"
            driver_dlls="$(grep -E '^lib/[^/]+/Microsoft\.Maui\.DevFlow\.Driver\.dll$' <<< "$driver_files" || true)"
            if [[ -z "$driver_dlls" ]]; then
              echo "::error::Missing Driver DLL in lib/<tfm>/."
              exit 1
            fi
            while IFS= read -r driver_dll; do
              folder="${driver_dll%/*}"
              if ! grep -Fxq "$folder/Xamarin.Android.Tools.AndroidSdk.dll" <<< "$driver_files"; then
                echo "::error::Missing Android SDK DLL alongside $driver_dll."
                exit 1
              fi
            done <<< "$driver_dlls"

            driver_nuspec="$(unzip -p "${driver_packages[0]}" Microsoft.Maui.DevFlow.Driver.nuspec)"
            if grep -Fqi 'id="Xamarin.Android.Tools.AndroidSdk"' <<< "$driver_nuspec"; then
              echo "::error::Driver must not declare an Android SDK package dependency."
              exit 1
            fi
          fi

          printf '%s\n' "$produced_packages"

      - name: Upload packages
        if: inputs.pack
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ inputs.project-name }}-${{ matrix.os }}
          path: artifacts/packages/**/*.nupkg
          if-no-files-found: error

      - name: Upload native Apple artifacts
        if: inputs.pack && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: native-apple-${{ inputs.project-name }}
          path: artifacts/bin/**/Release/**/*.resources.zip
          if-no-files-found: ignore
