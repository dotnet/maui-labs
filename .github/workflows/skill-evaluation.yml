# Skill evaluation status workflow for PRs that modify skills.
#
# Triggers:
#   - On PR open/sync: posts a successful commit status
#   - When a maintainer posts "/evaluate" on the PR: explains why automated
#     evaluation of PR-authored content is disabled
#
# Security: PR-authored eval.yaml files may contain executable setup and assertion
# features. They must not be evaluated on a credential-bearing GitHub-hosted runner.
name: skill-evaluation

on:
  pull_request:
    paths:
      - 'plugins/**/skills/**'
      - 'tests/**'

  issue_comment:
    types: [created]

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'issue_comment'
        && startsWith(github.event.comment.body, '/evaluate')
        && format('eval-{0}', github.event.issue.number)
      || github.event_name == 'pull_request'
        && format('eval-status-{0}', github.event.pull_request.number)
      || github.run_id
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Post initial commit status so required check is never stuck as "Expected"
  pr-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover changes requiring evaluation
        id: discover
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MERGE_BASE=$(git merge-base "$BASE" "$HEAD")

          HAS_SKILL_CHANGES=$(git diff --name-only --diff-filter=ACMR "$MERGE_BASE" "$HEAD" | \
            grep -E '^(plugins/[^/]+/skills|tests/[^/]+)/[^/]+/' | head -1 || true)

          if [ -n "$HAS_SKILL_CHANGES" ]; then
            echo "needs_eval=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_eval=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post evaluation commit status
        # Skip on fork PRs — restricted GITHUB_TOKEN can't write commit statuses
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.discover.outputs.needs_eval }}" = "true" ]; then
            DESC="Static skill validation runs in the skill-check workflow"
          else
            DESC="No skills to evaluate"
          fi

          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="success" \
            -f context="evaluation-status" \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Explain why untrusted PR content cannot be evaluated in this workflow.
  evaluation-disabled:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/evaluate')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check permissions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")

          if [[ "$PERMISSION" == "admin" || "$PERMISSION" == "maintain" || "$PERMISSION" == "write" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
              -X POST -f body="⚠️ Only collaborators with write access can trigger evaluation." --silent || true
          fi

      - name: Explain disabled evaluation
        if: steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -X POST \
            -f body="⚠️ Automated LLM evaluation is disabled because PR-authored eval files can execute commands. Use the pinned static \`skill-check\` workflow while evaluation is redesigned to run without repository credentials in a dedicated sandbox." \
            --silent
