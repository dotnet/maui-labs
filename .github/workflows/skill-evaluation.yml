# Skill evaluation workflow for PRs that modify skills.
#
# Triggers:
#   - On PR open/sync: posts a commit status (success if no skills changed, pending if changed)
#   - When a maintainer posts "/evaluate <sha>" on the PR: runs full LLM evaluation
#
# Security model
# --------------
# The workflow YAML always runs from the default branch (issue_comment trigger), and only
# collaborators with write+ permission can trigger an evaluation. Two further boundaries matter:
#
#  1. Privilege split. `evaluate` is the only job that checks out pull-request-controlled content
#     (skill definitions, eval.yaml). It therefore runs with `permissions: contents: read` and
#     nothing else: it cannot comment, cannot set a commit status, and cannot write to the repo.
#     Results travel to the privileged `report` job as an artifact, and only `report` — which never
#     checks out PR content — holds the write permissions needed to comment and set the status.
#     `persist-credentials: false` alone is not a boundary: anything in a job's environment is
#     reachable by whatever that job runs, so the separation has to be between jobs.
#
#     `evaluate` still needs COPILOT_GITHUB_TOKEN, because skill-validator authenticates its LLM
#     API calls with it for the pairwise (with-skill vs without-skill) comparison. That token is
#     the one secret deliberately kept in the untrusted-content job, and evaluating a skill is by
#     construction "run an agent against these instructions", so treat it as reachable by the
#     pull request. It MUST therefore be a token with no repository write permission — a
#     fine-grained token scoped to model inference only. If it is ever replaced with a classic
#     repo-scoped PAT, this split stops being a boundary. Do not add any further secret or write
#     permission to that job.
#
#  2. Pinned revision. A fork PR must name the exact commit to evaluate ("/evaluate <sha>"), and
#     the gate refuses if the branch has moved since. Re-resolving the head at command time let an
#     author push a new head between the maintainer's review and their comment, and have that new
#     head evaluated instead.
name: skill-evaluation

on:
  pull_request:
    paths:
      - 'plugins/**/skills/**'
      # `.github/skills/**` keeps the required check from getting stuck on a
      # mirror-only PR. The discovery step below only evaluates
      # `plugins/<p>/skills` and `tests/<p>`, so such a PR resolves to
      # needs_eval=false and posts the success status without evaluating.
      - '.github/skills/**'
      - 'tests/**'

  issue_comment:
    types: [created]

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'issue_comment'
        && startsWith(github.event.comment.body, '/evaluate')
        && format('eval-{0}', github.event.issue.number)
      || github.event_name == 'pull_request'
        && format('eval-status-{0}', github.event.pull_request.number)
      || github.run_id
    }}
  # Never cancel an in-flight evaluation: the concurrency group is computed before the gate runs, so
  # cancelling on a new comment would let any commenter kill a maintainer-approved run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Post initial commit status so required check is never stuck as "Expected"
  pr-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover changes requiring evaluation
        id: discover
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MERGE_BASE=$(git merge-base "$BASE" "$HEAD")

          HAS_SKILL_CHANGES=$(git diff --name-only --diff-filter=ACMR "$MERGE_BASE" "$HEAD" | \
            grep -E '^(plugins/[^/]+/skills|tests/[^/]+)/[^/]+/' | head -1 || true)

          if [ -n "$HAS_SKILL_CHANGES" ]; then
            echo "needs_eval=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_eval=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post evaluation commit status
        # Skip on fork PRs — restricted GITHUB_TOKEN can't write commit statuses
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.discover.outputs.needs_eval }}" = "true" ]; then
            STATE="pending"
            DESC="Post /evaluate <sha> to trigger evaluation"
          else
            STATE="success"
            DESC="No skills to evaluate"
          fi

          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="$STATE" \
            -f context="evaluation-status" \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Gate: validate the /evaluate command, the commenter's permission, and the pinned revision.
  # Privileged, and deliberately never checks out pull-request content.
  gate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/evaluate')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      should_run: ${{ steps.check.outputs.should_run == 'true' && steps.pr-info.outputs.approved == 'true' }}
      pr_number: ${{ github.event.issue.number }}
      pr_head_sha: ${{ steps.pr-info.outputs.eval_sha }}
      pr_head_repo: ${{ steps.pr-info.outputs.head_repo }}
      is_fork: ${{ steps.pr-info.outputs.is_fork }}
    steps:
      - name: Check permissions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/$COMMENTER/permission" \
            --jq '.permission' 2>/dev/null || echo "none")

          if [[ "$PERMISSION" == "admin" || "$PERMISSION" == "maintain" || "$PERMISSION" == "write" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions" \
              -X POST -f content="+1" --silent || true
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              -X POST -f body="⚠️ Only collaborators with write access can trigger evaluation." --silent || true
          fi

      # Resolves which commit gets evaluated. A fork PR has to name it, so the revision that runs is
      # the revision the maintainer read, not whatever the branch points at by the time this runs.
      - name: Resolve the reviewed revision
        if: steps.check.outputs.should_run == 'true'
        id: pr-info
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            --jq '{head_sha: .head.sha, head_repo: .head.repo.full_name, base_repo: .base.repo.full_name}')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head_sha')
          HEAD_REPO=$(echo "$PR_JSON" | jq -r '.head_repo')
          BASE_REPO=$(echo "$PR_JSON" | jq -r '.base_repo')

          IS_FORK=true
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            IS_FORK=false
          fi

          echo "head_repo=$HEAD_REPO" >> "$GITHUB_OUTPUT"
          echo "is_fork=$IS_FORK" >> "$GITHUB_OUTPUT"

          # Read the pinned revision from the command body, never from a template expansion.
          PINNED=$(head -n 1 <<<"$COMMENT_BODY" \
            | tr -d '\r' \
            | sed -nE 's#^/evaluate[[:space:]]+([0-9a-fA-F]{40})[[:space:]]*$#\1#p' \
            | tr 'A-Z' 'a-z')

          refuse() {
            echo "approved=false" >> "$GITHUB_OUTPUT"
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              -X POST -f body="$1" --silent || true
            echo "::error::$1"
          }

          if [ -n "$PINNED" ]; then
            if [ "$PINNED" != "$HEAD_SHA" ]; then
              refuse "⚠️ This pull request moved to \`$HEAD_SHA\` after \`$PINNED\` was named. Re-review the new head and post \`/evaluate $HEAD_SHA\`."
              exit 0
            fi
          elif [ "$IS_FORK" = "true" ]; then
            refuse "⚠️ Evaluating a fork pull request runs untrusted content, so the command must name the reviewed commit: post \`/evaluate $HEAD_SHA\`."
            exit 0
          else
            PINNED="$HEAD_SHA"
          fi

          echo "approved=true" >> "$GITHUB_OUTPUT"
          echo "eval_sha=$PINNED" >> "$GITHUB_OUTPUT"

  # Runs pull-request-controlled content. Read-only, cannot comment, cannot set a commit status, and
  # holds no secret other than the LLM token skill-validator needs. Do not add permissions here.
  evaluate:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Checkout the reviewed revision
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.gate.outputs.pr_head_repo }}
          ref: ${{ needs.gate.outputs.pr_head_sha }}
          persist-credentials: false

      - name: Verify the checked-out revision
        env:
          EXPECTED_SHA: ${{ needs.gate.outputs.pr_head_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $ACTUAL_SHA but the gate approved $EXPECTED_SHA."
            exit 1
          fi

      - name: Download skill-validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download skill-validator-nightly \
            --repo dotnet/skills \
            --pattern "skill-validator-linux-x64.tar.gz" \
            --pattern "checksums.sha256" \
            --dir /tmp/skill-validator

          # Verify checksum before extracting. This job holds a secret, so a missing checksum is a
          # refusal rather than a warning.
          cd /tmp/skill-validator
          if [ ! -f checksums.sha256 ]; then
            echo "::error::The skill-validator release published no checksums.sha256."
            exit 1
          fi
          grep "skill-validator-linux-x64.tar.gz" checksums.sha256 | sha256sum --check --strict

          mkdir -p bin
          tar -xzf skill-validator-linux-x64.tar.gz -C bin
          chmod +x bin/skill-validator

      - name: Discover skills to evaluate
        id: discover
        run: |
          # Find all plugins with both skills and tests (one entry per plugin)
          ENTRIES="[]"
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            skills_path="$plugin_dir/skills"
            tests_dir="tests/$plugin_name"

            if [ -d "$skills_path" ] && [ -d "$tests_dir" ] && \
               find "$tests_dir" -name 'eval.yaml' -print -quit | grep -q .; then
              ENTRIES=$(echo "$ENTRIES" | jq --arg plugin "$plugin_name" \
                --arg skills_path "$skills_path" \
                '. + [{"plugin": $plugin, "skills_path": $skills_path}]')
            fi
          done

          echo "entries=$(echo "$ENTRIES" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Found $(echo "$ENTRIES" | jq length) skill(s) to evaluate"

      - name: Run evaluation
        if: fromJson(steps.discover.outputs.entries)[0] != null
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ENTRIES: ${{ steps.discover.outputs.entries }}
        run: |
          RESULTS_DIR="artifacts/eval-results"
          mkdir -p "$RESULTS_DIR"

          EVAL_FAILED=0
          while read -r entry; do
            [ -z "$entry" ] && continue
            plugin=$(echo "$entry" | jq -r '.plugin')
            skills_path=$(echo "$entry" | jq -r '.skills_path')

            echo "=== Evaluating plugin: $plugin ==="
            if ! /tmp/skill-validator/bin/skill-validator evaluate \
              --verdict-warn-only \
              --results-dir "$RESULTS_DIR/$plugin" \
              --reporter console --reporter json --reporter markdown \
              --runs 3 \
              --tests-dir "./tests/$plugin" \
              "./$skills_path"; then
              echo "::warning::Evaluation failed for $plugin"
              EVAL_FAILED=1
            fi
          done < <(echo "$ENTRIES" | jq -c '.[]')
          exit $EVAL_FAILED

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skill-evaluation-results
          path: artifacts/eval-results/
          retention-days: 30
          if-no-files-found: ignore

  # Publishes the outcome. Privileged, and never checks out pull-request content: it only reads the
  # artifact the unprivileged job produced.
  report:
    needs: [gate, evaluate]
    if: always() && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
      issues: write
    steps:
      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-evaluation-results
          path: artifacts/eval-results

      - name: Post results to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          EVAL_SHA: ${{ needs.gate.outputs.pr_head_sha }}
          EVAL_RESULT: ${{ needs.evaluate.result }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Everything between the header and the footer is content the pull request controls, and
          # this job publishes it under the repository's identity. Bound it, and defuse @mentions
          # with a zero-width space so a report cannot make this bot ping people.
          sanitize() {
            head -c 40000 "$1" | sed -E 's/@([A-Za-z0-9])/@\&#8203;\1/g'
          }

          mapfile -t REPORT_DIRS < <(find artifacts/eval-results -name results.json -printf '%h\n' 2>/dev/null | sort -u || true)
          {
            echo "## Skill Evaluation Results"
            echo ""
            echo "Evaluated commit: \`$EVAL_SHA\` (job result: \`$EVAL_RESULT\`)"
            echo ""
            if [ "${#REPORT_DIRS[@]}" -gt 0 ]; then
              echo "> [!WARNING]"
              echo "> The report below is produced from the evaluated pull request and is untrusted content."
              echo ""
              for dir in "${REPORT_DIRS[@]}"; do
                # The directory name comes from a plugin directory the pull request controls.
                echo "### $(basename "$dir" | tr -cd '[:alnum:]._-' | head -c 100)"
                if [ -f "$dir/results.md" ]; then
                  sanitize "$dir/results.md"
                else
                  echo "_No markdown report was produced._"
                fi
                echo ""
              done
            else
              echo "ℹ️ No evaluation results were produced."
            fi
            echo "[Full results]($RUN_URL)"
          } > full-body.md

          # GitHub rejects comments over 65536 characters, so bound the assembled body too.
          head -c 60000 full-body.md > comment-body.md

          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -X POST -F "body=@comment-body.md"

      - name: Update commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVAL_SHA: ${{ needs.gate.outputs.pr_head_sha }}
          EVAL_RESULT: ${{ needs.evaluate.result }}
        run: |
          if [ "$EVAL_RESULT" = "success" ]; then
            STATE="success"
            DESC="Evaluation completed"
          else
            STATE="failure"
            DESC="Evaluation failed"
          fi

          gh api "repos/${{ github.repository }}/statuses/$EVAL_SHA" \
            -f state="$STATE" \
            -f context="evaluation-status" \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
