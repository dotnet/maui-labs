name: CI - Linux GTK4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-linux-gtk4.yml'
      - '.github/workflows/_build.yml'
      - 'src/DevFlow/**'
      - 'platforms/Linux.Gtk4/**'
      - 'platforms/Shared/Essentials*/**'
      - 'platforms/Shared/ResourceAcceptance/**'
      - 'platforms/Shared/Blazor/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, redth-net11-foundation-pr]
    paths:
      - '.github/workflows/ci-linux-gtk4.yml'
      - '.github/workflows/_build.yml'
      - 'src/DevFlow/**'
      - 'platforms/Linux.Gtk4/**'
      - 'platforms/Shared/Essentials*/**'
      - 'platforms/Shared/ResourceAcceptance/**'
      - 'platforms/Shared/Blazor/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  shell-navigation:
    name: Shell navigation runtime regression
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install GTK and isolated display
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1 xvfb
      - name: Exercise Shell push and pop in GTK
        env:
          MAUI_GTK_RUNTIME_TESTS: '1'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: >-
          xvfb-run -a dotnet test
          platforms/Linux.Gtk4/tests/Linux.Gtk4.Tests/Linux.Gtk4.Tests.csproj
          --filter FullyQualifiedName~ShellNavigationRuntimeTests
          --logger "console;verbosity=detailed"

  compatibility:
    name: GTK registration - MAUI ${{ matrix.maui }}
    strategy:
      fail-fast: false
      matrix:
        maui: ['10.0.41', '10.0.60', '10.0.70', '10.0.110', '11.0.0-rc.2.26505.5']
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
    with:
      project-path: platforms/Linux.Gtk4/tests/Linux.Gtk4.Tests/Linux.Gtk4.Tests.csproj
      project-name: gtk-registration-${{ matrix.maui }}
      os: '["windows-latest"]'
      install-workloads: false
      test-only: true
      test-arguments-json: >-
        ["-p:MauiVersion=${{ matrix.maui }}",
         "--filter", "FullyQualifiedName~AlertManagerSubscriptionTests"]

  essentials-runtime:
    name: Essentials native GTK regression
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install GTK runtime and virtual display
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-4-1 xvfb
          gstreamer1.0-tools
          gstreamer1.0-plugins-base
          gstreamer1.0-plugins-good
      - name: Exercise static facades inside GTK
        env:
          ESSENTIALS_NATIVE_GTK: '1'
          GDK_BACKEND: x11
        run: >-
          xvfb-run -a dotnet test
          platforms/Linux.Gtk4/tests/Essentials.Tests/Linux.Gtk4.Essentials.Tests.csproj
          --configuration Release --logger "trx;LogFilePrefix=essentials-native"
          --results-directory artifacts/TestResults/essentials
      - name: Verify GStreamer capture codecs and containers
        run: ./eng/smoke-tests/gtk-media-capture-smoke-test.sh
      - name: Upload runtime results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: essentials-native-gtk-results
          path: |
            artifacts/TestResults/essentials/*.trx
            artifacts/TestResults/gtk-media-capture/

  build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: platforms/Linux.Gtk4/Linux.Gtk4.slnx
      project-name: linux-gtk4
      os: '["ubuntu-24.04"]'
      install-workloads: false
      native-deps: >-
        sudo apt-get update && sudo apt-get install -y
        libgtk-4-dev
        libwebkitgtk-6.0-dev
        gobject-introspection
        libgirepository1.0-dev
        gir1.2-gtk-4.0
        gir1.2-webkit-6.0
        pkg-config
      run-tests: true
      pack: true

  templates:
    name: Packed template regression checks
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Pack, generate, and build template variants
        shell: pwsh
        run: ./eng/smoke-tests/gtk-template-smoke-test.ps1 -BuildApps

  resource-acceptance:
    name: Package-only GTK resource acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify referenced-library assets, mutation, publish, and collisions
        shell: pwsh
        run: ./eng/smoke-tests/community-resource-acceptance.ps1 -Backend gtk

  media-primitives:
    name: Headless Linux media contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # GLib errors and V4L2 rejection do not require GTK, a display, or a camera.
      - name: Verify native cancellation errors and V4L2 probing
        shell: pwsh
        env:
          ESSENTIALS_NATIVE_GTK: '1'
        run: |
          dotnet test platforms/Linux.Gtk4/tests/Essentials.Tests/Linux.Gtk4.Essentials.Tests.csproj `
            --configuration Release --framework net11.0 `
            --filter FullyQualifiedName~Essentials.Tests.MediaPickerTests. `
            --logger 'trx;LogFileName=media-primitives.trx' `
            --results-directory artifacts/TestResults/media-primitives
          if ($LASTEXITCODE -ne 0) { throw 'Linux media contracts failed.' }
          [xml] $trx = Get-Content artifacts/TestResults/media-primitives/media-primitives.trx -Raw
          $counts = $trx.TestRun.ResultSummary.Counters
          if ([int] $counts.total -le 0 -or [int] $counts.executed -ne [int] $counts.total -or
              [int] $counts.passed -ne [int] $counts.total -or [int] $counts.notExecuted -ne 0) {
            throw "Linux media contracts must all execute and pass: $($counts.OuterXml)"
          }
      - name: Upload headless Linux results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gtk-media-primitives
          path: artifacts/TestResults/media-primitives/
          if-no-files-found: error

  runtime:
    name: Native GTK runtime (${{ matrix.test-class }}${{ matrix.maui && format(', MAUI {0}', matrix.maui) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each class gets its own process: GTK initialization is thread-affine.
        test-class: [CollectionViewHandlerTests, GtkBlazorWebViewLifetimeTests, PickerSelectionTests, GtkSignalLifetimeTests, GtkSynchronizationContextTests, ContentViewTransformTests, ContentViewClippingTests, ContentViewRootLayoutTests, GtkRootLayoutDriverTests, WindowSizingTests, GtkTransformTests, StartupLayoutTests, ResourceImageRuntimeTests]
        maui: ['']
        include:
          - test-class: GtkSignalLifetimeTests
            maui: '10.0.70'
          - test-class: GtkWebViewSnapshotRuntimeTests
            maui: ''
            test-project: src/DevFlow/Microsoft.Maui.DevFlow.Agent.Gtk.Tests/Microsoft.Maui.DevFlow.Agent.Gtk.Tests.csproj
            test-namespace: Microsoft.Maui.DevFlow.Agent.Gtk.Tests
          - test-class: WindowSizingTests
            maui: '10.0.70'
          - test-class: WindowSizingTests
            maui: '10.0.110'
          - test-class: StartupLayoutTests
            maui: '10.0.70'
          - test-class: ModernizationRegistrationTests
            maui: '11.0.0-rc.2.26505.5'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install GTK and isolated display
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4 xvfb dbus-x11
      - name: Run native regression tests
        shell: pwsh
        env:
          RUN_GTK_RUNTIME_TESTS: '1'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
          GTK_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/TestResults/gtk-runtime/paint
        run: >-
          ./platforms/Linux.Gtk4/tests/run-native-tests.ps1
          -TestClass '${{ matrix.test-class }}'
          -TestProject '${{ matrix.test-project || 'platforms/Linux.Gtk4/tests/Linux.Gtk4.Tests/Linux.Gtk4.Tests.csproj' }}'
          -TestNamespace '${{ matrix.test-namespace || 'Microsoft.Maui.Platforms.Linux.Gtk4.Tests' }}'
          ${{ matrix.maui && format('-MauiVersion {0}', matrix.maui) || '' }}
      - name: Build DevFlow sample
        if: matrix.test-class == 'CollectionViewHandlerTests'
        run: >-
          dotnet build platforms/Linux.Gtk4/samples/Linux.Gtk4.Sample/Linux.Gtk4.Sample.csproj
          --configuration Debug -p:EnableMauiDevFlow=true -m:1 -nr:false
      - name: Verify running sample through DevFlow
        if: matrix.test-class == 'CollectionViewHandlerTests'
        run: >-
          dbus-run-session -- xvfb-run -a python3
          platforms/Linux.Gtk4/tests/devflow_collectionview_smoke.py
          --sample artifacts/bin/Linux.Gtk4.Sample/Debug/net11.0/Linux.Gtk4.Sample.dll
          --output artifacts/TestResults/gtk-devflow
      - name: Upload native runtime test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gtk-runtime-${{ matrix.test-class }}${{ matrix.maui && format('-maui-{0}', matrix.maui) || '' }}
          path: artifacts/TestResults/gtk-runtime/
          if-no-files-found: error
      - name: Upload DevFlow runtime evidence
        if: always() && matrix.test-class == 'CollectionViewHandlerTests'
        uses: actions/upload-artifact@v7
        with:
          name: gtk-collectionview-devflow-evidence
          path: artifacts/TestResults/gtk-devflow/
          if-no-files-found: error
