name: CI - Linux GTK4

on:
  workflow_dispatch:
    inputs:
      evidence-probe:
        description: 'One-shot pinned evidence; requires coordinator authorization'
        required: true
        type: choice
        options:
          - clipping-baseline
          - window-compatibility
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-linux-gtk4.yml'
      - 'platforms/Linux.Gtk4/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - '.github/workflows/ci-linux-gtk4.yml'
      - 'platforms/Linux.Gtk4/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  runtime:
    if: github.event_name != 'workflow_dispatch'
    name: Native GTK runtime (${{ matrix.test-class }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test-class: [ContentViewTransformTests, ContentViewClippingTests, ContentViewRootLayoutTests, GtkRootLayoutDriverTests]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1 xvfb dbus
      - name: Run native GTK regression
        env:
          RUN_GTK_RUNTIME_TESTS: '1'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/TestResults/gtk-runtime/paint
        run: >-
          dbus-run-session -- xvfb-run --auto-servernum
          dotnet test platforms/Linux.Gtk4/tests/Linux.Gtk4.Tests/Linux.Gtk4.Tests.csproj
          --configuration Release
          --filter FullyQualifiedName~${{ matrix.test-class }}
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=${{ matrix.test-class }}.trx"
          --results-directory artifacts/TestResults/gtk-runtime
          --blame-hang-timeout 3m
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gtk-runtime-${{ matrix.test-class }}
          path: artifacts/TestResults/gtk-runtime

  build:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/_build.yml
    with:
      project-path: platforms/Linux.Gtk4/Linux.Gtk4.slnx
      project-name: linux-gtk4
      os: '["ubuntu-24.04"]'
      install-workloads: false
      native-deps: >-
        sudo apt-get update && sudo apt-get install -y
        libgtk-4-dev
        libwebkitgtk-6.0-dev
        gobject-introspection
        libgirepository1.0-dev
        gir1.2-gtk-4.0
        gir1.2-webkit-6.0
        pkg-config
      run-tests: true
      pack: true

  templates:
    if: github.event_name != 'workflow_dispatch'
    name: Packed template regression checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Pack, generate, and build template variants
        shell: pwsh
        run: ./eng/smoke-tests/gtk-template-smoke-test.ps1 -BuildApps

  evidence:
    name: Pinned hosted evidence (${{ inputs.evidence-probe }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          sparse-checkout: .github/scripts
      - uses: actions/checkout@v6
        with:
          path: source
          ref: ${{ inputs.evidence-probe == 'clipping-baseline' && '4e9a5e7cecd3ad976b757551d4d323b4917dd08b' || 'ba043896fd4d2ae123020dc43f241031b9a47699' }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: source/global.json
      - name: Install native evidence dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1 xvfb dbus
      - name: Run the authorized pinned probe
        working-directory: source
        env:
          PROBE: ${{ inputs.evidence-probe }}
        run: python3 ../harness/.github/scripts/gtk-layout-evidence.py "$PROBE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pinned-${{ inputs.evidence-probe }}-evidence
          path: source/artifacts/TestResults/${{ inputs.evidence-probe }}
          if-no-files-found: error
