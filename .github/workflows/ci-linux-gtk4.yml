name: CI - Linux GTK4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-linux-gtk4.yml'
      - 'platforms/Linux.Gtk4/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - '.github/workflows/ci-linux-gtk4.yml'
      - 'platforms/Linux.Gtk4/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  runtime:
    name: Native GTK runtime (${{ matrix.test-class }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        test-class: [WindowSizingTests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1 xvfb dbus
      - name: Run native GTK regression
        env:
          RUN_GTK_RUNTIME_TESTS: '1'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: >-
          dbus-run-session -- xvfb-run --auto-servernum
          dotnet test platforms/Linux.Gtk4/tests/Linux.Gtk4.Tests/Linux.Gtk4.Tests.csproj
          --configuration Release -m:1 -nr:false
          --filter FullyQualifiedName~${{ matrix.test-class }}
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=${{ matrix.test-class }}.trx"
          --results-directory artifacts/TestResults/gtk-runtime
          --blame-hang-timeout 3m
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gtk-runtime-${{ matrix.test-class }}
          path: artifacts/TestResults/gtk-runtime

  build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: platforms/Linux.Gtk4/Linux.Gtk4.slnx
      project-name: linux-gtk4
      os: '["ubuntu-24.04"]'
      install-workloads: false
      native-deps: >-
        sudo apt-get update && sudo apt-get install -y
        libgtk-4-dev
        libwebkitgtk-6.0-dev
        gobject-introspection
        libgirepository1.0-dev
        gir1.2-gtk-4.0
        gir1.2-webkit-6.0
        pkg-config
      run-tests: true
      pack: true

  templates:
    name: Packed template regression checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Pack, generate, and build template variants
        shell: pwsh
        run: ./eng/smoke-tests/gtk-template-smoke-test.ps1 -BuildApps
