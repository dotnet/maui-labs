name: DevFlow Integration Tests

# Status: experimental.
# The DevFlow integration suite builds the sample app, boots a simulator/emulator,
# installs and launches it, then runs real HTTP round-trips against the agent.
# A full platform run takes ~20-30 min. To save CI minutes we keep this off the
# default PR pipeline — it runs on demand via workflow_dispatch or when a PR is
# labeled `integration-tests`. Additional PR updates can be re-run manually.
#
# Entry points per platform fixture:
#   Android   -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/AndroidEmulatorFixture.cs
#   iOS       -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/iOSSimulatorFixture.cs
#   Mac Catalyst -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/MacCatalystFixture.cs
#   macOS     -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/MacOSFixture.cs
#   GTK       -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/GtkFixture.cs
#   Windows   -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/WindowsFixture.cs
#   WPF       -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/WpfFixture.cs

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to run
        default: all
        type: choice
        options:
          - all
          - android
          - ios
          - maccatalyst
          - macos
          - gtk
          - windows
          - wpf
      framework:
        description: App framework to drive (native runs the plain .NET samples)
        default: maui
        type: choice
        options:
          - maui
          - native
          - both
      android-api:
        description: Android API level
        default: "35"
        type: string
      ios-runtime:
        description: iOS runtime version filter (e.g. 17.5). Leave blank for newest available.
        default: ""
        type: string
  pull_request:
    types: [labeled]
    branches: [main]
    paths:
      - 'src/DevFlow/**'
      - 'samples/DevFlow.Sample/**'
      - 'samples/DevFlow.Sample.Linux/**'
      - 'samples/DevFlow.Sample.MacOS/**'
      - 'samples/DevFlow.Sample.Native/**'
      - 'samples/DevFlow.Sample.WPF/**'
      - 'platforms/Linux.Gtk4/**'
      - 'platforms/MacOS/**'
      - 'platforms/Windows.WPF/**'
      - '.github/workflows/devflow-integration.yml'

concurrency:
  group: devflow-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_WORKLOAD_VERSION: 10.0.203
  TEST_PROJECT: src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Microsoft.Maui.DevFlow.Agent.IntegrationTests.csproj

jobs:
  # Decide which platforms to run based on the trigger.
  # For pull_request runs we require the `integration-tests` label.
  plan:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'integration-tests')
    runs-on: ubuntu-latest
    outputs:
      run-android: ${{ steps.decide.outputs.android }}
      run-ios: ${{ steps.decide.outputs.ios }}
      run-maccatalyst: ${{ steps.decide.outputs.maccatalyst }}
      run-macos: ${{ steps.decide.outputs.macos }}
      run-gtk: ${{ steps.decide.outputs.gtk }}
      run-windows: ${{ steps.decide.outputs.windows }}
      run-wpf: ${{ steps.decide.outputs.wpf }}
      # JSON array consumed as a matrix axis by the platform jobs. Windows, WPF, and GTK have no
      # plain .NET heads, so those jobs run only when the matrix includes maui.
      frameworks: ${{ steps.decide.outputs.frameworks }}
    steps:
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PLATFORMS: ${{ inputs.platforms }}
          FRAMEWORK: ${{ inputs.framework }}
          LABELED: ${{ github.event_name == 'pull_request' && github.event.label.name == 'integration-tests' || 'false' }}
        run: |
          set -e
          should_run() {
            local p=$1
            if [[ "$EVENT" == "workflow_dispatch" ]]; then
              [[ "$PLATFORMS" == "all" || "$PLATFORMS" == "$p" ]] && echo true || echo false
            elif [[ "$EVENT" == "pull_request" ]]; then
              [[ "$LABELED" == "true" ]] && echo true || echo false
            else
              echo false
            fi
          }
          # `framework` is a workflow_dispatch-only input, so it is empty for label-triggered PR
          # runs. Those default to `both`: the label is an explicit opt-in to the expensive suite,
          # and the native axis is the newer, less-proven one — defaulting it to `maui` there meant
          # the plain .NET heads were never exercised automatically at all.
          DEFAULT_FRAMEWORK=maui
          [[ "$EVENT" == "pull_request" ]] && DEFAULT_FRAMEWORK=both
          {
            echo "android=$(should_run android)"
            echo "ios=$(should_run ios)"
            echo "maccatalyst=$(should_run maccatalyst)"
            echo "macos=$(should_run macos)"
            echo "gtk=$(should_run gtk)"
            echo "windows=$(should_run windows)"
            echo "wpf=$(should_run wpf)"
            case "${FRAMEWORK:-$DEFAULT_FRAMEWORK}" in
              native) echo 'frameworks=["native"]' ;;
              both)   echo 'frameworks=["maui","native"]' ;;
              *)      echo 'frameworks=["maui"]' ;;
            esac
          } >> "$GITHUB_OUTPUT"

  android:
    needs: plan
    if: needs.plan.outputs.run-android == 'true'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.plan.outputs.frameworks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEVFLOW_TEST_PLATFORM: android
      DEVFLOW_TEST_FRAMEWORK: ${{ matrix.framework }}
      # Shell navigation, AppTheme, Essentials storage/sensors and WebView CDP are MAUI-only.
      TEST_FILTER: ${{ matrix.framework == 'native' && '--filter framework!=maui' || '' }}
      DEVFLOW_TEST_ANDROID_API: ${{ inputs.android-api || '35' }}
      DEVFLOW_TEST_ANDROID_AVD: devflow-tests-api${{ inputs.android-api || '35' }}
    steps:
      - uses: actions/checkout@v6

      # Android emulator needs KVM on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui-android android wasm-tools --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.DEVFLOW_TEST_ANDROID_API }}-x86_64

      - name: Warm up AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: ${{ env.DEVFLOW_TEST_ANDROID_AVD }}
          api-level: ${{ env.DEVFLOW_TEST_ANDROID_API }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot."

      - name: Run DevFlow integration tests (android)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: ${{ env.DEVFLOW_TEST_ANDROID_AVD }}
          api-level: ${{ env.DEVFLOW_TEST_ANDROID_API }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >
            export DEVFLOW_TEST_ANDROID_SERIAL="$(adb devices | awk '/^emulator-[0-9]+[[:space:]]+device$/ { print $1; exit }')";
            echo "Using Android emulator serial: ${DEVFLOW_TEST_ANDROID_SERIAL:-<none found>}";
            dotnet test $TEST_PROJECT -c Debug
            --logger "trx;LogFileName=devflow-integration-android-${{ matrix.framework }}.trx"
            --logger "console;verbosity=normal"
            --results-directory ./artifacts/TestResults/devflow-integration/android
            $TEST_FILTER

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-integration-android-${{ matrix.framework }}-results
          path: ./artifacts/TestResults/devflow-integration/android/
          retention-days: 30

  ios:
    needs: plan
    if: needs.plan.outputs.run-ios == 'true'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.plan.outputs.frameworks) }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVFLOW_TEST_PLATFORM: ios
      DEVFLOW_TEST_FRAMEWORK: ${{ matrix.framework }}
      # Shell navigation, AppTheme, Essentials storage/sensors and WebView CDP are MAUI-only.
      TEST_FILTER: ${{ matrix.framework == 'native' && '--filter framework!=maui' || '' }}
      DEVFLOW_TEST_IOS_VERSION: ${{ inputs.ios-runtime }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          # Keep Xcode aligned with DOTNET_WORKLOAD_VERSION; newer Apple workloads can require newer Xcode.
          COMPATIBLE="${COMPATIBLE:-}"
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.3.0.app; do
            if [[ -d "$candidate" ]]; then
              COMPATIBLE="$candidate"
              break
            fi
          done
          SELECTED="${COMPATIBLE:-$(ls -1d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)}"
          if [[ -n "$SELECTED" ]]; then
            echo "Using $SELECTED"
            sudo xcode-select -s "$SELECTED/Contents/Developer"
            ACTOOL_PATH="$(xcrun --find actool)"
            DEVELOPER_ROOT="$(cd "$(dirname "$ACTOOL_PATH")/../.." && pwd)"
            XCODE_APP="$(cd "$DEVELOPER_ROOT/../.." && pwd)"
            echo "Resolved developer dir: $DEVELOPER_ROOT"
            echo "Resolved Xcode app: $XCODE_APP"
            export DEVELOPER_DIR="$DEVELOPER_ROOT"
            export MD_APPLE_SDK_ROOT="$XCODE_APP"
            echo "DEVELOPER_DIR=$DEVELOPER_ROOT" >> "$GITHUB_ENV"
            echo "MD_APPLE_SDK_ROOT=$XCODE_APP" >> "$GITHUB_ENV"
          fi
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --find actool

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Apple MAUI workloads
        # Keep this list to workloads the repo actually targets. DOTNET_WORKLOAD_VERSION is pinned,
        # so requesting a workload nothing builds still hard-fails the job the day its runtime packs
        # rotate out of the feeds -- which is exactly how tvos broke the Windows job.
        run: dotnet workload install maui ios macos maccatalyst android wasm-tools --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: List available iOS simulators
        run: xcrun simctl list devices available

      - name: Run DevFlow integration tests (ios)
        run: >
          dotnet test $TEST_PROJECT
          -c Debug
          --logger "trx;LogFileName=devflow-integration-ios-${{ matrix.framework }}.trx"
          --logger "console;verbosity=normal"
          --results-directory ./artifacts/TestResults/devflow-integration/ios
          $TEST_FILTER

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-integration-ios-${{ matrix.framework }}-results
          path: ./artifacts/TestResults/devflow-integration/ios/
          retention-days: 30

  maccatalyst:
    needs: plan
    if: needs.plan.outputs.run-maccatalyst == 'true'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.plan.outputs.frameworks) }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVFLOW_TEST_PLATFORM: maccatalyst
      DEVFLOW_TEST_FRAMEWORK: ${{ matrix.framework }}
      # Shell navigation, AppTheme, Essentials storage/sensors and WebView CDP are MAUI-only.
      TEST_FILTER: ${{ matrix.framework == 'native' && '--filter framework!=maui' || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          # Keep Xcode aligned with DOTNET_WORKLOAD_VERSION; newer Apple workloads can require newer Xcode.
          COMPATIBLE="${COMPATIBLE:-}"
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.3.0.app; do
            if [[ -d "$candidate" ]]; then
              COMPATIBLE="$candidate"
              break
            fi
          done
          SELECTED="${COMPATIBLE:-$(ls -1d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)}"
          if [[ -n "$SELECTED" ]]; then
            echo "Using $SELECTED"
            sudo xcode-select -s "$SELECTED/Contents/Developer"
            ACTOOL_PATH="$(xcrun --find actool)"
            DEVELOPER_ROOT="$(cd "$(dirname "$ACTOOL_PATH")/../.." && pwd)"
            XCODE_APP="$(cd "$DEVELOPER_ROOT/../.." && pwd)"
            echo "Resolved developer dir: $DEVELOPER_ROOT"
            echo "Resolved Xcode app: $XCODE_APP"
            export DEVELOPER_DIR="$DEVELOPER_ROOT"
            export MD_APPLE_SDK_ROOT="$XCODE_APP"
            echo "DEVELOPER_DIR=$DEVELOPER_ROOT" >> "$GITHUB_ENV"
            echo "MD_APPLE_SDK_ROOT=$XCODE_APP" >> "$GITHUB_ENV"
          fi
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --find actool

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Apple MAUI workloads
        # Keep this list to workloads the repo actually targets. DOTNET_WORKLOAD_VERSION is pinned,
        # so requesting a workload nothing builds still hard-fails the job the day its runtime packs
        # rotate out of the feeds -- which is exactly how tvos broke the Windows job.
        run: dotnet workload install maui ios macos maccatalyst android wasm-tools --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: Run DevFlow integration tests (maccatalyst)
        run: >
          dotnet test $TEST_PROJECT
          -c Debug
          --logger "trx;LogFileName=devflow-integration-maccatalyst-${{ matrix.framework }}.trx"
          --logger "console;verbosity=normal"
          --results-directory ./artifacts/TestResults/devflow-integration/maccatalyst
          $TEST_FILTER

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-integration-maccatalyst-${{ matrix.framework }}-results
          path: ./artifacts/TestResults/devflow-integration/maccatalyst/
          retention-days: 30

  macos:
    needs: plan
    if: needs.plan.outputs.run-macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.plan.outputs.frameworks) }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVFLOW_TEST_PLATFORM: macos
      DEVFLOW_TEST_FRAMEWORK: ${{ matrix.framework }}
      # The custom AppKit backend does not yet provide Blazor CDP, generic gestures/list scrolling,
      # or every Essentials API. Keep those known platform gaps explicit while still running the
      # full UI tree/action/property suite, including the registered native-element bridge.
      TEST_FILTER: >-
        ${{ matrix.framework == 'native'
          && 'framework!=maui'
          || 'Category!=WebView&FullyQualifiedName!~UiActionTests.Gesture_ReturnsExpectedResponse&FullyQualifiedName!~UiActionTests.Scroll_Element_Succeeds&FullyQualifiedName!~SensorTests.List_ReturnsSensors&FullyQualifiedName!~SecureStorageTests.Clear_RemovesAll&FullyQualifiedName!~DeviceTests.Display_ReturnsMetrics&FullyQualifiedName!~DeviceTests.AppInfo_NameMatchesSample&FullyQualifiedName!~DeviceTests.AppInfo_ReturnsValidInfo' }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          # Keep Xcode aligned with DOTNET_WORKLOAD_VERSION; newer Apple workloads can require newer Xcode.
          COMPATIBLE="${COMPATIBLE:-}"
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.3.0.app; do
            if [[ -d "$candidate" ]]; then
              COMPATIBLE="$candidate"
              break
            fi
          done
          SELECTED="${COMPATIBLE:-$(ls -1d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)}"
          if [[ -n "$SELECTED" ]]; then
            echo "Using $SELECTED"
            sudo xcode-select -s "$SELECTED/Contents/Developer"
            ACTOOL_PATH="$(xcrun --find actool)"
            DEVELOPER_ROOT="$(cd "$(dirname "$ACTOOL_PATH")/../.." && pwd)"
            XCODE_APP="$(cd "$DEVELOPER_ROOT/../.." && pwd)"
            export DEVELOPER_DIR="$DEVELOPER_ROOT"
            export MD_APPLE_SDK_ROOT="$XCODE_APP"
            echo "DEVELOPER_DIR=$DEVELOPER_ROOT" >> "$GITHUB_ENV"
            echo "MD_APPLE_SDK_ROOT=$XCODE_APP" >> "$GITHUB_ENV"
          fi
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Apple MAUI workloads
        # Keep this list to workloads the repo actually targets. DOTNET_WORKLOAD_VERSION is pinned,
        # so requesting a workload nothing builds still hard-fails the job the day its runtime packs
        # rotate out of the feeds -- which is exactly how tvos broke the Windows job.
        run: dotnet workload install maui ios macos maccatalyst android wasm-tools --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: Run DevFlow integration tests (macos)
        run: >
          dotnet test $TEST_PROJECT
          -c Debug
          --logger "trx;LogFileName=devflow-integration-macos-${{ matrix.framework }}.trx"
          --logger "console;verbosity=normal"
          --results-directory ./artifacts/TestResults/devflow-integration/macos
          --filter "$TEST_FILTER"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-integration-macos-${{ matrix.framework }}-results
          path: ./artifacts/TestResults/devflow-integration/macos/
          retention-days: 30

  gtk:
    needs: plan
    if: needs.plan.outputs.run-gtk == 'true' && contains(needs.plan.outputs.frameworks, 'maui')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEVFLOW_TEST_PLATFORM: gtk
      DEVFLOW_TEST_FRAMEWORK: maui
      GDK_BACKEND: x11
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install GTK integration dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libgtk-4-dev
          libwebkitgtk-6.0-dev
          gobject-introspection
          libgirepository1.0-dev
          gir1.2-gtk-4.0
          gir1.2-webkit-6.0
          pkg-config
          xvfb
          xauth
          dbus-x11

      - name: Run DevFlow integration tests (GTK)
        run: >
          dbus-run-session --
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          dotnet test $TEST_PROJECT
          -c Debug
          --filter "Category!=Device&Category!=Sensors&Category!=SecureStorage"
          --logger "trx;LogFileName=devflow-integration-gtk-maui.trx"
          --logger "console;verbosity=normal"
          --results-directory ./artifacts/TestResults/devflow-integration/gtk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-integration-gtk-maui-results
          path: ./artifacts/TestResults/devflow-integration/gtk/
          retention-days: 30

  windows:
    needs: plan
    # No plain .NET Windows head exists, so this job only has anything to say about MAUI.
    if: needs.plan.outputs.run-windows == 'true' && contains(needs.plan.outputs.frameworks, 'maui')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DEVFLOW_TEST_PLATFORM: windows
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        # Keep this list to workloads the repo actually targets. DOTNET_WORKLOAD_VERSION is pinned,
        # so requesting a workload nothing builds still hard-fails the job the day its runtime packs
        # rotate out of the feeds -- which is exactly how tvos broke the Windows job.
        run: dotnet workload install maui ios macos maccatalyst android wasm-tools --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: Run DevFlow integration tests (windows)
        shell: pwsh
        run: >
          dotnet test $env:TEST_PROJECT
          -c Debug
          --logger "trx;LogFileName=devflow-integration-windows.trx"
          --logger "console;verbosity=normal"
          --results-directory .\artifacts\TestResults\devflow-integration\windows

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devflow-integration-windows-results
          path: .\artifacts\TestResults\devflow-integration\windows\
          retention-days: 30

  wpf:
    needs: plan
    if: needs.plan.outputs.run-wpf == 'true' && contains(needs.plan.outputs.frameworks, 'maui')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DEVFLOW_TEST_PLATFORM: wpf
      DEVFLOW_TEST_FRAMEWORK: maui
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: Run DevFlow integration tests (WPF)
        shell: pwsh
        run: >
          dotnet test $env:TEST_PROJECT
          -c Debug
          --filter "Category!=WebView&Category!=Device&Category!=Sensors&Category!=SecureStorage"
          --logger "trx;LogFileName=devflow-integration-wpf-maui.trx"
          --logger "console;verbosity=normal"
          --results-directory .\artifacts\TestResults\devflow-integration\wpf

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-integration-wpf-maui-results
          path: .\artifacts\TestResults\devflow-integration\wpf\
          retention-days: 30
