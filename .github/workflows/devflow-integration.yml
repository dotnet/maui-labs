          path: |
            .\artifacts\TestResults\devflow-flow\windows\
            .\artifacts\devflow\${{ github.run_id }}-${{ github.run_attempt }}\windows\
          if-no-files-found: warn
          retention-days: 30

  # The single stable check name intended for branch protection. It is a separate job so the
  # required-check entry never has to change when a lane is renamed or another lane is promoted,
  # and so the two ways a lane can silently "pass" are both closed:
  #   * plan itself failing or being cancelled, and
  #   * the pilot being skipped while the plan said it should run.
  # GitHub reports a skipped job as a passing required check, so the gate must never be skipped:
  # it runs with `if: always()` and decides the verdict from the upstream results instead.
  devflow-flow-gate:
    name: devflow-flow-gate
    needs: [plan, static-qualification, android-flow-pilot]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVENT: ${{ github.event_name }}
      PLAN_RESULT: ${{ needs.plan.result }}
      PATHS_CHANGED: ${{ needs.plan.outputs.devflow-paths-changed }}
      STATIC_RESULT: ${{ needs.static-qualification.result }}
      PILOT_EXPECTED: ${{ needs.plan.outputs.run-android-flow-pilot }}
      PILOT_RESULT: ${{ needs.android-flow-pilot.result }}
    steps:
      - name: Evaluate the promoted DevFlow flow lane
        shell: bash
        run: |
          set -uo pipefail
          {
            printf '## DevFlow flow gate\n\n'
            printf '| Fact | Value |\n| --- | --- |\n'
            printf '| plan | %s |\n' "$PLAN_RESULT"
            printf '| DevFlow paths changed | %s |\n' "${PATHS_CHANGED:-n/a}"
            printf '| static-qualification | %s |\n' "$STATIC_RESULT"
            printf '| android-flow-pilot selected | %s |\n' "${PILOT_EXPECTED:-unknown}"
            printf '| android-flow-pilot | %s |\n' "$PILOT_RESULT"
            printf '\n'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::The lane plan concluded '$PLAN_RESULT', so the gate cannot confirm the promoted flow lane ran."
            exit 1
          fi
          # A skipped job reports as a passing check, so the gate grades static qualification
          # rather than trusting its own conclusion to be visible.
          if [[ "$STATIC_RESULT" == "failure" || "$STATIC_RESULT" == "cancelled" ]]; then
            echo "::error::Static qualification concluded '$STATIC_RESULT'."
            exit 1
          fi
          if [[ "$PILOT_EXPECTED" != "true" ]]; then
            # Defence in depth for the "last conclusion wins" hazard: if the diff touched DevFlow
            # but the lane was not selected, this run has nothing to grade and must not publish a
            # green conclusion that could overwrite a real red on the same commit.
            if [[ "$EVENT" == "pull_request" && "${PATHS_CHANGED:-false}" == "true" ]]; then
              echo "::error::DevFlow paths changed but the promoted flow lane was not selected for this run, so the gate cannot confirm it. Re-run the workflow."
              exit 1
            fi
            if [[ "$EVENT" == "pull_request" ]]; then
              echo "No DevFlow paths changed. Nothing to gate."
            else
              echo "The promoted flow lane was not requested for this $EVENT run. Nothing to gate."
            fi
            exit 0
          fi
          if [[ "$STATIC_RESULT" != "success" ]]; then
            echo "::error::DevFlow paths changed but static qualification concluded '$STATIC_RESULT'."
            exit 1
          fi
          if [[ "$PILOT_RESULT" != "success" ]]; then
            echo "::error::The Android flow pilot concluded '$PILOT_RESULT'. A promoted flow lane that does not pass is not a green gate."
            exit 1
          fi
          echo "Static qualification and the Android flow pilot passed."
