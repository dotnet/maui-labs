name: DevFlow Integration Tests

# Status: experimental.
# The DevFlow integration suite builds the sample app, boots a simulator/emulator,
# installs and launches it, then runs real HTTP round-trips against the agent.
# A full platform run takes ~20-30 min. To save CI minutes we keep this off the
# default PR pipeline — ordinary integration runs on demand via workflow_dispatch or
# the `integration-tests` label. Every label-gated lane is additionally required to touch a
# DevFlow path, so a label on an unrelated PR cannot start a paid lane.
#
# Exactly one flow lane is promoted to an unlabeled PR lane: `android-flow-pilot`. It runs on
# every pull_request event whose diff touches a DevFlow path (the list now lives in the `plan`
# job), and `devflow-flow-gate` aggregates its result into a single stable check name that
# is safe to require in branch protection. It is deliberately not narrowed to head-changing
# actions: the gate reports a conclusion on every run and the last conclusion for a check name
# wins, so a run that skipped the lane would overwrite a real red with green on the same commit.
# Android is the only promoted lane on purpose: it is the
# sole flow lane that runs on `ubuntu-latest` (1x billing) instead of macOS (10x) or Windows (2x),
# and it is the only lane that installs and launches a real app on a real device surface without
# paid runner minutes. The remaining lanes (ios, maccatalyst, macos-appkit, windows) stay label-
# or schedule-gated.
#
# Adding `devflow-flow-gate` to the repository's required status checks is a repository-settings
# change that must be made by a human with admin rights; no workflow file can do it.
#
# Entry points per platform fixture:
#   Android   -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/AndroidEmulatorFixture.cs
#   iOS       -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/iOSSimulatorFixture.cs
#   Mac Catalyst -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/MacCatalystFixture.cs
#   AppKit (experimental only) -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/MacOSFixture.cs
#   Windows   -> src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Fixtures/WindowsFixture.cs

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to run
        default: all
        type: choice
        options:
          - all
          - android
          - ios
          - maccatalyst
          - windows
          - windows-flow-qa
          - flow-pilot
          - apple-flow-qa
          - macos-appkit-flow-qa
      apple-flow-qa:
        description: Run advisory iOS Simulator and Mac Catalyst XCTest flow QA after the capability spike
        default: false
        type: boolean
      appkit-flow-qa:
        description: Run the separately labeled experimental AppKit flow-QA lane (never an official Mac Catalyst gate)
        default: false
        type: boolean
      android-api:
        description: Android API level
        default: "35"
        type: string
      demo-ci-fix:
        description: >-
          WARNING - demo only. Runs the dedicated android-demo-ci-fix job, which replays a
          committed flow that is INTENDED TO FAIL and then ends the run with a deliberate
          failure so the whole workflow is red. It exists solely to drive the manager-facing
          CI-to-local-fix demo. It is not a product test, it is not part of the required
          devflow-flow-gate, it never produces production qualification, and nothing it
          publishes grants broker or source repair authority.
        default: false
        type: boolean
      ios-runtime:
        description: iOS runtime version filter (e.g. 17.5). Leave blank for newest available.
        default: ""
        type: string
  schedule:
    # Advisory Android and Apple flow-QA canaries. GitHub schedules run from the default branch.
    - cron: '17 3 * * *'
  pull_request:
    # `edited` is required so the lane re-runs when GitHub auto-retargets a PR after a stacked
    # branch merges. A required check that never re-reports would block the retargeted PR forever.
    types: [opened, synchronize, reopened, labeled, edited]
    branches: [main]
    # There is deliberately no `paths:` filter here. A path-filtered workflow never reports its
    # checks at all, so a required `devflow-flow-gate` would sit at "Expected" forever on every
    # PR that does not touch DevFlow, and the documented workaround — a second workflow with the
    # same check name — is fail-open, because the last report for a check name wins and a dummy
    # "always green" job can overwrite a real failure. The same path list is applied inside the
    # `plan` job instead, so the gate always reports while every expensive lane stays path-gated.
    # The two jobs that run unconditionally (`plan` and `devflow-flow-gate`) are seconds of
    # ubuntu-latest time; everything costly is gated behind the path decision or a label.

concurrency:
  # The demo lane gets its own group. It is a long, deliberately red, operator-triggered run on the
  # default branch, and the ordinary main-branch group cancels in progress, so without this suffix a
  # scheduled run would cancel the demo mid-flight and the demo would never reach its evidence
  # upload. Every non-demo run keeps exactly the group it has always had: the suffix is empty.
  group: devflow-integration-${{ github.ref }}${{ (github.event_name == 'workflow_dispatch' && inputs.demo-ci-fix) && '-demo-ci-fix' || '' }}
  # This bounds the cost of re-selecting the promoted lane on every pull_request action, but it is
  # not only a cost control: a title or body edit during the Android lane cancels the in-flight run
  # on the *same* commit, and the cancelled run reports devflow-flow-gate as `cancelled`. That
  # blocks merge until the restarted run finishes, which is the fail-closed direction.
  cancel-in-progress: true

# Least privilege by default. These jobs execute pull-request-author-controlled code from
# samples/** and eng/devflow/**, so no job may hold a write scope.
permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_WORKLOAD_VERSION: 10.0.203
  TEST_PROJECT: src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Microsoft.Maui.DevFlow.Agent.IntegrationTests.csproj

jobs:
  # This is deliberately advisory: it validates deterministic static corpus/security/performance
  # evidence and publishes a not-qualified report until real Android device evidence exists.
  static-qualification:
    needs: plan
    # `always()` is required: without a status function GitHub prepends an implicit `success()`,
    # so a transient failure in the plan job's changed-file lookup would turn this job into a
    # *skipped* one — which GitHub reports as a passing check. devflow-flow-gate grades this
    # job's result, so the skip is caught either way, but a failed plan must not read as
    # "nothing to qualify".
    if: always() && needs.plan.result == 'success' && (github.event_name != 'pull_request' || needs.plan.outputs.devflow-paths-changed == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run static preview qualification gate
        run: >
          dotnet run --project src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj
          -f net10.0 --configuration Release --
          devflow flow qualify --platform android
          --corpus tests/DevFlow/InspectorCorpus
          --output artifacts/devflow/qualification/static-qualification.json
          --json

      # The flow-QA script contract, including the shell entry point, is covered here rather than
      # only on the label-gated Windows lane. Those parity tests skip silently where bash is
      # absent, so without a lane that every DevFlow pull request selects the shell entry point
      # could stop being covered anywhere without a single red check. This runner always has bash,
      # DEVFLOW_REQUIRE_SHELL_TESTS turns a skip into a failure, and devflow-flow-gate grades this
      # job. It reuses the Release build the qualification step above already produced.
      - name: Run flow-QA script contract tests
        env:
          DEVFLOW_REQUIRE_SHELL_TESTS: 1
        run: >
          dotnet test src/DevFlow/Microsoft.Maui.DevFlow.Agent.IntegrationTests/Microsoft.Maui.DevFlow.Agent.IntegrationTests.csproj
          --configuration Release
          --filter "FullyQualifiedName~FlowQaScriptTests"
          --logger "trx;LogFileName=devflow-flow-qa-scripts.trx"
          --results-directory ./artifacts/TestResults/devflow-flow-qa-scripts

      - name: Upload flow-QA script contract results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-flow-qa-scripts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./artifacts/TestResults/devflow-flow-qa-scripts/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload static qualification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-static-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./artifacts/devflow/qualification/static-qualification.json
          if-no-files-found: warn
          retention-days: 30

  # Existing integration jobs retain their explicit-label behavior. Apple XCTest flow QA remains an
  # advisory canary until its external evidence gate is accepted; the Android pilot is the promoted
  # unlabeled PR lane and is aggregated by devflow-flow-gate.
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      devflow-paths-changed: ${{ steps.paths.outputs.changed }}
      run-android: ${{ steps.decide.outputs.android }}
      run-ios: ${{ steps.decide.outputs.ios }}
      run-maccatalyst: ${{ steps.decide.outputs.maccatalyst }}
      run-windows: ${{ steps.decide.outputs.windows }}
      run-windows-flow-qa: ${{ steps.decide.outputs.windows-flow-qa }}
      run-android-flow-pilot: ${{ steps.decide.outputs.android-flow-pilot }}
      run-ios-flow-qa: ${{ steps.decide.outputs.ios-flow-qa }}
      run-maccatalyst-flow-qa: ${{ steps.decide.outputs.maccatalyst-flow-qa }}
      run-macos-appkit-flow-qa: ${{ steps.decide.outputs.macos-appkit-flow-qa }}
    steps:
      # The path filter that used to live on the `pull_request` trigger. It is applied here so the
      # workflow always starts and `devflow-flow-gate` always reports. If the API call fails the
      # step fails, which fails `plan`, which fails the gate — an unreadable file list must never
      # be read as "nothing to test".
      - id: paths
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          patterns=(
            'src/DevFlow/*'
            'src/Cli/Microsoft.Maui.Cli/DevFlow/*'
            'tests/DevFlow/*'
            'samples/DevFlow.Sample/*'
            'samples/DevFlow.Sample.MacOS/*'
            'platforms/MacOS/*'
            'docs/DevFlow/spec/schemas/*'
            'eng/devflow/*'
            'eng/smoke-tests/mobile-canvas-companion-smoke-test.mjs'
            'Directory.Build.props'
            'Directory.Build.targets'
            'Directory.Packages.props'
            'global.json'
            'NuGet.config'
            '.github/workflows/devflow-integration.yml'
          )
          # A rename reports only the new path, so a file moved *out* of a DevFlow directory would
          # otherwise look like "nothing to test". The previous path is matched too.
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          # Counted separately from "$files": that list carries an extra line per rename, so using
          # it would read a heavily-renamed diff as larger than it is and trip the cap early.
          count=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' | grep -c '' || true)
          changed=false
          # The pull-request files API stops at 3000 files. A diff that large may hide a DevFlow
          # file past the cap. An empty list is equally suspect: a real pull request always changes
          # at least one file. Guessing "nothing to test" in either case would be fail-open.
          if (( count == 0 || count >= 3000 )); then
            echo "The changed-file list was unusable ($count files); treating this as a DevFlow change."
            changed=true
          fi
          while [[ "$changed" == "false" ]] && IFS= read -r file; do
            [[ -n "$file" ]] || continue
            for pattern in "${patterns[@]}"; do
              # shellcheck disable=SC2053
              if [[ "$file" == $pattern ]]; then
                changed=true
                break 2
              fi
            done
          done <<< "$files"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "DevFlow paths changed: $changed"

      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PLATFORMS: ${{ inputs.platforms }}
          INTEGRATION_LABEL: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'integration-tests' || 'false' }}
          FLOW_PILOT_LABEL: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'flow-pilot' || 'false' }}
          WINDOWS_FLOW_QA_LABEL: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'windows-flow-qa' || 'false' }}
          APPLE_FLOW_QA_LABEL: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'apple-flow-qa' || 'false' }}
          APPLE_FLOW_QA_INPUT: ${{ inputs.apple-flow-qa || 'false' }}
          APPKIT_FLOW_QA_LABEL: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'appkit-flow-qa' || 'false' }}
          APPKIT_FLOW_QA_INPUT: ${{ inputs.appkit-flow-qa || 'false' }}
          DEMO_CI_FIX_INPUT: ${{ inputs.demo-ci-fix || 'false' }}
          # The promoted lane runs on any pull_request event that touched a DevFlow path.
          # Every pull_request decision below is ANDed with this, exactly as the trigger-level
          # `paths:` filter used to be, so a label on an unrelated PR cannot start a paid lane.
          PATH_CANARY: ${{ steps.paths.outputs.changed || 'false' }}
        run: |
          set -e
          if [[ "$EVENT" == "workflow_dispatch" && "$DEMO_CI_FIX_INPUT" == "true" ]]; then
            echo "Suppressing ordinary platform lanes for the demo-ci-fix dispatch."
            PLATFORMS=demo
            APPLE_FLOW_QA_INPUT=false
            APPKIT_FLOW_QA_INPUT=false
          fi
          should_run() {
            local p=$1
            if [[ "$EVENT" == "workflow_dispatch" ]]; then
              [[ "$PLATFORMS" == "all" || "$PLATFORMS" == "$p" ]] && echo true || echo false
            elif [[ "$EVENT" == "pull_request" ]]; then
              [[ "$PATH_CANARY" == "true" && "$INTEGRATION_LABEL" == "true" ]] && echo true || echo false
            else
              echo false
            fi
          }
          should_run_flow_pilot() {
            if [[ "$EVENT" == "workflow_dispatch" ]]; then
              [[ "$PLATFORMS" == "flow-pilot" ]] && echo true || echo false
            elif [[ "$EVENT" == "schedule" ]]; then
              echo true
            elif [[ "$EVENT" == "pull_request" ]]; then
              # Deliberately NOT narrowed to head-changing actions. devflow-flow-gate reports a
              # conclusion on every run, and the last conclusion for a check name wins, so a run
              # that skipped the lane would overwrite a real red with green on the same commit.
              # The lane must therefore be selected on every pull_request event that touched a
              # DevFlow path, including `edited` and `labeled`. cancel-in-progress bounds the cost,
              # and this is the only lane promoted this way.
              [[ "$PATH_CANARY" == "true" ]] && echo true || echo false
            else
              echo false
            fi
          }
          should_run_apple_flow_qa() {
            if [[ "$EVENT" == "workflow_dispatch" ]]; then
              [[ "$APPLE_FLOW_QA_INPUT" == "true" || "$PLATFORMS" == "apple-flow-qa" ]] && echo true || echo false
            elif [[ "$EVENT" == "schedule" ]]; then
              echo true
            elif [[ "$EVENT" == "pull_request" ]]; then
              [[ "$PATH_CANARY" == "true" && "$APPLE_FLOW_QA_LABEL" == "true" ]] && echo true || echo false
            else
              echo false
            fi
          }
          should_run_windows_flow_qa() {
            if [[ "$EVENT" == "workflow_dispatch" ]]; then
              [[ "$PLATFORMS" == "windows" || "$PLATFORMS" == "windows-flow-qa" ]] && echo true || echo false
            elif [[ "$EVENT" == "schedule" ]]; then
              echo true
            elif [[ "$EVENT" == "pull_request" ]]; then
              [[ "$PATH_CANARY" == "true" && "$WINDOWS_FLOW_QA_LABEL" == "true" ]] && echo true || echo false
            else
              echo false
            fi
          }
          should_run_appkit_flow_qa() {
            if [[ "$EVENT" == "workflow_dispatch" ]]; then
              [[ "$APPKIT_FLOW_QA_INPUT" == "true" || "$PLATFORMS" == "macos-appkit-flow-qa" ]] && echo true || echo false
            elif [[ "$EVENT" == "pull_request" ]]; then
              [[ "$PATH_CANARY" == "true" && "$APPKIT_FLOW_QA_LABEL" == "true" ]] && echo true || echo false
            else
              # AppKit remains an explicitly requested experimental lane, including on nightly.
              echo false
            fi
          }
          {
            echo "android=$(should_run android)"
            echo "ios=$(should_run ios)"
            echo "maccatalyst=$(should_run maccatalyst)"
            echo "windows=$(should_run windows)"
            echo "windows-flow-qa=$(should_run_windows_flow_qa)"
            echo "android-flow-pilot=$(should_run_flow_pilot)"
            echo "ios-flow-qa=$(should_run_apple_flow_qa)"
            echo "maccatalyst-flow-qa=$(should_run_apple_flow_qa)"
            echo "macos-appkit-flow-qa=$(should_run_appkit_flow_qa)"
          } >> "$GITHUB_OUTPUT"

  android:
    needs: plan
    if: needs.plan.outputs.run-android == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEVFLOW_TEST_PLATFORM: android
      DEVFLOW_TEST_ANDROID_API: ${{ inputs.android-api || '35' }}
      DEVFLOW_TEST_ANDROID_AVD: devflow-tests-api${{ inputs.android-api || '35' }}
    steps:
      - uses: actions/checkout@v6

      # Android emulator needs KVM on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui-android android wasm-tools --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.DEVFLOW_TEST_ANDROID_API }}-x86_64

      - name: Warm up AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          avd-name: ${{ env.DEVFLOW_TEST_ANDROID_AVD }}
          api-level: ${{ env.DEVFLOW_TEST_ANDROID_API }}
          arch: x86_64
          target: google_apis
          # This step only runs when the cache missed, which is exactly when the AVD does not
          # exist yet, so it has to be allowed to create one. Refusing creation here made the
          # step impossible to satisfy: it booted an AVD that was never created and timed out.
          # A repository with a warm cache never noticed, because the step was skipped.
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot."

      - name: Run DevFlow integration tests (android)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          avd-name: ${{ env.DEVFLOW_TEST_ANDROID_AVD }}
          api-level: ${{ env.DEVFLOW_TEST_ANDROID_API }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >
            export DEVFLOW_TEST_ANDROID_SERIAL="$(adb devices | awk '/^emulator-[0-9]+[[:space:]]+device$/ { print $1; exit }')";
            echo "Using Android emulator serial: ${DEVFLOW_TEST_ANDROID_SERIAL:-<none found>}";
            dotnet test $TEST_PROJECT -c Debug
            --logger "trx;LogFileName=devflow-integration-android.trx"
            --logger "console;verbosity=normal"
            --results-directory ./artifacts/TestResults/devflow-integration/android

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-integration-android-results
          path: ./artifacts/TestResults/devflow-integration/android/
          retention-days: 30

  # Promoted PR lane. It runs unlabeled on every pull_request event whose diff touches a
  # DevFlow path, and it has no continue-on-error: Run-DevFlowFlowQa.sh exits 4 on a flow
  # failure, so a real replay failure fails this job. devflow-flow-gate turns that into the single
  # stable check name a human can add to branch protection.
  android-flow-pilot:
    needs: plan
    if: needs.plan.outputs.run-android-flow-pilot == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      mobile-canvas-smoke-outcome: ${{ steps.mobile-canvas-smoke.outcome }}
    env:
      DEVFLOW_TEST_PLATFORM: android
      DEVFLOW_TEST_ANDROID_API: ${{ inputs.android-api || '35' }}
      DEVFLOW_TEST_ANDROID_AVD: devflow-tests-api${{ inputs.android-api || '35' }}
      DEVFLOW_RUN_ANDROID_FLOW_PILOT: "1"
      DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT: ./artifacts/devflow/${{ github.run_id }}-${{ github.run_attempt }}/android
      DEVFLOW_FLOW_PILOT_RESULTS_ROOT: ./artifacts/TestResults/devflow-flow/android
      DEVFLOW_FLOW_PILOT_WORKFLOW_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DEVFLOW_FLOW_PILOT_REPOSITORY_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      # Android emulator needs KVM on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui-android android wasm-tools --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Publish CLI for Mobile Canvas companion smoke test
        run: >
          dotnet publish src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj
          -f net10.0 -c Release
          -o ./artifacts/mobile-canvas-cli
          --nologo

      - name: Cache AVD
        uses: actions/cache@v4
        id: flow-pilot-avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.DEVFLOW_TEST_ANDROID_API }}-x86_64

      # Creating an AVD needs about 7.4 GB for its userdata partition, and a runner that has just
      # installed the .NET SDK and MAUI workloads has less than that left, so creation aborts with
      # "Not enough space to create userdata partition". A repository with a warm cache never
      # creates one, so this only bites the first run in a new repository or fork, which is exactly
      # the adoption path. Only toolchains this job does not use are removed.
      - name: Reclaim runner disk for AVD creation
        if: steps.flow-pilot-avd-cache.outputs.cache-hit != 'true'
        run: |
          df -h / | tail -1
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/share/swift /usr/local/.ghcup || true
          df -h / | tail -1

      - name: Warm up AVD snapshot
        if: steps.flow-pilot-avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          avd-name: ${{ env.DEVFLOW_TEST_ANDROID_AVD }}
          api-level: ${{ env.DEVFLOW_TEST_ANDROID_API }}
          arch: x86_64
          target: google_apis
          # See the integration lane's warm-up: creation has to be permitted on a cache miss,
          # which is the only condition under which this step runs at all.
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot."

      - name: Run Android Tier-1 flow pilot
        id: flow-run
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          avd-name: ${{ env.DEVFLOW_TEST_ANDROID_AVD }}
          api-level: ${{ env.DEVFLOW_TEST_ANDROID_API }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # One command on one line, deliberately. The emulator-runner action hands this script
            # to the shell a line at a time, each in its own `sh -c`, so an `export` on an earlier
            # line is gone by the next one and backslash continuations do not survive at all. The
            # lane previously did both: it exported the serial into a shell that then exited, and
            # passed a literal "\" through as an argument, which the entry point refused with
            # "Unknown option '\'" before anything was built, installed, or replayed. Assigning the
            # variable as a prefix of the same command is what actually reaches the script.
            DEVFLOW_TEST_ANDROID_SERIAL="$(adb devices | awk '/^emulator-[0-9]+[[:space:]]+device$/ { print $1; exit }')" bash ./eng/devflow/Run-DevFlowFlowQa.sh --platform android --repeat 3 --configuration Debug --results-root "$DEVFLOW_FLOW_PILOT_RESULTS_ROOT"

      - name: Run pinned Mobile Canvas companion smoke test (android)
        id: mobile-canvas-smoke
        if: always()
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          avd-name: ${{ env.DEVFLOW_TEST_ANDROID_AVD }}
          api-level: ${{ env.DEVFLOW_TEST_ANDROID_API }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >
            node ./eng/smoke-tests/mobile-canvas-companion-smoke-test.mjs
            --maui "$GITHUB_WORKSPACE/artifacts/mobile-canvas-cli/maui"
            --platform android
            --require-device
            --restart-host
            ${{ github.event_name == 'schedule' && '--crash-host' || '' }}

      # The emulator manifest remains not-qualified for the real-device gate. This read-only
      # step publishes the exact missing evidence rather than treating the pilot as a pass.
      - name: Evaluate Android flow-pilot qualification
        if: always()
        run: >
          dotnet run --project src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj
          -f net10.0 --configuration Debug --
          devflow flow qualify --platform android
          --corpus tests/DevFlow/InspectorCorpus
          --artifact-manifest "${DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT}/manifest.json"
          --output "${DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT}/qualification.json"
          --json

      # This pilot is an emulator lane, so the handoff producer intentionally no-ops today.
      # Future physical-device lanes may emit diagnostic handoffs, but the privileged publisher
      # accepts only same-repository default-branch schedule/workflow_dispatch runs, never PR runs.
      - name: Produce bounded DevFlow failure handoff
        if: always()
        shell: pwsh
        env:
          DEVFLOW_FAILURE_HANDOFF_REPOSITORY: ${{ github.repository }}
          DEVFLOW_FAILURE_HANDOFF_WORKFLOW_NAME: ${{ github.workflow }}
          DEVFLOW_FAILURE_HANDOFF_WORKFLOW_PATH: .github/workflows/devflow-integration.yml
          DEVFLOW_FAILURE_HANDOFF_SOURCE_EVENT: ${{ github.event_name }}
          DEVFLOW_FAILURE_HANDOFF_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          DEVFLOW_FAILURE_HANDOFF_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          DEVFLOW_FAILURE_HANDOFF_RUN_ID: ${{ github.run_id }}
          DEVFLOW_FAILURE_HANDOFF_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEVFLOW_FAILURE_HANDOFF_COMMIT_SHA: ${{ github.sha }}
          DEVFLOW_FAILURE_HANDOFF_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          & ./eng/devflow/New-DevFlowFailureHandoff.ps1 `
            -SourceManifestPath "${env:DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT}/manifest.json" `
            -QualificationPath "${env:DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT}/qualification.json" `
            -OutputDirectory ./artifacts/devflow/failure-handoff `
            -Repository $env:DEVFLOW_FAILURE_HANDOFF_REPOSITORY `
            -WorkflowName $env:DEVFLOW_FAILURE_HANDOFF_WORKFLOW_NAME `
            -WorkflowPath $env:DEVFLOW_FAILURE_HANDOFF_WORKFLOW_PATH `
            -SourceEvent $env:DEVFLOW_FAILURE_HANDOFF_SOURCE_EVENT `
            -HeadRepository $env:DEVFLOW_FAILURE_HANDOFF_HEAD_REPOSITORY `
            -HeadRef $env:DEVFLOW_FAILURE_HANDOFF_HEAD_REF `
            -RunId ([Int64] $env:DEVFLOW_FAILURE_HANDOFF_RUN_ID) `
            -RunAttempt ([Int32] $env:DEVFLOW_FAILURE_HANDOFF_RUN_ATTEMPT) `
            -CommitSha $env:DEVFLOW_FAILURE_HANDOFF_COMMIT_SHA `
            -PullRequestNumber ([Int32] $env:DEVFLOW_FAILURE_HANDOFF_PR_NUMBER) `
            -LaneKind android-emulator-pilot

      # Upload the canonical JSON entry bytes. GitHub creates the outer artifact ZIP, so only
      # manifest.json and handoff.json bytes—not the service-generated ZIP container—are stable.
      - name: Upload canonical DevFlow failure handoff entries
        if: ${{ always() && hashFiles(format('artifacts/devflow/failure-handoff/devflow-failure-handoff-{0}-{1}.zip', github.run_id, github.run_attempt)) != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: devflow-failure-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ./artifacts/devflow/failure-handoff/devflow-failure-handoff-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
            ./artifacts/devflow/failure-handoff/devflow-failure-handoff-${{ github.run_id }}-${{ github.run_attempt }}/handoff.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize Android flow runs
        if: always()
        shell: pwsh
        run: >
          ./eng/devflow/Write-DevFlowFlowRunSummary.ps1
          -ResultsRoot "${env:DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT}"
          -Lane android-flow-pilot

      # A lane that publishes no flow-run.json is not a green lane, so this upload fails loudly
      # instead of warning. The evidence paths are explicit and never include raw device logs.
      - name: Upload Android flow evidence
        if: ${{ always() && steps.flow-run.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: devflow-flow-evidence-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ./artifacts/devflow/${{ github.run_id }}-${{ github.run_attempt }}/android/**/flow-run.json
            ./artifacts/devflow/${{ github.run_id }}-${{ github.run_attempt }}/android/**/*.mauitrace
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android flow-pilot artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-flow-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ./artifacts/TestResults/devflow-flow/android/*.trx
            ./artifacts/devflow/${{ github.run_id }}-${{ github.run_attempt }}/android/
          if-no-files-found: warn
          retention-days: 30

  # The companion shares the warmed emulator with the flow pilot, but it owns a separate product
  # contract. Report its result under a separate check so a companion defect cannot make a fully
  # passing flow lane look red to devflow-flow-gate.
  android-mobile-canvas-smoke:
    name: android-mobile-canvas-smoke
    needs: [plan, android-flow-pilot]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.run-android-flow-pilot == 'true'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMOKE_OUTCOME: ${{ needs.android-flow-pilot.outputs.mobile-canvas-smoke-outcome }}
    steps:
      - name: Report Mobile Canvas companion smoke result
        run: |
          if [[ "$SMOKE_OUTCOME" != "success" ]]; then
            echo "::error title=Mobile Canvas companion smoke::The pinned companion smoke test concluded '$SMOKE_OUTCOME'."
            exit 1
          fi
          echo "The pinned Mobile Canvas companion smoke test passed."

  # DEMO ONLY. This job replays one committed flow that is intended to fail
  # (samples/DevFlow.Sample/maui-tests/demo-ci-fix-drift.md) and then fails the run on purpose, so a
  # manager-facing walkthrough can show a real red CI run, a real bounded redacted evidence upload,
  # a real nonqualified demo issue filed by the trusted workflow_run publisher, and the local
  # `maui-devflow-ci-fix` route. It is deliberately NOT in devflow-flow-gate.needs, so it can never
  # turn the required check red, and it never produces production qualification or repair authority.
  android-demo-ci-fix:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.demo-ci-fix &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A second, job-scoped group so a queued demo dispatch never cancels a running one.
    concurrency:
      group: devflow-integration-android-demo-ci-fix-${{ github.run_id }}
      cancel-in-progress: false
    env:
      DEVFLOW_TEST_PLATFORM: android
      DEVFLOW_TEST_ANDROID_API: ${{ inputs.android-api || '35' }}
      DEVFLOW_TEST_ANDROID_AVD: devflow-tests-api${{ inputs.android-api || '35' }}
      DEVFLOW_RUN_ANDROID_FLOW_PILOT: "1"
      # The explicit opt-in filter. Without it the Tier-1 pilot never loads a demo- prefixed flow;
      # with it the pilot loads exactly this one flow and nothing else.
      DEVFLOW_FLOW_PILOT_DEMO_FLOW: demo-ci-fix-drift.md
      DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT: ./artifacts/devflow/${{ github.run_id }}-${{ github.run_attempt }}/android
      DEVFLOW_FLOW_PILOT_RESULTS_ROOT: ./artifacts/TestResults/devflow-flow/android
      DEVFLOW_FLOW_PILOT_WORKFLOW_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DEVFLOW_FLOW_PILOT_REPOSITORY_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      # Android emulator needs KVM on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui-android android wasm-tools --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: Cache AVD
        uses: actions/cache@v4
        id: demo-avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.DEVFLOW_TEST_ANDROID_API }}-x86_64

      - name: Reclaim runner disk for AVD creation
        if: steps.demo-avd-cache.outputs.cache-hit != 'true'
        run: |
          df -h / | tail -1
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/share/swift /usr/local/.ghcup || true
          df -h / | tail -1

      - name: Warm up AVD snapshot
        if: steps.demo-avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          avd-name: ${{ env.DEVFLOW_TEST_ANDROID_AVD }}
          api-level: ${{ env.DEVFLOW_TEST_ANDROID_API }}
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot."

      # The expected outcome of this step is failure. `continue-on-error` keeps the job walking to
      # the classification check, the qualification, the handoff producer, and the uploads; the job
      # still ends red because of the deliberate final step.
      - name: Run the demo CI-fix flow (expected to fail)
        id: demo-flow-run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          avd-name: ${{ env.DEVFLOW_TEST_ANDROID_AVD }}
          api-level: ${{ env.DEVFLOW_TEST_ANDROID_API }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            DEVFLOW_TEST_ANDROID_SERIAL="$(adb devices | awk '/^emulator-[0-9]+[[:space:]]+device$/ { print $1; exit }')" DEVFLOW_FLOW_PILOT_DEMO_FLOW=demo-ci-fix-drift.md bash ./eng/devflow/Run-DevFlowFlowQa.sh --platform android --repeat 1 --configuration Debug --results-root "$DEVFLOW_FLOW_PILOT_RESULTS_ROOT"

      # A demo is only honest if the failure it shows is the failure it claims. This refuses an
      # infrastructure, harness, crash, or timeout failure outright: those would make the rest of
      # the lane a fabricated story rather than a demonstration.
      - name: Verify the demo failure is the intended repair-eligible selector failure
        id: verify-demo-failure
        if: always()
        shell: pwsh
        run: |
          $root = [System.IO.Path]::GetFullPath("$env:DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT")
          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "The demo artifact root '$root' does not exist; the demo flow never produced evidence."
          }
          $reports = @(Get-ChildItem -LiteralPath $root -Filter flow-run.json -Recurse -File |
            Where-Object { [System.IO.Path]::GetFullPath($_.DirectoryName) -ne $root } |
            Sort-Object -Property FullName)
          if ($reports.Count -ne 1) {
            throw "Expected exactly 1 demo flow-run.json, found $($reports.Count)."
          }
          $traces = @(Get-ChildItem -LiteralPath $reports[0].DirectoryName -Filter *.mauitrace -File)
          if ($traces.Count -ne 1) {
            throw "Expected exactly 1 redacted demo .mauitrace beside the selected report, found $($traces.Count)."
          }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json -Depth 32
          $status = [string] $report.outcome.status
          $failureClass = [string] $report.failure.class
          $failureCode = [string] $report.failure.code
          $category = [string] $report.failure.category
          Write-Output "demo outcome=$status class=$failureClass code=$failureCode category=$category repairEligible=$($report.failure.repairEligible)"
          if ($status -cne 'failed') {
            throw "The demo flow reported outcome '$status'; the demo requires a completed test failure."
          }
          if ($report.outcome.terminal -ne $true) {
            throw "The demo flow did not report a terminal outcome."
          }
          if ($failureClass -cne 'locator-not-found' -or $failureCode -cne 'locator-not-found') {
            throw "The demo flow failed as '$failureClass/$failureCode'; the demo requires locator-not-found."
          }
          if ($category -ceq 'infrastructure') {
            throw "The demo flow failed as infrastructure; that is a broken lane, not a demonstration."
          }
          if ($report.failure.repairEligible -ne $true -or
              $report.replayEligibility.repairEligibility -ne $true) {
            throw "The demo selector failure is not repair-eligible."
          }
          if ($report.truncated -eq $true) {
            throw "The demo flow report is truncated."
          }
          if (@($report.secondaryFailures).Count -ne 0) {
            throw "The demo flow reported owned cleanup failures."
          }

      # A real, honest, not-qualified emulator qualification. It is the input the demo lane needs
      # and it is never a production qualification result.
      - name: Evaluate the demo emulator qualification
        id: demo-qualification
        if: ${{ !cancelled() && steps.verify-demo-failure.outcome == 'success' }}
        run: >
          dotnet run --project src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj
          -f net10.0 --configuration Debug --
          devflow flow qualify --platform android
          --corpus tests/DevFlow/InspectorCorpus
          --artifact-manifest "${DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT}/manifest.json"
          --output "${DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT}/qualification.json"
          --json

      - name: Produce the bounded DevFlow demo handoff
        id: demo-handoff
        if: >-
          !cancelled() &&
          steps.verify-demo-failure.outcome == 'success' &&
          steps.demo-qualification.outcome == 'success'
        shell: pwsh
        env:
          DEVFLOW_FAILURE_HANDOFF_REPOSITORY: ${{ github.repository }}
          DEVFLOW_FAILURE_HANDOFF_WORKFLOW_NAME: ${{ github.workflow }}
          DEVFLOW_FAILURE_HANDOFF_WORKFLOW_PATH: .github/workflows/devflow-integration.yml
          DEVFLOW_FAILURE_HANDOFF_SOURCE_EVENT: ${{ github.event_name }}
          DEVFLOW_FAILURE_HANDOFF_HEAD_REPOSITORY: ${{ github.repository }}
          DEVFLOW_FAILURE_HANDOFF_HEAD_REF: ${{ github.ref_name }}
          DEVFLOW_FAILURE_HANDOFF_RUN_ID: ${{ github.run_id }}
          DEVFLOW_FAILURE_HANDOFF_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEVFLOW_FAILURE_HANDOFF_COMMIT_SHA: ${{ github.sha }}
        run: |
          $result = @(& ./eng/devflow/New-DevFlowFailureHandoff.ps1 `
            -SourceManifestPath "${env:DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT}/manifest.json" `
            -QualificationPath "${env:DEVFLOW_FLOW_PILOT_ARTIFACT_ROOT}/qualification.json" `
            -OutputDirectory ./artifacts/devflow/demo-handoff `
            -Repository $env:DEVFLOW_FAILURE_HANDOFF_REPOSITORY `
            -WorkflowName $env:DEVFLOW_FAILURE_HANDOFF_WORKFLOW_NAME `
            -WorkflowPath $env:DEVFLOW_FAILURE_HANDOFF_WORKFLOW_PATH `
            -SourceEvent $env:DEVFLOW_FAILURE_HANDOFF_SOURCE_EVENT `
            -HeadRepository $env:DEVFLOW_FAILURE_HANDOFF_HEAD_REPOSITORY `
            -HeadRef $env:DEVFLOW_FAILURE_HANDOFF_HEAD_REF `
            -RunId ([Int64] $env:DEVFLOW_FAILURE_HANDOFF_RUN_ID) `
            -RunAttempt ([Int32] $env:DEVFLOW_FAILURE_HANDOFF_RUN_ATTEMPT) `
            -CommitSha $env:DEVFLOW_FAILURE_HANDOFF_COMMIT_SHA `
            -PullRequestNumber 0 `
            -LaneKind demo-emulator-showcase)
          $result | Write-Output
          $jsonLine = @($result | Where-Object {
              $_ -is [string] -and $_.TrimStart().StartsWith('{', [StringComparison]::Ordinal)
            } | Select-Object -Last 1)
          if ($jsonLine.Count -ne 1) {
            throw "The demo handoff producer returned no JSON result."
          }
          $producer = $jsonLine[0] | ConvertFrom-Json -Depth 8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Demo handoff producer: status=$($producer.status), reason=$($producer.reason)"
          if ([string] $producer.status -cne 'created') {
            throw "The demo handoff producer returned '$($producer.status)/$($producer.reason)' instead of creating an archive."
          }

      - name: Upload canonical DevFlow demo handoff entries
        if: >-
          !cancelled() &&
          steps.demo-handoff.outcome == 'success' &&
          hashFiles(format('artifacts/devflow/demo-handoff/devflow-demo-handoff-{0}-{1}.zip', github.run_id, github.run_attempt)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: devflow-demo-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ./artifacts/devflow/demo-handoff/devflow-demo-handoff-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
            ./artifacts/devflow/demo-handoff/devflow-demo-handoff-${{ github.run_id }}-${{ github.run_attempt }}/handoff.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload bounded redacted demo evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-demo-evidence-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ./artifacts/devflow/${{ github.run_id }}-${{ github.run_attempt }}/android/**/flow-run.json
            ./artifacts/devflow/${{ github.run_id }}-${{ github.run_attempt }}/android/**/*.mauitrace
          if-no-files-found: error
          retention-days: 30

      # The unmistakable, deliberate end of the demo lane. The workflow conclusion has to be
      # `failure` for the trusted workflow_run publisher to consider the demo handoff at all.
      - name: Fail the demo run on purpose
        if: always()
        run: |
          echo "::error title=DevFlow CI demo::This run failed on purpose. The android-demo-ci-fix job replays a committed demo flow that is intended to fail so the CI-to-local-fix demo has a real red run. It is not a product regression, it is not production qualification, and it grants no repair authority."
          exit 1

  ios:
    needs: plan
    if: needs.plan.outputs.run-ios == 'true'
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVFLOW_TEST_PLATFORM: ios
      DEVFLOW_TEST_IOS_VERSION: ${{ inputs.ios-runtime }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          # Keep Xcode aligned with DOTNET_WORKLOAD_VERSION; newer Apple workloads can require newer Xcode.
          COMPATIBLE="${COMPATIBLE:-}"
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.3.0.app; do
            if [[ -d "$candidate" ]]; then
              COMPATIBLE="$candidate"
              break
            fi
          done
          SELECTED="${COMPATIBLE:-$(ls -1d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)}"
          if [[ -n "$SELECTED" ]]; then
            echo "Using $SELECTED"
            sudo xcode-select -s "$SELECTED/Contents/Developer"
            ACTOOL_PATH="$(xcrun --find actool)"
            DEVELOPER_ROOT="$(cd "$(dirname "$ACTOOL_PATH")/../.." && pwd)"
            XCODE_APP="$(cd "$DEVELOPER_ROOT/../.." && pwd)"
            echo "Resolved developer dir: $DEVELOPER_ROOT"
            echo "Resolved Xcode app: $XCODE_APP"
            export DEVELOPER_DIR="$DEVELOPER_ROOT"
            export MD_APPLE_SDK_ROOT="$XCODE_APP"
            echo "DEVELOPER_DIR=$DEVELOPER_ROOT" >> "$GITHUB_ENV"
            echo "MD_APPLE_SDK_ROOT=$XCODE_APP" >> "$GITHUB_ENV"
          fi
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --find actool

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Apple MAUI workloads
        run: dotnet workload install maui ios macos maccatalyst tvos android wasm-tools --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: Publish CLI for Mobile Canvas companion smoke test
        run: >
          dotnet publish src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj
          -f net10.0 -c Release
          -o ./artifacts/mobile-canvas-cli
          --nologo

      - name: List available iOS simulators
        run: xcrun simctl list devices available

      - name: Run DevFlow integration tests (ios)
        run: >
          dotnet test $TEST_PROJECT
          -c Debug
          --logger "trx;LogFileName=devflow-integration-ios.trx"
          --logger "console;verbosity=normal"
          --results-directory ./artifacts/TestResults/devflow-integration/ios

      - name: Run pinned Mobile Canvas companion smoke test (ios)
        run: >
          node ./eng/smoke-tests/mobile-canvas-companion-smoke-test.mjs
          --maui "$GITHUB_WORKSPACE/artifacts/mobile-canvas-cli/maui"
          --platform ios
          --require-device
          --restart-host

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-integration-ios-results
          path: ./artifacts/TestResults/devflow-integration/ios/
          retention-days: 30

  maccatalyst:
    needs: plan
    if: needs.plan.outputs.run-maccatalyst == 'true'
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVFLOW_TEST_PLATFORM: maccatalyst
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          # Keep Xcode aligned with DOTNET_WORKLOAD_VERSION; newer Apple workloads can require newer Xcode.
          COMPATIBLE="${COMPATIBLE:-}"
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.3.0.app; do
            if [[ -d "$candidate" ]]; then
              COMPATIBLE="$candidate"
              break
            fi
          done
          SELECTED="${COMPATIBLE:-$(ls -1d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)}"
          if [[ -n "$SELECTED" ]]; then
            echo "Using $SELECTED"
            sudo xcode-select -s "$SELECTED/Contents/Developer"
            ACTOOL_PATH="$(xcrun --find actool)"
            DEVELOPER_ROOT="$(cd "$(dirname "$ACTOOL_PATH")/../.." && pwd)"
            XCODE_APP="$(cd "$DEVELOPER_ROOT/../.." && pwd)"
            echo "Resolved developer dir: $DEVELOPER_ROOT"
            echo "Resolved Xcode app: $XCODE_APP"
            export DEVELOPER_DIR="$DEVELOPER_ROOT"
            export MD_APPLE_SDK_ROOT="$XCODE_APP"
            echo "DEVELOPER_DIR=$DEVELOPER_ROOT" >> "$GITHUB_ENV"
            echo "MD_APPLE_SDK_ROOT=$XCODE_APP" >> "$GITHUB_ENV"
          fi
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --find actool

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Apple MAUI workloads
        run: dotnet workload install maui ios macos maccatalyst tvos android wasm-tools --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: Run DevFlow integration tests (maccatalyst)
        run: >
          dotnet test $TEST_PROJECT
          -c Debug
          --logger "trx;LogFileName=devflow-integration-maccatalyst.trx"
          --logger "console;verbosity=normal"
          --results-directory ./artifacts/TestResults/devflow-integration/maccatalyst

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-integration-maccatalyst-results
          path: ./artifacts/TestResults/devflow-integration/maccatalyst/
          retention-days: 30

  # These are advisory evidence lanes. They remain separate from normal integration coverage
  # until returned macOS artifacts satisfy the external Apple qualification gate.
  ios-flow-qa:
    needs: plan
    if: needs.plan.outputs.run-ios-flow-qa == 'true'
    permissions:
      contents: read
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 120
    env:
      DEVFLOW_TEST_PLATFORM: ios
      DEVFLOW_TEST_IOS_VERSION: ${{ inputs.ios-runtime }}
      DEVFLOW_FLOW_QA_ARTIFACT_ROOT: ./artifacts/devflow/${{ github.run_id }}-${{ github.run_attempt }}/ios
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          SELECTED="$(ls -1d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -n "$SELECTED" ]]; then
            sudo xcode-select -s "$SELECTED/Contents/Developer"
          fi
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Apple MAUI workloads
        run: dotnet workload install maui ios macos maccatalyst tvos android wasm-tools --version ${{ env.DOTNET_WORKLOAD_VERSION }}

      - name: Select and boot iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          selector = os.environ.get("DEVFLOW_TEST_IOS_VERSION", "").lower().replace("x", "").rstrip(".")
          candidates = []
          for runtime, values in devices["devices"].items():
              if "iOS" in runtime:
                  if selector and selector not in runtime.lower().replace("-", "."):
                      continue
                  for value in values:
                      if value.get("isAvailable", True) and "iPhone" in value.get("name", ""):
                          candidates.append((value.get("state") == "Booted", value["udid"]))
          print(sorted(candidates, reverse=True)[0][1])
          PY
          )"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      - name: Run advisory iOS XCTest flow QA
        id: flow-run
        continue-on-error: true
        run: |
          bash ./eng/devflow/Run-DevFlowFlowQa.sh \
            --platform ios \
            --apple-spike \
            --simulator-id "${{ steps.simulator.outputs.id }}" \
            --target-bundle-id com.companyname.mauitodo \
            --safe-action-id AddButton \
            --repeat 3 \
            --results-root ./artifacts/TestResults/devflow-flow/ios

      - name: Evaluate iOS qualification evidence
        if: always()
        continue-on-error: true
        run: >
          dotnet run --project src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj
          -f net10.0 --configuration Debug --
          devflow flow qualify --platform ios
          --corpus tests/DevFlow/InspectorCorpus
          --artifact-manifest "${DEVFLOW_FLOW_QA_ARTIFACT_ROOT}/manifest.json"
          --output "${DEVFLOW_FLOW_QA_ARTIFACT_ROOT}/qualification.json"
          --json

      - name: Summarize iOS flow runs
        if: always()
        shell: pwsh
        run: >
          ./eng/devflow/Write-DevFlowFlowRunSummary.ps1
          -ResultsRoot "${env:DEVFLOW_FLOW_QA_ARTIFACT_ROOT}"
          -Lane ios-flow-qa

      - name: Upload iOS flow evidence
        if: ${{ always() && steps.flow-run.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: devflow-flow-evidence-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ./artifacts/devflow/${{ github.run_id }}-${{ github.run_attempt }}/ios/**/flow-run.json
            ./artifacts/devflow/${{ github.run_id }}-${{ github.run_attempt }}/ios/**/*.mauitrace
          if-no-files-found: error
          retention-days: 30

      - name: Upload iOS flow QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devflow-flow-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ./artifacts/TestResults/devflow-flow/ios/
            ./artifacts/devflow/${{ github.run_id }}-${{ github.run_attempt }}/ios/
          if-no-files-found: warn
          retention-days: 30

