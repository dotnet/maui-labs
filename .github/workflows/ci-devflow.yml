name: CI - DevFlow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/DevFlow/**'
      - 'tests/DevFlow/**'
      - 'src/Cli/Microsoft.Maui.Cli/DevFlow/**'
      - '.github/extensions/maui-devflow-canvas/**'
      - '.github/extensions/maui-device-canvas/**'
      - 'plugins/dotnet-maui/**'
      - '.github/workflows/ci-devflow.yml'
      - 'docs/DevFlow/**'
      - 'README.md'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - 'src/DevFlow/**'
      - 'tests/DevFlow/**'
      - 'src/Cli/Microsoft.Maui.Cli/DevFlow/**'
      - '.github/extensions/maui-devflow-canvas/**'
      - '.github/extensions/maui-device-canvas/**'
      - 'plugins/dotnet-maui/**'
      - '.github/workflows/ci-devflow.yml'
      - 'docs/DevFlow/**'
      - 'README.md'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: src/DevFlow/DevFlow.slnf
      project-name: devflow
      run-tests: true
      pack: true
      pack-driver: true
      os: '["windows-latest"]'
