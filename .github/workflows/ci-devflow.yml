name: CI - DevFlow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/DevFlow/**'
      - 'src/Cli/Microsoft.Maui.Cli/DevFlow/**'
      - '.github/extensions/maui-devflow-canvas/**'
      - '.github/workflows/ci-devflow.yml'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - 'src/DevFlow/**'
      - 'src/Cli/Microsoft.Maui.Cli/DevFlow/**'
      - '.github/extensions/maui-devflow-canvas/**'
      - '.github/workflows/ci-devflow.yml'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: src/DevFlow/DevFlow.slnf
      project-name: devflow
      run-tests: true
      pack: true
      os: '["windows-latest"]'

  hosts:
    name: JavaScript hosts and VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/DevFlow/js/package-lock.json
            .github/extensions/maui-devflow-canvas/package-lock.json

      - name: Build and test shared client and VS Code host
        working-directory: src/DevFlow/js
        run: |
          npm ci
          npm test
          npm run build
          npm run package:vsix

      - name: Test Copilot Canvas host
        working-directory: .github/extensions/maui-devflow-canvas
        run: |
          npm ci
          npm test
          npm run selftest:recorder
