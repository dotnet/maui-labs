name: ContosoBinding
options:
  bundleIdPrefix: com.contoso
  # Set per-platform minimum OS versions the wrapper framework supports.
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    # Framework identity/versioning consumed by Info.plist via $(...) substitution.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ContosoBinding:
    type: framework
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ContosoBinding
    settings:
      base:
        DEFINES_MODULE: YES
        # staticlib avoids embedding a second copy of Swift runtime libs when
        # consumed as a static framework from the .NET binding project.
        MACH_O_TYPE: staticlib
        # NO ensures the framework is installed/copied into the app bundle
        # (or made available for MSBuild to pick up) rather than skipped.
        SKIP_INSTALL: NO
        # Bitcode is deprecated/unsupported by current Xcode toolchains; keep
        # disabled unless a specific vendor SDK still requires it.
        ENABLE_BITCODE: NO
        INFOPLIST_FILE: ContosoBinding/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.contoso.binding
        PRODUCT_NAME: ContosoBinding
        # "1,2" = iPhone + iPad; adjust if the wrapper is iPhone-only or also
        # targets Mac Catalyst/macOS.
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      gatherCoverageData: false
      shared: true
    dependencies:
      # Add Swift Package Manager, framework, or CocoaPods-linked dependencies here.
      # - framework: VendorSdk.xcframework
