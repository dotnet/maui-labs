scenarios:
  - name: "Capture a profile photo with platform declarations"
    prompt: |
      I need a MAUI profile photo feature that captures an image with the camera
      on Android and iOS. What runtime checks and manifest/plist entries should I
      add, and how should I handle unsupported devices?
    assertions:
      - type: "output_contains"
        value: "MediaPicker"
      - type: "output_contains"
        value: "IsCaptureSupported"
      - type: "output_contains"
        value: "NSCameraUsageDescription"
      - type: "output_matches"
        pattern: "android.permission.CAMERA"
    rubric:
      - "Checks MediaPicker capture support before invoking camera capture"
      - "Adds Android camera permission/declaration when needed"
      - "Adds iOS/Mac Catalyst camera usage description"
      - "Provides an unsupported/denied fallback instead of crashing"
    timeout: 240

  - name: "Pick and persist an imported document"
    prompt: |
      My MAUI app imports a PDF with FilePicker. The file has to remain
      available after app restart. What should the picker flow do for
      cancellation and durable access?
    assertions:
      - type: "output_matches"
        pattern: "PickAsync|FileResult"
      - type: "output_matches"
        pattern: "OperationCanceledException|null|FileResult"
      - type: "output_matches"
        pattern: "OpenReadAsync|stream"
      - type: "output_matches"
        pattern: "AppDataDirectory|app storage|copy"
    rubric:
      - "Handles cancelled picks as normal user choice"
      - "Reads the picked file stream through the FileResult"
      - "Copies the file into app storage for durable access"
      - "Avoids assuming picker-provided handles remain valid forever"
    timeout: 240

  - name: "Request current location and show it on a map"
    prompt: |
      I am adding a nearby stores map to a MAUI app. What permission flow,
      platform declarations, current-location API, and map setup should I use?
    assertions:
      - type: "output_contains"
        value: "Permissions.LocationWhenInUse"
      - type: "output_contains"
        value: "GeolocationRequest"
      - type: "output_matches"
        pattern: "ACCESS_FINE_LOCATION|NSLocationWhenInUseUsageDescription"
      - type: "output_matches"
        pattern: "UseMauiMaps|<maps:Map|MapHandler"
    rubric:
      - "Checks and requests location permission before geolocation"
      - "Uses GetLocationAsync with GeolocationRequest for current location"
      - "Adds Android and iOS/Mac Catalyst location declarations"
      - "Mentions MAUI Maps setup such as UseMauiMaps or provider configuration"
      - "Warns that background location declarations should only be added for genuine background scenarios and require separate policy/runtime handling"
    timeout: 240

  - name: "Migrate Android storage permissions for media picking"
    prompt: |
      I am migrating a Xamarin.Forms app that declared READ_EXTERNAL_STORAGE for
      gallery image picking. The MAUI app targets Android 13 and newer. What
      should I audit or replace for modern media access?
    assertions:
      - type: "output_contains"
        value: "READ_MEDIA_IMAGES"
      - type: "output_matches"
        pattern: "READ_MEDIA_VIDEO|READ_MEDIA_AUDIO"
      - type: "output_matches"
        pattern: "Permissions\\.Photos|Photo Picker|system photo picker"
      - type: "output_matches"
        pattern: "API 33|targetSdkVersion"
    rubric:
      - "Explains that READ_EXTERNAL_STORAGE is not sufficient for Android 13+ media access"
      - "Recommends granular READ_MEDIA_* permissions only for the media types needed"
      - "Suggests the system photo picker when it satisfies the feature and avoids broad storage permissions"
      - "Frames the work as auditing migrated Xamarin manifest permissions"
    timeout: 240
