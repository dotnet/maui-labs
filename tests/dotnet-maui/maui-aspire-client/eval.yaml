scenarios:
  - name: "Register MAUI typed client with Aspire service discovery"
    prompt: |
      My MAUI app consumes an Aspire-orchestrated apiservice project. Show the
      typed client and service discovery setup, and explain what must be true for
      a service-name endpoint to resolve on emulator or device targets.
    assertions:
      - type: "output_contains"
        value: "AddServiceDiscovery"
      - type: "output_contains"
        value: "AddHttpClient"
      - type: "output_contains"
        value: "apiservice"
      - type: "output_matches"
        pattern: "https\\+http://apiservice|https://apiservice|http://apiservice"
      - type: "output_matches"
        pattern: "Services__|IConfiguration|configuration"
    rubric:
      - "Registers service discovery in the MAUI app"
      - "Registers a typed HttpClient"
      - "Uses the Aspire service name only when matching endpoint configuration is present"
      - "Explains emulator/device apps are not automatically injected with AppHost environment variables"
    timeout: 240

  - name: "Provide standalone fallback addresses per device type"
    prompt: |
      The same MAUI app can also be launched outside Aspire. What fallback base
      addresses should I use for Android emulator, iOS simulator, desktop, and
      physical devices, and how should I avoid shipping emulator-only addresses?
    assertions:
      - type: "output_contains"
        value: "10.0.2.2"
      - type: "output_contains"
        value: "localhost"
      - type: "output_matches"
        pattern: "LAN|dev tunnel|IP address"
      - type: "output_matches"
        pattern: "configuration|hard-code|production"
    rubric:
      - "Uses 10.0.2.2 for Android emulator host access"
      - "Uses localhost for iOS simulator and desktop fallback cases"
      - "Uses LAN/dev tunnel/deployed endpoint guidance for physical devices"
      - "Keeps fallback addresses environment-specific rather than production defaults"
    timeout: 240

  - name: "Combine Aspire client networking with auth and dev certificates"
    prompt: |
      My MAUI Aspire client calls protected APIs locally. How should I attach
      tokens, handle dev certificates or temporary HTTP, and keep OAuth redirect
      setup separate from service discovery?
    assertions:
      - type: "output_matches"
        pattern: "DelegatingHandler|typed HttpClient"
      - type: "output_contains"
        value: "Bearer"
      - type: "output_matches"
        pattern: "(?i)HTTPS|trust|dev certificate|dotnet dev-certs"
      - type: "output_matches"
        pattern: "cleartext|debug-only|#if DEBUG|callback"
      - type: "output_not_matches"
        pattern: "(?m)^\\s*(?:\\w+\\.)?ServerCertificateCustomValidationCallback\\s*=\\s*(HttpClientHandler\\.DangerousAcceptAnyServerCertificateValidator|.*=>\\s*true)"
    rubric:
      - "Attaches tokens through a typed HttpClient or delegating handler"
      - "Prefers HTTPS/dev certificate trust for local protected APIs"
      - "Keeps cleartext exceptions debug-only when HTTP is required"
      - "Explains that Aspire service discovery does not replace native OAuth redirect URI setup"
    timeout: 240
