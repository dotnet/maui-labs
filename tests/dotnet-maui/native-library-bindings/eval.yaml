scenarios:
  - name: "Choose binding strategy for mixed Apple and Android SDK"
    prompt: |
      I have a .NET MAUI app that needs a vendor SDK on iOS, Mac Catalyst, and
      Android. The vendor has a Swift-only xcframework for Apple and Maven
      coordinates for Android. I only need login, logout, and fetchProfile.
      Should I create full bindings, slim bindings, or something else?
    assertions:
      - type: "output_matches"
        pattern: "(?i)slim|native library interop|thin wrapper"
      - type: "output_matches"
        pattern: "(?i)Swift-only|swift-dotnet-bindings|Swift direct"
      - type: "output_matches"
        pattern: "(?i)Maven|Gradle|AndroidMavenLibrary"
      - type: "output_not_matches"
        pattern: "(?i)bind the entire SDK by default|full binding by default"
    rubric:
      - "Recommends slim/NLI wrappers for the small API surface instead of defaulting to a full SDK binding"
      - "Identifies that pure Swift APIs are not visible to Objective Sharpie and need either an ObjC-compatible wrapper or a Swift direct binding route"
      - "Calls out Android Maven/Gradle dependency resolution before writing the Android binding project"
      - "Asks or states that redistribution/package needs affect the project layout"
    timeout: 240

  - name: "Apple xcframework acquisition and validation"
    prompt: |
      I downloaded VendorAnalytics.xcframework from a GitHub release and want to
      bind it for net10.0-ios, net10.0-maccatalyst, net10.0-macos, and net10.0-tvos.
      What should I inspect before creating the binding project, and what should
      the binding .csproj include?
    assertions:
      - type: "output_matches"
        pattern: "(?i)Info\\.plist|AvailableLibraries|slice|architecture|lipo|file"
      - type: "output_matches"
        pattern: "NativeReference"
      - type: "output_matches"
        pattern: "net10\\.0-ios|net10\\.0-maccatalyst|net10\\.0-macos|net10\\.0-tvos"
      - type: "output_matches"
        pattern: "(?i)license|redistribution"
    rubric:
      - "Requires verifying every requested platform/simulator/device slice before multi-targeting"
      - "Shows NativeReference-based binding project setup"
      - "Mentions system frameworks/native dependencies and license/redistribution checks"
      - "Does not imply that a single iOS slice is enough for Mac Catalyst, macOS, or tvOS"
    timeout: 240

  - name: "Swift Package Manager to binding artifact"
    prompt: |
      The iOS SDK I need only has Swift Package Manager instructions:
      https://github.com/vendor/FancyCharts, version 2.4.0. I need to ship a
      .NET MAUI binding NuGet for iOS and Mac Catalyst. How should I acquire the
      native library and make it bindable?
    assertions:
      - type: "output_matches"
        pattern: "(?i)SPM|Swift Package Manager"
      - type: "output_matches"
        pattern: "(?i)xcframework|xcodebuild.*create-xcframework"
      - type: "output_matches"
        pattern: "BUILD_LIBRARY_FOR_DISTRIBUTION"
      - type: "output_matches"
        pattern: "(?i)Objective Sharpie|@objc|Swift direct"
    rubric:
      - "Explains that SPM source must be resolved/built into an xcframework or Xcode project before binding"
      - "Mentions building device and simulator/Catalyst variants and enabling distribution-stable Swift settings when needed"
      - "Explains that Objective Sharpie requires ObjC-visible headers; otherwise use wrapper or Swift direct binding path"
      - "Includes packaging considerations for NuGet redistribution"
    timeout: 240

  - name: "Android Maven dependency graph and NuGet correlation"
    prompt: |
      I need to bind com.vendor:camera-sdk:5.1.0. Gradle resolves:
      androidx.camera:camera-core:1.3.0 -> 1.4.2
      androidx.lifecycle:lifecycle-common:2.7.0 -> 2.8.7
      org.jetbrains.kotlin:kotlin-stdlib:1.9.22 -> 2.0.21
      com.vendor:camera-runtime:5.1.0
      How should I set up the binding dependencies in the .csproj? Should I
      ignore these if I don't call them from C#?
    assertions:
      - type: "output_matches"
        pattern: "AndroidMavenLibrary"
      - type: "output_matches"
        pattern: "PackageReference"
      - type: "output_matches"
        pattern: "(?i)resolved.*version|1\\.4\\.2|2\\.8\\.7|2\\.0\\.21"
      - type: "output_not_matches"
        pattern: "AndroidIgnoredJavaDependency.*camera-runtime"
    rubric:
      - "Uses resolved Gradle versions instead of only requested versions"
      - "Maps AndroidX/Kotlin dependencies to NuGet PackageReference when available"
      - "Uses AndroidMavenLibrary or AndroidLibrary with Bind=false for runtime dependencies not called from C#"
      - "Warns not to ignore runtime dependencies"
    timeout: 240

  - name: "Direct AAR and POM binding with Java dependency verification"
    setup:
      files:
        - path: "VendorBinding/VendorBinding.csproj"
          content: |
            <Project Sdk="Microsoft.NET.Sdk">
              <PropertyGroup>
                <TargetFramework>net10.0-android</TargetFramework>
              </PropertyGroup>
              <ItemGroup>
                <AndroidLibrary Include="libs/vendor-sdk-5.1.0.aar" />
              </ItemGroup>
            </Project>
    prompt: |
      I only have vendor-sdk-5.1.0.aar and vendor-sdk-5.1.0.pom from a GitHub
      release. Update the binding project approach so Java dependency verification
      can tell me what dependencies are missing.
    assertions:
      - type: "output_matches"
        pattern: "Manifest"
      - type: "output_matches"
        pattern: "JavaArtifact"
      - type: "output_matches"
        pattern: "JavaVersion|com\\.vendor:vendor-sdk"
      - type: "output_matches"
        pattern: "AndroidLibrary"
    rubric:
      - "Adds Manifest, JavaArtifact, and JavaVersion metadata to AndroidLibrary"
      - "Explains that the POM enables Java dependency verification"
      - "Does not suggest editing generated api.xml directly"
    timeout: 240

  - name: "Create app-local Android slim binding from Maven"
    setup:
      files:
        - path: "MyMauiApp/MyMauiApp.csproj"
          content: |
            <Project Sdk="Microsoft.NET.Sdk">
              <PropertyGroup>
                <TargetFrameworks>net10.0-android;net10.0-ios</TargetFrameworks>
                <OutputType>Exe</OutputType>
                <UseMaui>true</UseMaui>
              </PropertyGroup>
            </Project>
    prompt: |
      I have a .NET MAUI app in MyMauiApp/. I need to use the Lottie animation
      library (com.airbnb.android:lottie:6.6.2), but I only need to play
      animations from JSON files and don't need the full API surface. Create an
      app-local slim Android binding project in LottieBinding/ with the Kotlin
      wrapper, Gradle build files, and C# binding project.
    assertions:
      - type: "output_matches"
        pattern: "(?i)slim|native library interop|NLI|thin wrapper"
      - type: "output_matches"
        pattern: "(?i)gradlew|gradle|build\\.gradle"
      - type: "output_matches"
        pattern: "AndroidLibrary|AndroidMavenLibrary"
      - type: "output_not_matches"
        pattern: "(?i)Metadata\\.xml.{0,30}(entire|all|full|complete).{0,20}(API|surface|library)"
      - type: "file_exists"
        path: "LottieBinding/build.gradle.kts"
      - type: "file_contains"
        path: "LottieBinding/build.gradle.kts"
        value: "com.airbnb.android:lottie"
    rubric:
      - "Recommends the slim/NLI approach over a traditional full binding because the app needs only a subset"
      - "Creates a Java or Kotlin wrapper class with a Dotnet prefix that exposes only animation playback"
      - "Includes Gradle project structure with the Lottie Maven dependency in build.gradle.kts"
      - "Shows the C# binding project referencing the built wrapper AAR via AndroidLibrary"
      - "Uses simple marshallable wrapper APIs, not Kotlin coroutines, lambdas, or the full Lottie API surface"
    timeout: 240

  - name: "Package reusable multi-platform binding NuGet"
    prompt: |
      My app-local binding works. Now I want to publish a NuGet package that
      supports iOS, Mac Catalyst, and Android. The Apple side has Contoso.xcframework.
      The Android side uses com.contoso:sdk:1.2.3 plus com.contoso:runtime:1.2.3.
      What package assets, props/targets, and validation should I add?
    assertions:
      - type: "output_matches"
        pattern: "buildTransitive|build"
      - type: "output_matches"
        pattern: "NativeReference"
      - type: "output_matches"
        pattern: "AndroidMavenLibrary|PackageReference"
      - type: "output_matches"
        pattern: "(?i)license|redistribution"
      - type: "output_matches"
        pattern: "(?i)sample app|consumer app|clean"
    rubric:
      - "Describes Apple native asset wiring for consumers"
      - "Describes Android artifact/dependency wiring without duplicating runtime dependencies"
      - "Requires license/notice checks before redistribution"
      - "Requires validating the packed nupkg in a clean consumer MAUI app"
    timeout: 240

  - name: "Ambiguous binding request should prompt for strategy clarification"
    prompt: |
      I need to bind the VendorPay native SDK for iOS and Android in our .NET
      MAUI app so we can take payments. Can you set up the binding project?
    assertions:
      - type: "output_matches"
        pattern: "(?i)app-local|redistribut|publish.*nuget|only.*app|internal use"
      - type: "output_matches"
        pattern: "(?i)how many|which methods|small|narrow|broad|full.*api|entire sdk"
      - type: "output_matches"
        pattern: "\\?"
    rubric:
      - "Recognizes that the request does not specify app-local vs redistributable, or narrow vs broad API surface"
      - "Asks a clarifying question (or explicitly states the missing information) before committing to slim vs full binding"
      - "Does not default straight to a full/traditional binding project without first surfacing the strategy question"
      - "If it proceeds with an assumption, states the assumption explicitly rather than silently picking a strategy"
    timeout: 240

  - name: "Update an existing binding after an upstream native SDK release"
    prompt: |
      We shipped a slim iOS wrapper and Android NLI wrapper around VendorChat
      SDK 3.1.0 six months ago, both app-local. VendorChat just released 4.0.0
      with expanded push notification APIs. What should I do to update our
      bindings, and how do I know if anything breaks our C# callers?
    assertions:
      - type: "output_matches"
        pattern: "(?i)release notes|changelog"
      - type: "output_matches"
        pattern: "(?i)xcframework|slice|gradle.*dependenc|dependency tree"
      - type: "output_matches"
        pattern: "(?i)breaking change|diff|signature.*change|api.*diff"
      - type: "output_matches"
        pattern: "(?i)sample app|consumer app|test"
    rubric:
      - "Instructs re-acquiring the updated native artifact for both Apple and Android"
      - "Instructs redoing the dependency graph basics (xcframework slices and/or Gradle dependency tree) rather than assuming they are unchanged"
      - "Explains how to produce a summary of C# API breaking changes before editing wrapper code"
      - "Requires validating the updated bindings from a sample/consumer app before considering the update complete"
    timeout: 240

  - name: "Avoid Kotlin coroutines and lambdas in Android wrapper"
    prompt: |
      I'm creating a Kotlin wrapper for an Android SDK that has async APIs.
      The native SDK uses Kotlin coroutines (suspend functions) and Flow.
      Here's my wrapper attempt:

      ```kotlin
      object DotnetMySDK {
          suspend fun fetchData(url: String): Result<String> {
              return MySdk.fetchData(url)
          }

          fun observeChanges(): Flow<DataUpdate> {
              return MySdk.changes
          }
      }
      ```

      Will this work with the C# binding? If not, what should I change?
    assertions:
      - type: "output_matches"
        pattern: "(?i)won.?t work|will not work|not.{0,10}(work|support|marshal|bind)"
      - type: "output_matches"
        pattern: "(?i)callback|interface|listener"
      - type: "output_contains"
        value: "@JvmStatic"
    rubric:
      - "Identifies that suspend functions and Flow cannot be bound to C# through the binding generator"
      - "Recommends converting to callback interfaces (Java-style listener pattern) instead of coroutines"
      - "Shows a corrected wrapper using a callback interface with onSuccess/onError methods"
      - "Adds @JvmStatic annotation on methods for static access from C#"
      - "Uses simple marshallable types (String, boolean, int) not Kotlin-specific types (Result, Flow)"
    timeout: 240

  - name: "Resolve XA4241 and XA4242 dependency errors in Android binding"
    setup:
      files:
        - path: "MyBinding/MyBinding.csproj"
          content: |
            <Project Sdk="Microsoft.NET.Sdk">
              <PropertyGroup>
                <TargetFramework>net10.0-android</TargetFramework>
              </PropertyGroup>
              <ItemGroup>
                <AndroidLibrary Include="lib/firebase-wrapper.aar" />
              </ItemGroup>
            </Project>
    prompt: |
      My Android binding project at MyBinding/ fails to build with these errors:

      ```
      error XA4241: Java dependency 'androidx.core:core' is not satisfied.
      error XA4241: Java dependency 'org.jetbrains.kotlin:kotlin-stdlib' is not satisfied.
      error XA4242: Java dependency 'com.google.firebase:firebase-common:21.0.0' is not satisfied. Suggested fix: Install NuGet package 'Xamarin.Firebase.Common' version '121.0.0' or higher.
      error XA4241: Java dependency 'javax.inject:javax.inject' is not satisfied.
      ```

      Fix the MyBinding/MyBinding.csproj to resolve these dependency errors.
    assertions:
      - type: "output_contains"
        value: "Xamarin.AndroidX.Core"
      - type: "output_contains"
        value: "Xamarin.Kotlin.StdLib"
      - type: "output_matches"
        pattern: "AndroidMavenLibrary|AndroidIgnoredJavaDependency"
      - type: "output_matches"
        pattern: "Bind.*false|Bind=\"false\""
      - type: "file_contains"
        path: "MyBinding/MyBinding.csproj"
        value: "Xamarin.AndroidX.Core"
      - type: "file_contains"
        path: "MyBinding/MyBinding.csproj"
        value: "Xamarin.Kotlin.StdLib"
    rubric:
      - "For XA4242 with a suggestion (firebase-common), recommends installing the suggested NuGet package first"
      - "For androidx.core:core and kotlin-stdlib, maps to the correct Xamarin.AndroidX/Kotlin NuGet packages"
      - "For javax.inject (annotation/compile-time only), suggests AndroidIgnoredJavaDependency or AndroidMavenLibrary with Bind=false"
      - "Explains the decision tree: XA4242 suggestion -> NuGet; needed at runtime -> AndroidMavenLibrary/PackageReference; compile-time only -> AndroidIgnoredJavaDependency"
    timeout: 240

  - name: "Find NuGet package for Maven dependency using dotnet package search"
    prompt: |
      I'm resolving Android binding dependencies and need to find NuGet equivalents
      for these Maven artifacts from my Gradle dependency tree:

      - androidx.fragment:fragment:1.8.5
      - androidx.lifecycle:lifecycle-common:2.8.7
      - com.squareup.okhttp3:okhttp:4.12.0

      How do I search for the right NuGet packages? And how do I reference them
      in my binding .csproj?
    assertions:
      - type: "output_contains"
        value: "dotnet package search"
      - type: "output_matches"
        pattern: "Xamarin\\.AndroidX\\.Fragment|Xamarin\\.AndroidX\\.Lifecycle"
      - type: "output_matches"
        pattern: "Square\\.OkHttp3|PackageReference"
    rubric:
      - "Shows the dotnet package search command with the artifact= tag filter syntax for NuGet"
      - "Maps all three Maven artifacts to their correct NuGet package names"
      - "Shows PackageReference elements for the .csproj file"
      - "Does not suggest manually downloading JARs or AARs for well-known AndroidX/Square libraries"
    timeout: 240

  - name: "Create iOS binding with CocoaPods dependency via XcodeGen"
    setup:
      files:
        - path: "MyMauiApp/MyMauiApp.csproj"
          content: |
            <Project Sdk="Microsoft.NET.Sdk">
              <PropertyGroup>
                <TargetFrameworks>net10.0-android;net10.0-ios</TargetFrameworks>
                <OutputType>Exe</OutputType>
                <UseMaui>true</UseMaui>
              </PropertyGroup>
            </Project>
    prompt: |
      I have a .NET MAUI app in MyMauiApp/. I want to use the Lottie iOS animation
      library (distributed via CocoaPods as 'lottie-ios') and I only need to play
      animations from JSON files. Create a slim iOS binding project in LottieBinding/
      with the XcodeGen project.yml, Podfile, Swift wrapper, and C# binding project.
    assertions:
      - type: "output_contains"
        value: "XcodeGen"
      - type: "output_matches"
        pattern: "use_frameworks.*static|:linkage.*:static"
      - type: "output_matches"
        pattern: "@objc|NSObject"
      - type: "output_matches"
        pattern: "ApiDefinition\\.cs|BaseType"
      - type: "file_exists"
        path: "LottieBinding/project.yml"
      - type: "file_exists"
        path: "LottieBinding/Podfile"
      - type: "file_contains"
        path: "LottieBinding/Podfile"
        value: "lottie-ios"
    rubric:
      - "Uses XcodeGen (project.yml) to generate the Xcode project rather than manual Xcode project creation"
      - "Configures CocoaPods with use_frameworks! :linkage => :static for static linking"
      - "Shows a Swift wrapper class inheriting from NSObject with @objc annotations on class and methods"
      - "References the Xcode project from the C# binding .csproj using XcodeProject MSBuild item with SchemeName"
      - "Sets BUILD_LIBRARY_FOR_DISTRIBUTION to YES for ABI stability across Swift versions"
    timeout: 240

  - name: "Fix unrecognized selector runtime crash in iOS binding"
    setup:
      files:
        - path: "MyBinding/swift/DotnetMyBinding.swift"
          content: |
            import Foundation

            @objc(DotnetMyBinding)
            public class DotnetMyBinding: NSObject {
                @objc
                public func initialize(apiKey: String) -> Bool {
                    return true
                }
            }
        - path: "MyBinding/ApiDefinition.cs"
          content: |
            using Foundation;
            using ObjCRuntime;

            namespace MyBinding;

            [BaseType(typeof(NSObject))]
            interface DotnetMyBinding {
                [Export("initializeWithApiKey:")]
                bool Initialize(string apiKey);
            }
    prompt: |
      My iOS binding project at MyBinding/ builds successfully but crashes at runtime with:

      ```
      Objective-C exception thrown. Name: NSInvalidArgumentException
      Reason: -[DotnetMyBinding initializeWithApiKey:]: unrecognized selector sent to instance
      ```

      The Swift wrapper is at MyBinding/swift/DotnetMyBinding.swift and the binding
      definition is at MyBinding/ApiDefinition.cs. Fix the code to resolve this
      selector mismatch.
    assertions:
      - type: "output_matches"
        pattern: "(?i)selector.*mismatch|mismatch.*selector|Export.*doesn.t match|@objc.*selector"
      - type: "output_matches"
        pattern: "initializeWithApiKey:"
      - type: "output_matches"
        pattern: "@objc\\(.*initializeWithApiKey"
      - type: "file_contains"
        path: "MyBinding/swift/DotnetMyBinding.swift"
        value: "initializeWithApiKey"
    rubric:
      - "Identifies that the @objc annotation is missing an explicit selector, so Swift generated a different one"
      - "Explains that Swift auto-generates the selector as initializeWithApiKey: but @objc without an explicit selector may produce initializeApiKey: or similar"
      - "Shows the fix: add @objc(initializeWithApiKey:) to explicitly match the [Export] attribute"
      - "Emphasizes that @objc(selector:) in Swift must exactly match [Export(\"selector:\")] in ApiDefinition.cs"
    timeout: 240

  - name: "Design Swift wrapper for async/await APIs with completion handlers and [Async]"
    prompt: |
      The iOS SDK I'm wrapping has async/await Swift APIs:

      ```swift
      class NativeSDK {
          func fetchUser(id: String) async throws -> User
          func uploadImage(_ data: Data) async throws -> URL
      }
      ```

      How do I wrap these for use in a .NET MAUI iOS binding? I need the
      C# side to be awaitable too.
    assertions:
      - type: "output_matches"
        pattern: "(?i)completion.?handler|callback|closure"
      - type: "output_matches"
        pattern: "NSError"
      - type: "output_matches"
        pattern: "\\[Async\\]"
      - type: "output_not_matches"
        pattern: "(?i)async.*throws.*->.*in the wrapper|Task<|ValueTask"
    rubric:
      - "Converts async/await Swift methods to a completion handler pattern in the wrapper"
      - "Shows completion handler signature with (Result?, NSError?) -> Void or similar nullable error pattern"
      - "Uses @objc annotation on the completion handler methods with correct explicit selector names"
      - "Shows [Async] attribute in ApiDefinition.cs to auto-generate C# async/await wrappers"
      - "Does not suggest exposing Swift async/await directly through the binding"
    timeout: 240

  - name: "Generate ApiDefinition.cs with Objective Sharpie and clean up output"
    prompt: |
      I've built my iOS slim binding's Swift wrapper and the xcframework is
      generated. Now I need to create the ApiDefinition.cs. I heard I should
      use Objective Sharpie. How do I find the generated Swift header and run
      Sharpie? What cleanup do I need to do on the output?
    assertions:
      - type: "output_matches"
        pattern: "sharpie bind"
      - type: "output_matches"
        pattern: "(?i)Swift.*header|MyBinding-Swift\\.h"
      - type: "output_matches"
        pattern: "\\[Verify\\]|NullAllowed|\\[Async\\]"
    rubric:
      - "Shows how to locate the generated -Swift.h header file in the build output"
      - "Provides the correct sharpie bind command with --sdk, --namespace, and --scope flags"
      - "Lists required cleanup steps: remove [Verify] attributes only after review, add [NullAllowed], add [Async]"
      - "Mentions removing InitWithCoder constructors that are auto-generated but not needed"
    timeout: 240

  - name: "Build Android slim wrapper AAR via AndroidGradleProject and pack vendor Maven artifacts"
    prompt: |
      I'm building an app-local Android slim binding for the RevenueCat SDK. My
      native Gradle wrapper module (revenuecatbinding) declares:
        implementation("com.revenuecat.purchases:purchases:10.5.0")
        implementation("com.revenuecat.purchases:purchases-store-amazon:10.5.0")
        implementation("com.google.code.gson:gson:2.12.0")
      I want the .NET build to compile the Gradle wrapper into an AAR and bind
      that, and I want the vendor purchases AARs to actually ship in my binding
      so consumers get them. How do I wire up the .csproj? I do NOT want to hand
      author or hand build the wrapper AAR outside the .NET build.
    assertions:
      - type: "output_matches"
        pattern: "AndroidGradleProject"
      - type: "output_matches"
        pattern: "AndroidMavenLibrary"
      - type: "output_matches"
        pattern: "(?i)Pack\\s*=\\s*.?[Tt]rue"
      - type: "output_matches"
        pattern: "(?i)Bind\\s*=\\s*.?[Ff]alse"
    rubric:
      - "Uses AndroidGradleProject to build the native Gradle wrapper module into an AAR as part of the .NET build (the Android analog of XcodeProject), instead of hand-building the AAR"
      - "Binds the thin wrapper, not the vendor SDK directly"
      - "Uses AndroidMavenLibrary with Bind=false to avoid generating C# for the vendor SDK and Pack=true so the vendor AARs ship in the binding"
      - "Does not recommend AndroidIgnoredJavaDependency for the runtime vendor SDK artifacts"
    timeout: 240

  - name: "Correlate resolved Android transitive dependencies to NuGet, packed Maven, or ignored"
    prompt: |
      My Android RevenueCat slim binding builds the wrapper AAR, but Java
      dependency verification (XA4241/XA4242) now flags a pile of transitive
      dependencies the vendor SDK pulls in:
        com.android.billingclient:billing
        androidx.lifecycle:lifecycle-process, lifecycle-runtime, lifecycle-common
        org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.7.3
        org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21
        androidx.core:core-ktx:1.8.0
        com.google.crypto.tink:tink-android:1.8.0
        com.google.code.gson:gson:2.12.0
      I call none of these from C# directly. For each one, what is the right
      resolution: an existing Xamarin/.NET NuGet, a packed AndroidMavenLibrary,
      or AndroidIgnoredJavaDependency? Is there a way to stop the verifier from
      failing the build while I manage this graph myself?
    assertions:
      - type: "output_matches"
        pattern: "Xamarin\\.Android\\.Google\\.BillingClient|Xamarin\\.AndroidX\\.Lifecycle|Xamarin\\.KotlinX\\.Serialization"
      - type: "output_matches"
        pattern: "AndroidIgnoredJavaDependency"
      - type: "output_matches"
        pattern: "(?i)VerifyDependencies\\s*=\\s*.?[Ff]alse"
      - type: "output_matches"
        pattern: "AndroidMavenLibrary"
    rubric:
      - "Maps billingclient/lifecycle/kotlinx-serialization to existing Xamarin.* NuGet PackageReferences via the artifact= tag correlation"
      - "Uses AndroidIgnoredJavaDependency for compile-time-only or already-satisfied artifacts such as kotlin-stdlib, core-ktx, annotation, and tink"
      - "Recommends a packed AndroidMavenLibrary (Pack=true) for a runtime artifact with no maintained NuGet, such as gson"
      - "Explains VerifyDependencies=false as an escape hatch that skips XA4241/XA4242 but shifts the burden of satisfying the runtime graph onto the author (PackageReference + AndroidMavenLibrary + AndroidIgnoredJavaDependency)"
      - "Does not blanket-ignore genuine runtime dependencies with AndroidIgnoredJavaDependency"
    timeout: 240

  - name: "Acquire and trim an xcframework from a GitHub release for a subset of Apple platforms"
    prompt: |
      For the Apple side of my binding I need RevenueCat.xcframework. RevenueCat
      publishes it as RevenueCat.xcframework.zip on their purchases-ios GitHub
      releases (current version 5.72.0). I only target net10.0-ios and
      net10.0-maccatalyst plus tvOS, and I want to drop the visionOS (xros) and
      watchOS slices to shrink the package. How do I download it during the
      build and trim it safely so it still loads at runtime?
    assertions:
      - type: "output_matches"
        pattern: "DownloadFile|releases/download"
      - type: "output_matches"
        pattern: "(?i)Info\\.plist|AvailableLibraries|LibraryIdentifier"
      - type: "output_matches"
        pattern: "(?i)remove-signature|codesign|_CodeSignature"
      - type: "output_not_matches"
        pattern: "(?i)just delete the .*(slice|folder|directory).*(and|then) (build|done|ship)"
    rubric:
      - "Downloads the .xcframework.zip from the GitHub release via an MSBuild DownloadFile/Unzip target keyed on a single version property"
      - "Removes the unwanted xros/watchos slice directories AND the matching AvailableLibraries/LibraryIdentifier entries in Info.plist"
      - "Removes stale code signatures (codesign --remove-signature and/or deleting _CodeSignature) because trimming invalidates the signature"
      - "Warns that deleting a slice directory without editing Info.plist causes load/validation failures"
    timeout: 240

  - name: "Update bindings when Apple and Android vendor SDK versions differ"
    prompt: |
      Our shipping RevenueCat binding pins the Apple SDK at 5.72.0 (downloaded
      xcframework) and the Android SDK at 10.5.0 (Maven). The vendor just
      released new versions on both platforms, but the version numbers don't
      line up between iOS and Android. How should I structure the version pinning
      and the update so I don't accidentally assume one shared version number,
      and so I catch any C# API breaks?
    assertions:
      - type: "output_matches"
        pattern: "(?i)separate|per-platform|independent|each platform|different version"
      - type: "output_matches"
        pattern: "(?i)xcframework|slice"
      - type: "output_matches"
        pattern: "(?i)gradle.*dependenc|dependency tree|resolved"
      - type: "output_matches"
        pattern: "(?i)breaking change|api.*diff|signature.*change"
    rubric:
      - "Recognizes that Apple and Android vendor versions are independent and should be pinned as separate per-platform version properties, not a single global version"
      - "Re-runs the dependency-graph basics per platform (xcframework slice re-verification for Apple, Gradle dependency tree for Android) rather than assuming the previous graph holds"
      - "Produces a summary of C# API breaking changes for each platform before editing wrapper/ApiDefinition code"
      - "Validates from a consumer/sample app on each platform before shipping"
    timeout: 240

  - name: "Reuse an existing binding NuGet instead of authoring a new binding"
    prompt: |
      I want to use the Firebase Cloud Messaging and Firebase Auth native SDKs
      from my .NET MAUI app (iOS and Android). Do I have to write my own
      Objective Sharpie and Java bindings for these from scratch?
    assertions:
      - type: "output_matches"
        pattern: "(?i)existing|already.*(bound|binding)|maintained (binding|nuget)"
      - type: "output_matches"
        pattern: "(?i)AdamE\\.Firebase|Xamarin\\.Firebase|Xamarin\\.Google"
      - type: "output_matches"
        pattern: "(?i)abstraction|wrapper|Plugin\\.Firebase|cross-platform api"
      - type: "output_not_matches"
        pattern: "(?i)(you must|always) (write|author|create) (your own|a new) (objective ?sharpie|binding) (from scratch|first)"
    rubric:
      - "Checks for existing maintained binding NuGets first (AdamE.Firebase.iOS.* for Apple, Xamarin.Firebase.* / Xamarin.GooglePlayServices for Android) before authoring anything"
      - "Recommends consuming those bindings under TFM conditions and layering a small cross-platform abstraction (the Plugin.Firebase model) rather than re-binding the SDK"
      - "Only falls back to authoring a fresh binding if no maintained NuGet exists or it is unusably stale"
    timeout: 240

  - name: "Keep an Android callable wrapper alive under full trimming"
    prompt: |
      My .NET MAUI Android app uses a Firebase-style binding that registers a
      FirebaseMessagingService subclass. It works in Debug but in Release the
      push handler never fires and I see the service isn't recognized. How do I
      confirm the cause and fix it, and how would I add a check so it doesn't
      regress?
    assertions:
      - type: "output_matches"
        pattern: "(?i)trim|linker|R8|TrimMode"
      - type: "output_matches"
        pattern: "(?i)acw-map|AndroidManifest|callable wrapper"
      - type: "output_matches"
        pattern: "(?i)Preserve"
      - type: "output_not_matches"
        pattern: "(?i)disable trimming (entirely|completely) (and|to) (ship|fix|done)"
    rubric:
      - "Identifies that full trimming/R8 stripped the Java callable wrapper or its manifest registration for the messaging service"
      - "Verifies via acw-map.txt (managed type maps to a Java type) and AndroidManifest.xml (service registered with the messaging intent) after a Release/TrimMode=full build"
      - "Fixes by preserving the type ([Android.Runtime.Preserve] / linker keep) rather than only disabling trimming"
      - "Suggests a repeatable validation build with /p:TrimMode=full that greps acw-map.txt and the manifest so it does not regress"
    timeout: 240

  - name: "Split a modular native SDK into per-module binding packages"
    prompt: |
      I need to bind a large modular native SDK (think Stripe on iOS, or Jetpack
      Compose on Android) that ships as many interdependent modules. Should I make
      one big binding, and how do I structure the packages and the dependencies
      between them?
    assertions:
      - type: "output_matches"
        pattern: "(?i)per-module|one (package|binding) per (module|artifact)|module per package"
      - type: "output_matches"
        pattern: "(?i)ProjectReference|PackageReference"
      - type: "output_matches"
        pattern: "(?i)mirror|graph|dependency tree"
      - type: "output_not_matches"
        pattern: "(?i)(combine|collapse|merge) (everything|all modules) into (one|a single) (big )?binding"
    rubric:
      - "Recommends one binding project/package per native module, not a single monolithic binding"
      - "Wires ProjectReference (local) or PackageReference (published) so the managed dependency graph mirrors the native module graph (e.g. StripePaymentsUI -> StripePayments -> StripeCore)"
      - "Notes that pure transitive nodes needing no binding of their own are modeled as plain dependencies, and tags packages with their native group:artifact for discovery"
      - "Optionally mentions community generators (Binderators.Gradle / MetadataFetcher) for very large graphs instead of hand-authoring every project"
    timeout: 240

  - name: "Bind multiple statically linked interdependent xcframeworks in one package"
    prompt: |
      I am binding the Facebook iOS SDK. It ships four separate xcframeworks
      (FBSDKCoreKit, FBSDKCoreKit_Basics, FBAEMKit, FBSDKLoginKit) that depend on
      each other and are statically linked. How do I set up the NativeReference
      items and package them, and what should I watch out for?
    assertions:
      - type: "output_matches"
        pattern: "(?i)NativeReference"
      - type: "output_matches"
        pattern: "(?i)Linkage|Static"
      - type: "output_matches"
        pattern: "(?i)one (package|nuget)|same (package|binding)|version together"
      - type: "output_matches"
        pattern: "(?i)duplicate.*symbol|ForceLoad"
    rubric:
      - "Adds one NativeReference per xcframework in the same binding project and declares static linkage (Linkage=Static / Kind Framework)"
      - "Keeps the four interdependent frameworks in a single NuGet because they must version together, rather than applying the one-library-per-package rule to tightly coupled modules"
      - "Warns about duplicate-symbol risk with static linking and applies ForceLoad only where a framework's ObjC categories/initializers require it"
      - "If IsTrimmable is set on the binding, notes it must be backed by [Preserve] to be truthful"
    timeout: 240

  - name: "Acquire a credentialed SDK and keep the token out of the package"
    prompt: |
      I'm binding the Mapbox SDK for .NET MAUI (Android and iOS). Mapbox serves
      its Android SDK from a private Maven repo that needs a MAPBOX_DOWNLOADS_TOKEN,
      and the iOS SDK also needs a download token. There's also a separate Mapbox
      access token the app uses at runtime. How do I wire acquisition so the build
      can fetch the SDK, without leaking any token into my binding NuGet or source?
    assertions:
      - type: "output_matches"
        pattern: "(?i)gradle\\.properties|GradleRepository|~/\\.gradle"
      - type: "output_matches"
        pattern: "(?i)template|gitignore|environment|CI secret|\\.netrc"
      - type: "output_matches"
        pattern: "(?i)runtime.*(token|key|access)|access token.*runtime|MBXAccessToken|separate secret"
      - type: "output_not_matches"
        pattern: "(?i)(commit|hard-?code|embed|put) the (token|credential|secret) (in|into) (the )?(\\.targets|\\.props|package|nupkg|source)"
    rubric:
      - "Injects the Android download token via ~/.gradle/gradle.properties (or CI env/secret), not committed, and declares the vendor Maven repo (e.g. GradleRepository)"
      - "Uses a committed *.props.template plus a git-ignored real *.props (or env/.netrc) so the token never lands in source or the NuGet"
      - "Distinguishes the build-time download token from the runtime access token (e.g. Info.plist MBXAccessToken) as separate secrets, neither shipped in the package"
      - "Never bakes the token into .targets/.props that ship in the package"
    timeout: 240

  - name: "Bind a fully-Swift SDK that dropped Objective-C compatibility"
    prompt: |
      I need to bind the Mapbox Maps iOS SDK for .NET MAUI. It's written entirely
      in Swift and exposes almost nothing to Objective-C, so Objective Sharpie
      can't see the API. How should I approach this so I end up with a usable
      .NET binding, and what does the overall structure look like?
    assertions:
      - type: "output_matches"
        pattern: "(?i)wrapper (framework|library|pod|project)|objective-c.*wrapper|@objc"
      - type: "output_matches"
        pattern: "(?i)-Swift\\.h|generated header|objective sharpie"
      - type: "output_matches"
        pattern: "(?i)xcframework|XcodeProject"
      - type: "output_not_matches"
        pattern: "(?i)(point|run) (objective ?sharpie|sharpie) (directly )?(at|on) the (swift|mapbox) (sdk|source).{0,40}(and|to) (bind|generate)"
    rubric:
      - "Explains that Objective Sharpie parses ObjC headers, so a pure-Swift SDK needs a separate @objc-compatible wrapper framework built on top of the SDK"
      - "Binds the wrapper's generated -Swift.h (built into an xcframework or referenced via XcodeProject), not the Swift SDK directly"
      - "Describes the three-layer stack: Swift SDK -> ObjC wrapper framework -> .NET binding (optionally -> MAUI control), and that the wrapper is a versioned artifact to maintain across updates"
      - "Prefers @objc NSObject types with factory methods and prefixed names; avoids exposing Swift-only generics/actors/SwiftUI"
    timeout: 240

  - name: "Acquire a Swift SDK via Carthage and prefer its shipped ObjC module"
    prompt: |
      I want to bind the Datadog iOS SDK for .NET MAUI. It's a Swift SDK
      distributed with a Cartfile, and it has several interdependent frameworks
      (DatadogCore, DatadogRUM, DatadogLogs, etc.). How do I acquire it and get
      a bindable Objective-C surface with the least effort?
    assertions:
      - type: "output_matches"
        pattern: "(?i)carthage.*--use-xcframeworks|--use-xcframeworks"
      - type: "output_matches"
        pattern: "(?i)DatadogObjc|objc.*module|ships? an? .*objc|first-party.*objc|vendor.*objc"
      - type: "output_matches"
        pattern: "(?i)Cartfile\\.resolved|pin|interdependent|transitive"
    rubric:
      - "Uses `carthage update --use-xcframeworks` to produce xcframeworks (noting plain carthage yields only per-platform .frameworks) and pins via Cartfile.resolved"
      - "Recommends binding the vendor-shipped ObjC-compat module (DatadogObjc) instead of hand-writing a wrapper, since the SDK already provides one"
      - "Accounts for the interdependent framework/xcframework tree — bind/bundle each used module plus its transitive dependencies"
    timeout: 240
