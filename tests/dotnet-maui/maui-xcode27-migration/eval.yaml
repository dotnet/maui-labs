scenarios:
  - name: "Existing .NET 10 app exits after splash"
    setup:
      files:
        - path: "MyApp/MyApp.csproj"
          content: |
            <Project Sdk="Microsoft.NET.Sdk">
              <PropertyGroup>
                <TargetFrameworks>net10.0-ios;net10.0-maccatalyst</TargetFrameworks>
                <UseMaui>true</UseMaui>
                <SupportedOSPlatformVersion Condition="$([MSBuild]::GetTargetPlatformIdentifier('$(TargetFramework)')) == 'ios'">14.0</SupportedOSPlatformVersion>
                <SupportedOSPlatformVersion Condition="$([MSBuild]::GetTargetPlatformIdentifier('$(TargetFramework)')) == 'maccatalyst'">15.0</SupportedOSPlatformVersion>
              </PropertyGroup>
              <ItemGroup>
                <PackageReference Include="Microsoft.Maui.Controls" Version="$(MauiVersion)" />
              </ItemGroup>
            </Project>
    prompt: |
      Our existing .NET 10 MAUI app in MyApp builds with Xcode 27.0 but exits after
      splash with "UIScene lifecycle is required" on an ordinary iPhone.
      MAUI resolves to 10.0.100 through the workload default. Neither Apple head
      has a scene manifest or custom callbacks. I approve dropping iOS 14 and
      Catalyst 15 support. Show the project, delegate and plist changes needed
      on both heads, and explain what still needs build/runtime validation.
      Do not install tools or change the machine's Xcode selection.
    assertions:
      - type: output_contains
        value: "MauiUISceneDelegate"
      - type: output_contains
        value: "__MAUI_DEFAULT_SCENE_CONFIGURATION__"
      - type: output_contains
        value: "UIApplicationSceneManifest"
      - type: output_matches
        pattern: '10\.0\.\d+'
      - type: output_matches
        pattern: '15\.0|iOS 15'
      - type: output_matches
        pattern: '17\.0|Catalyst 17'
    rubric:
      - "Explains SDK 27 scene requirement applies to ordinary iPhones, not just Duo"
      - "Updates the effective MAUI version before migration without changing .NET major"
      - "Adds public registered MAUI scene delegates and one root manifest to both Apple heads while preserving AppDelegate inheritance"
      - "Uses the approved iOS 15.0 and Catalyst 17.0 minima with inline XML version text and defaults multiple scenes to false"
      - "Distinguishes proposed changes from actual build/runtime evidence and does not disable Xcode version checks"
    timeout: 240

  - name: "Repair leftover callbacks in a partially migrated custom scene app"
    prompt: |
      Finish migrating a .NET 10 MAUI iOS/Catalyst app to Xcode 27.0.
      We approve iOS 15/Catalyst 17 and MAUI 10.0.110. Both heads already use
      a registered ExistingSceneDelegate : MauiUISceneDelegate, configuration
      __MAUI_DEFAULT_SCENE_CONFIGURATION__, and true multiwindow support.
      Its OnActivated(UIScene) override calls base and logs scene activation.
      Leftover AppDelegate overrides log app activation and warm URLs, and its
      PerformActionForShortcutItem handles "orders.open" and completes with
      true only for that type. FinishedLaunching sets Window.RootViewController.Title
      from LaunchOptionsUrlKey. ConfigureLifecycleEvents separately logs shortcut
      types without completing, and ContinueUserActivity logs ActivityType and
      returns false. Show concrete callback replacements that preserve all those
      side effects, including warm/cold links and activities. Do not install tools
      or claim the resulting callbacks have been exercised on a device.
    assertions:
      - type: output_contains
        value: "PerformActionForShortcutItem"
      - type: output_matches
        pattern: 'SceneContinueUserActivity|(?s)override\s+bool\s+ContinueUserActivity\s*\(\s*UIScene'
      - type: output_contains
        value: "UserActivities"
      - type: output_contains
        value: "UrlContexts"
      - type: output_matches
        pattern: '(?i)scene[^\r\n]*activat|activat[^\r\n]*scene'
      - type: output_matches
        pattern: '(?i)completion|acknowledg'
    rubric:
      - "Preserves custom registered names and multiwindow intent"
      - "Maps both original activation side effects to a scene path; recognizes leftover inactive app callbacks as unfinished migration rather than a newly introduced regression"
      - "Keeps the shortcut observer separate from the custom handler, completes each exactly once, and reports false for the observer"
      - "Does not duplicate default Essentials quick-action forwarding"
      - "Preserves warm URL handling and the user-activity handler's false result with the correct scene signatures"
      - "Enumerates both cold connection-option collections with typed elements and defers window work per scene instead of using AppDelegate.Window"
      - "Retains base scene forwarding and does not assume SceneContinueUserActivity automatically receives cold activities"
    timeout: 300

  - name: "Preserve central package ownership and higher deployment targets"
    setup:
      files:
        - path: "MyApp/Directory.Packages.props"
          content: |
            <Project>
              <PropertyGroup>
                <ManagePackageVersionsCentrally>true</ManagePackageVersionsCentrally>
              </PropertyGroup>
              <ItemGroup>
                <PackageVersion Include="Microsoft.Maui.Controls" Version="10.0.100" />
              </ItemGroup>
            </Project>
        - path: "MyApp/MyApp.csproj"
          content: |
            <Project Sdk="Microsoft.NET.Sdk">
              <PropertyGroup>
                <TargetFrameworks>net10.0-ios;net10.0-maccatalyst</TargetFrameworks>
                <UseMaui>true</UseMaui>
                <SupportedOSPlatformVersion Condition="$([MSBuild]::GetTargetPlatformIdentifier('$(TargetFramework)')) == 'ios'">16.0</SupportedOSPlatformVersion>
                <SupportedOSPlatformVersion Condition="$([MSBuild]::GetTargetPlatformIdentifier('$(TargetFramework)')) == 'maccatalyst'">18.0</SupportedOSPlatformVersion>
              </PropertyGroup>
              <ItemGroup>
                <PackageReference Include="Microsoft.Maui.Controls" />
              </ItemGroup>
            </Project>
    prompt: |
      Review MyApp for an Xcode 27.0 migration. It has no scene manifests yet.
      Show which version owner and platform files need changes. Keep the
      current deployment targets and .NET major version; don't install tools.
    assertions:
      - type: output_contains
        value: "Directory.Packages.props"
      - type: output_contains
        value: "MauiUISceneDelegate"
      - type: output_matches
        pattern: '16\.0'
      - type: output_matches
        pattern: '18\.0'
    rubric:
      - "Updates the central Microsoft.Maui.Controls package version to compatible .NET 10 servicing with scene fixes"
      - "Does not insert an ineffective project MauiVersion pin or a package-reference Version that conflicts with central management"
      - "Preserves iOS 16.0 and Catalyst 18.0 rather than lowering them to the SDK minimums"
      - "Includes both Apple scene manifests/delegates without changing framework major"
    timeout: 240

  - name: "Already migrated app needs no rewrite or version downgrade"
    prompt: |
      Audit only: our MAUI app has net10.0-ios and net10.0-maccatalyst heads,
      and centrally resolves MAUI 10.0.120, a compatible servicing release
      containing the 10.0.110 scene fixes. Both heads already have public
      [Register("SceneDelegate")] SceneDelegate : MauiUISceneDelegate classes
      and root UIApplicationSceneManifest entries, multiple scenes false,
      application role, configuration __MAUI_DEFAULT_SCENE_CONFIGURATION__,
      delegate name SceneDelegate. AppDelegate derives from MauiUIApplicationDelegate.
      Minima are iOS 16.0 and Catalyst 18.0. There are no custom callbacks.
      SDK 10.0.401/workload set 10.0.401.1 and Xcode 27.0 are selected.
      Is a project rewrite needed? Leave every file unchanged, including
      generated files, and don't install anything.
    assertions:
      - type: output_matches
        pattern: '(?i)already|no (?:further |additional |project )?(?:changes|rewrite)|unchanged'
      - type: output_matches
        pattern: '10\.0\.120'
    rubric:
      - "Recognizes the existing configuration as migrated and recommends no source edits or duplicate scene declarations"
      - "Preserves the newer compatible MAUI version and higher deployment targets instead of downgrading them to recipe defaults"
      - "Does not run or propose executing restore/build as part of this read-only audit because generated files must remain unchanged"
      - "Separates static readiness from runtime validation that has not been performed"
    timeout: 240

  - name: "Old OS support blocks migration before any edits"
    prompt: |
      Our release manager wants an assessment, not a patch, of moving our
      .NET 10 MAUI iOS/Catalyst product to Xcode 27.0. Contracts require
      continued iOS 14 and Catalyst 15 support. We have MAUI 10.0.100 and no
      scene delegates or manifests. Explain the blocking decision and leave
      every file exactly as it was, even preparatory scene changes or generated
      restore/build outputs. Do not install tools.
    assertions:
      - type: output_matches
        pattern: '15\.0|iOS 15'
      - type: output_matches
        pattern: '17\.0|Catalyst 17'
      - type: output_matches
        pattern: '(?i)approval|approve|decision|cannot|conflict|block'
    rubric:
      - "Identifies the SDK deployment-floor conflict and requires an explicit support-policy decision before raising minima"
      - "Does not treat a request to assess Xcode 27 as approval to drop old OS users"
      - "Stops before preparatory scene/version edits and before restore/build that would create generated files"
      - "Explains that retaining a supported older toolchain is an alternative to dropping OS support"
    timeout: 240

  - name: "NET 9 requires an intentional major upgrade"
    prompt: |
      Can our .NET 9 MAUI app use Xcode 27.0 by pinning MauiVersion to 10.0.110?
      Audit only, no framework upgrades approved.
    assertions:
      - type: output_matches
        pattern: '(?i)\.NET 10|net10'
      - type: output_matches
        pattern: '(?i)upgrade|approval|approve|decision'
    rubric:
      - "Explains that there are no .NET 9 Apple 27 packs and a MAUI package pin alone cannot add that support"
      - "Requires a deliberate .NET 10 upgrade covering dependencies, SDK/workload and CI instead of silently rewriting target frameworks"
      - "Leaves the audit-only project unchanged"
    timeout: 240

  - name: "NET 11 RC1 is not the NET 10 recipe"
    prompt: |
      Audit our .NET 11 RC1 MAUI iOS/Catalyst app for Xcode 27 compatibility.
      Do not edit yet. Can we pin MAUI 10.0.110 and copy the .NET 10 scene
      recipe, or does RC2 source containing fixes mean we can already install it?
    assertions:
      - type: output_matches
        pattern: '26\.6'
      - type: output_matches
        pattern: '(?i)RC\s?1'
    rubric:
      - "Rejects the cross-major .NET 10 package pin for a .NET 11 RC1 app"
      - "Explains RC1 has scene infrastructure but lacks scene App Actions and Essentials URL/user-activity forwarding fixes"
      - "Identifies RC1's Xcode 26.6 requirement rather than assuming .NET 10 Apple 27 support applies"
      - "Requires actual publication/support verification for RC2 rather than equating source changes with installable packages"
    timeout: 240

  - name: "Reject Xcode version check bypass"
    prompt: |
      Audit only: our MAUI app uses released .NET 10 Apple 27.0.10722 packs,
      but the build machine selects Xcode 27.1 beta. Can I disable the Xcode
      version check since dotnet/macios#26705 merged into xcode27.1?
      Do not modify project files or the machine's Xcode selection.
    assertions:
      - type: output_matches
        pattern: '27\.0'
      - type: output_matches
        pattern: '(?i)do not disable|don.t disable|should not disable|not.*(?:bypass|disable)|unsupported|unsafe'
    rubric:
      - "Requires matching Xcode 27.0 for the released 27.0.10722 pack and does not provide a version-check bypass as the solution"
      - "Does not infer released 27.1 packs from a merged branch PR"
      - "Distinguishes a proposed supported pairing from authorization to change global Xcode or workloads"
    timeout: 240

  - name: "Android-only app does not need Apple migration"
    expect_activation: false
    setup:
      files:
        - path: "MyApp/MyApp.csproj"
          content: |
            <Project Sdk="Microsoft.NET.Sdk">
              <PropertyGroup>
                <TargetFramework>net10.0-android</TargetFramework>
                <UseMaui>true</UseMaui>
              </PropertyGroup>
            </Project>
    prompt: |
      Does MyApp need changes for Xcode 27? It is Android-only and will stay
      Android-only. Audit only; do not add platforms or change files.
    assertions:
      - type: output_matches
        pattern: '(?i)not applicable|no.*(?:migration|changes|Apple|iOS)|does not.*(?:need|apply|target)'
    rubric:
      - "Identifies the absence of Apple targets and says this migration is not applicable"
      - "Does not add scene files, plist manifests, Apple target frameworks or Apple deployment properties"
    timeout: 240

  - name: "Unrelated UI request does not become a scene migration"
    expect_activation: false
    prompt: |
      Audit only: suggest a nicer text color for a label in our .NET 10 MAUI
      app. Our Macs happen to have Xcode 27 installed. Do not change SDK,
      deployment target, project or lifecycle settings, and do not edit files.
    assertions:
      - type: output_matches
        pattern: '(?i)TextColor|color|colour'
    rubric:
      - "Answers the cosmetic label-color question without prescribing scene migration"
      - "Does not change SDK, deployment targets or lifecycle behavior merely because Xcode 27 is mentioned"
    timeout: 240
