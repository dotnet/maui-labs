scenarios:
  - name: "Call a local API from Android emulator during development"
    prompt: |
      My MAUI Android emulator cannot call my ASP.NET Core API at
      http://localhost:5251. Show the platform-aware base address guidance and
      debug-only cleartext setup I should consider while keeping my HttpClient
      registration clean.
    assertions:
      - type: "output_contains"
        value: "10.0.2.2"
      - type: "output_matches"
        pattern: "networkSecurityConfig|UsesCleartextTraffic|cleartextTrafficPermitted|NSAppTransportSecurity|App Transport Security"
      - type: "output_matches"
        pattern: "#if DEBUG|IsDevelopment|debug-only|Condition=.*Debug"
      - type: "output_contains"
        value: "AddHttpClient"
      - type: "output_not_matches"
        pattern: "(?m)^\\s*(?:var|HttpClient|using|_?client)\\b[^\\n=]*=\\s*new\\s+HttpClient\\s*\\("
    rubric:
      - "Explains that Android emulator uses 10.0.2.2 to reach the host machine"
      - "Keeps cleartext HTTP exceptions debug-only"
      - "Uses DI/typed HttpClient rather than constructing clients in pages"
      - "Mentions different fallback addresses for iOS simulator, desktop, or physical devices"
    timeout: 240

  - name: "Design SQLite offline sync boundaries"
    prompt: |
      I am adding offline editing to a MAUI orders app. Orders should save while
      offline and sync later. What local SQLite shape and sync metadata should I
      plan for to avoid losing edits and to handle conflicts? Explicitly call
      out which data is read-only cached reference data versus editable offline
      entities, and include a concrete SQLite initialization/storage API
      example, not just the entity classes.
    assertions:
      - type: "output_matches"
        pattern: "SQLiteAsyncConnection|CreateTableAsync|DbContext"
      - type: "output_matches"
        pattern: "read-only|readonly|cached reference|editable offline|offline-editable|server-authoritative"
      - type: "output_matches"
        pattern: "dirty|pending|PendingCreate|PendingUpdate|sync queue"
      - type: "output_matches"
        pattern: "ETag|row version|concurrency|UpdatedAt"
      - type: "output_matches"
        pattern: "tombstone|PendingDelete|pending delete|soft delete|deleted marker|sync.*delete"
      - type: "output_matches"
        pattern: "encrypt|SQLCipher|SecureStorage.*key|sensitive"
      - type: "output_matches"
        pattern: "MainThread|background|paged|chunk|batch|Task\\.Run"
    rubric:
      - "Defines explicit offline boundaries for cached versus editable data"
      - "Includes a concrete SQLiteAsyncConnection/CreateTableAsync or EF Core DbContext setup"
      - "Adds dirty/pending operation state for queued sync"
      - "Uses concurrency metadata such as ETag, row version, or UpdatedAt"
      - "Accounts for deletes with tombstones or pending delete records"
      - "Recommends encryption when offline data is sensitive or regulated"
      - "Keeps large sync work off the UI thread with chunking or background processing"
      - "Recommends documenting an explicit conflict resolution policy such as server wins, client wins, field merge, or user decision"
    timeout: 240

  - name: "Build a resilient typed API client"
    prompt: |
      Create guidance for a MAUI typed API client that serializes DTOs, supports
      cancellation from UI commands, and retries transient mobile network
      failures without retrying validation errors.
    assertions:
      - type: "output_contains"
        value: "AddHttpClient"
      - type: "output_matches"
        pattern: "JsonSerializerOptions|JsonSerializerContext|source-generat|System.Text.Json"
      - type: "output_contains"
        value: "CancellationToken"
      - type: "output_matches"
        pattern: "Polly|AddStandardResilienceHandler|backoff|jitter"
      - type: "output_not_matches"
        pattern: "async\\s+void"
    rubric:
      - "Registers the API client through AddHttpClient"
      - "Uses System.Text.Json options or source generation for DTO serialization"
      - "Passes CancellationToken from UI/lifecycle boundaries"
      - "Retries only transient failures with backoff and does not retry validation failures"
    timeout: 240
