scenarios:
  - name: "Audit migration blockers before porting"
    prompt: |
      I need a Xamarin.Forms migration audit before porting to .NET MAUI. I
      inherited a Xamarin.Forms 5 app with DependencyService calls in 15 files,
      MessagingCenter.Subscribe in 8 pages, three custom renderers (Entry border
      tweak, camera preview, payment UI overlay), and platform projects for Android
      and iOS with native permissions. Build the audit plan and name the MAUI
      replacement/skill for each pattern before we start moving code.
    assertions:
      - type: "output_matches"
        pattern: "DependencyService.*(DI|dependency injection)|(DI|dependency injection).*DependencyService"
      - type: "output_matches"
        pattern: "MessagingCenter.*WeakReferenceMessenger|WeakReferenceMessenger.*MessagingCenter|event aggregator|IObservable"
      - type: "output_matches"
        pattern: "renderer|handler|PropertyMapper|ViewHandler"
      - type: "output_matches"
        pattern: "permissions|Info\\.plist|AndroidManifest|capabilit"
      - type: "output_matches"
        pattern: "maui-custom-handlers|maui-platform-invoke|slim-bindings|android-slim-bindings|ios-slim-bindings"
    rubric:
      - "Starts with a migration audit of packages, platform projects, renderers, DependencyService, MessagingCenter, permissions, and capabilities"
      - "Plans DependencyService replacement through DI registration and constructor injection"
      - "Plans MessagingCenter replacement with WeakReferenceMessenger, events, observable state, or explicit services"
      - "Classifies custom renderers before choosing mapper customization, custom handlers, platform services, or slim bindings"
      - "Names the follow-up MAUI skill or workstream for each migration blocker"
    timeout: 240
