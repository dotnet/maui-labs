scenarios:
  - name: "Schedule local notifications with platform permission UX"
    prompt: |
      I need local reminder notifications in a MAUI app for Android and iOS. What
      platform setup and permission UX should I include before scheduling
      notifications? Include the denied/disabled state and make clear the
      permission request happens before the first schedule attempt.
    assertions:
      - type: "output_contains"
        value: "NotificationChannel"
      - type: "output_contains"
        value: "POST_NOTIFICATIONS"
      - type: "output_matches"
        pattern: "UNUserNotificationCenter|UserNotifications"
      - type: "output_matches"
        pattern: "NotificationManager|Importance|channel ID"
      - type: "output_matches"
        pattern: "denied|disabled|Settings|in-app"
      - type: "output_matches"
        pattern: "(?i)before|prior|request.*schedule|schedule.*after.*permission"
    rubric:
      - "Creates Android notification channels for Android 8+"
      - "Requests Android 13+ POST_NOTIFICATIONS permission"
      - "Requests iOS notification authorization through UserNotifications"
      - "Handles denied notification permission as a visible app state"
    timeout: 240
