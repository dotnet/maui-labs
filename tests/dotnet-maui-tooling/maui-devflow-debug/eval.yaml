scenarios:
  - name: "Launch an iOS .NET 11 app once and iterate with watch"
    prompt: |
      I need to adjust a label in my .NET 11 MAUI iOS app and check it on the
      simulator. The app already has DevFlow, but I launched it with a normal
      `dotnet build -t:Run`, not `dotnet watch`. How should I do the edit-test
      loop without rebuilding and relaunching after every change?
    assertions:
      - type: "output_matches"
        pattern: "dotnet\\s+watch"
      - type: "output_matches"
        pattern: "net11\\.0-ios"
      - type: "output_matches"
        pattern: "maui devflow (wait|agent status|ui)|maui_(wait|status|tree|query|element|get_property)"
      - type: "output_not_contains"
        value: "restart the app after every edit"
    rubric:
      - "Explains that the already-running regular launch is not automatically a watch session and starts one deliberate watch launch."
      - "Uses an explicit iOS simulator/device target and keeps the watcher alive across edits."
      - "Verifies the changed behavior through DevFlow rather than treating build success as proof."
      - "Preserves a rebuild/relaunch fallback for edits that the watcher cannot apply."
    timeout: 120

  - name: "Reuse a compatible watcher for a C# method edit"
    prompt: |
      My .NET 11 Android MAUI app is already running under `dotnet watch` and
      DevFlow can query it. I changed the body of an existing button handler.
      What should I do next, and how do I know the running app used my new code?
    assertions:
      - type: "output_matches"
        pattern: "maui devflow (agent status|ui (query|property|tree))|maui_(status|tree|query|element|get_property)"
      - type: "output_matches"
        pattern: "watcher|dotnet watch"
      - type: "output_matches"
        pattern: "verify|confirm|assert"
      - type: "output_not_contains"
        value: "start another dotnet watch"
    rubric:
      - "Keeps and reuses the already-running watcher instead of launching a duplicate."
      - "Checks the watcher result and exercises the changed handler through a real UI interaction."
      - "Uses DevFlow to verify an observable result from the source change."
      - "Does not use `set-property` or a screenshot alone as proof of C# Hot Reload."
    timeout: 120

  - name: "Handle a XAML edit that requests a restart"
    prompt: |
      I am editing this repository's .NET 11 Android `DevFlow.Sample` under
      `dotnet watch` from the app directory with an explicit device and
      `--no-launch-profile`.
      `dotnet watch --list` shows `MainPage.xaml.cs` but not `MainPage.xaml`.
      Changing an existing label's XAML `Text` says "Restart is needed to apply
      the changes." The rebuilt app shows the new text after restarting. Does
      that prove live XAML Hot Reload, and what should I do next?
    assertions:
      - type: "output_matches"
        pattern: "restart"
      - type: "output_matches"
        pattern: "MauiXamlInflator|SourceGen"
      - type: "output_matches"
        pattern: "EnableMauiIncrementalHotReload|incremental"
      - type: "output_matches"
        pattern: "watch --list|MainPage\\.xaml"
      - type: "output_matches"
        pattern: "verbose|ENC0118|DevFlowXamlSourceMaps"
      - type: "output_matches"
        pattern: "maui devflow (wait|agent status|ui)|maui_(wait|status|tree|query|element|get_property)"
      - type: "output_not_contains"
        value: "the XAML hot reload succeeded"
    rubric:
      - "Treats the restart-needed message as evidence that the edit was not hot-reloaded."
      - "Checks source-generated XAML configuration and that incremental Hot Reload has not been disabled."
      - "Waits for or verifies the new app instance with DevFlow, then re-queries the affected element."
      - "Distinguishes successful rebuild/relaunch from same-process XAML Hot Reload, and investigates the verbose diagnostic rather than treating omission from --list as proof the file is unwatched."
      - "Recognizes that an older DevFlow source-map generator can trigger ENC0118, without assuming every restart has that cause."
    timeout: 120

  - name: "Verify repeated XAML Hot Reload and source maps"
    prompt: |
      My .NET 11 Android DevFlow.Sample is running under dotnet watch. I changed
      a XAML label and moved it down a line. The watcher says changes applied.
      How can I prove the app updated in place and the DevFlow source map is
      fresh, and then check a second edit without losing typed input?
    assertions:
      - type: "output_matches"
        pattern: "maui devflow (agent status|ui (query|tree))|maui_(status|tree|query|element)"
      - type: "output_matches"
        pattern: "process|PID|incarnation"
      - type: "output_matches"
        pattern: "hash|source.?map"
    rubric:
      - "Compares app process or incarnation before and after each edit and confirms input state remains."
      - "Checks the actual label and current source line/hash via DevFlow for both edits."
      - "Keeps the same watcher running and treats watcher output alone as insufficient proof."
    timeout: 120

  - name: "Handle a Hot Reload compilation error"
    prompt: |
      My .NET 11 Android MAUI app is still connected to DevFlow, but after I
      edit an existing C# method, `dotnet watch` says "Unable to apply changes
      due to compilation errors." What should I check before I continue testing?
    assertions:
      - type: "output_matches"
        pattern: "compilation error|compilation failure|unable to apply"
      - type: "output_matches"
        pattern: "maui devflow (agent status|ui (query|tree))|maui_(status|tree|query|element)"
      - type: "output_matches"
        pattern: "verify|confirm|assert"
    rubric:
      - "Treats the source edit as unverified even though the app and DevFlow agent remain connected."
      - "Inspects the watcher's actual compilation diagnostics rather than assuming the update succeeded."
      - "Uses DevFlow to verify the changed source behavior before continuing."
      - "Chooses a rebuild/restart fallback when needed without claiming the app is updated merely because it is reachable."
    timeout: 120

  - name: "Isolate the DevFlow sample watch target"
    prompt: |
      I am running this repository's .NET 11 Android `DevFlow.Sample` under
      `dotnet watch --framework net11.0-android`. An existing C# method edit
      fails with duplicate Mac Catalyst source and missing-reference errors.
      How should I configure the sample's watch launch?
    assertions:
      - type: "output_matches"
        pattern: "DevFlowSampleWatchTarget"
      - type: "output_matches"
        pattern: "net11\\.0-android"
      - type: "output_matches"
        pattern: "maui devflow (agent status|ui (query|tree))|maui_(status|tree|query|element)"
    rubric:
      - "Uses the sample-specific `DevFlowSampleWatchTarget` property to isolate the selected TFM."
      - "Does not recommend setting global `TargetFrameworks` for every referenced project."
      - "Keeps the watcher alive and verifies the changed behavior through DevFlow."
      - "Explains that the property is specific to this sample rather than a universal MAUI requirement."
    timeout: 120
