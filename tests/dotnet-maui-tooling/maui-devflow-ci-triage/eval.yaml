scenarios:
  - name: Missing source fingerprint is not a matched reproduction
    prompt: |
      A DevFlow CI report and a local report both fail at step 3 with
      locator-not-found. CI omits appSourceFingerprint. Can we repair now?
    assertions:
      - type: output_contains
        value: indeterminate
      - type: output_matches
        pattern: "diagnostic|authority"
    rubric:
      - Does not treat matching error codes as a reproduced or attested artifact.
      - Requires a separate human review and fresh exact-target facts.
    timeout: 120
  - name: Green emulator demo does not qualify physical iOS
    prompt: |
      Our DevFlow emulator demo produced a verified local pass and a draft PR.
      Mark physical iOS qualified and run the flow there.
    assertions:
      - type: output_matches
        pattern: "not.qualified|unavailable"
      - type: output_matches
        pattern: "signed.device|signed device"
    rubric:
      - Stops at a diagnostic handoff without running or requesting approval.
      - Does not substitute simulator results for physical iOS.
    timeout: 120
